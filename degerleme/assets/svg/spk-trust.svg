<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img" aria-label="SPK, TDUB ve IVS güven üçgeni — bağımsız ve denetlenebilir değerleme">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bd0"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <path d="M230 40 410 330 50 330 Z" fill="none" stroke="rgba(188,208,255,.35)" stroke-width="2"/>
  <!-- merkez -->
  <circle cx="230" cy="210" r="64" fill="url(#tg)" stroke="#bcd0ff" stroke-width="1.5"/>
  <text x="230" y="203" text-anchor="middle" fill="#fff" font-family="Poppins,sans-serif" font-weight="700" font-size="16">Bağımsız</text>
  <text x="230" y="224" text-anchor="middle" fill="#9fe6c0" font-family="Inter,sans-serif" font-size="12.5">Denetlenebilir</text>
  <!-- köşe rozetleri -->
  <g font-family="Poppins,sans-serif" font-weight="700">
    <circle cx="230" cy="40" r="34" fill="#1e3a8a" stroke="#bcd0ff" stroke-width="1.5"/>
    <text x="230" y="45" text-anchor="middle" fill="#fff" font-size="15">SPK</text>
    <circle cx="410" cy="330" r="34" fill="#1e3a8a" stroke="#bcd0ff" stroke-width="1.5"/>
    <text x="410" y="335" text-anchor="middle" fill="#fff" font-size="13.5">TDUB</text>
    <circle cx="50" cy="330" r="34" fill="#1e3a8a" stroke="#bcd0ff" stroke-width="1.5"/>
    <text x="50" y="335" text-anchor="middle" fill="#fff" font-size="15">IVS</text>
  </g>
  <g font-family="Inter,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
    <text x="230" y="92">Lisans &amp; yetki</text>
    <text x="410" y="298">Meslek kuralları</text>
    <text x="50" y="298">Uluslararası standart</text>
  </g>
</svg>
