<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="Değerleme metodolojisi: pazar, gelir ve maliyet yaklaşımı karşılaştırması">
  <style>.t{font-family:Poppins,sans-serif;font-weight:700;font-size:14px;fill:#0f172a}.s{font-family:Inter,sans-serif;font-size:11px;fill:#64748b}</style>
  <!-- Pazar (emsal scatter) -->
  <g transform="translate(20,20)">
    <rect width="270" height="170" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
    <line x1="28" y1="24" x2="28" y2="128" stroke="#cbd5e1"/><line x1="28" y1="128" x2="242" y2="128" stroke="#cbd5e1"/>
    <line x1="28" y1="84" x2="242" y2="84" stroke="#1d9e75" stroke-dasharray="4 5"/>
    <g fill="#1e3a8a"><circle cx="64" cy="70" r="5"/><circle cx="104" cy="96" r="5"/><circle cx="144" cy="76" r="5"/><circle cx="184" cy="100" r="5"/><circle cx="216" cy="72" r="5"/></g>
    <text class="t" x="16" y="156">Pazar Yaklaşımı</text><text class="s" x="16" y="172">Emsal karşılaştırma</text>
  </g>
  <!-- Gelir (bars+curve) -->
  <g transform="translate(315,20)">
    <rect width="270" height="170" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
    <line x1="28" y1="24" x2="28" y2="128" stroke="#cbd5e1"/><line x1="28" y1="128" x2="242" y2="128" stroke="#cbd5e1"/>
    <g fill="#2f5bd0"><rect x="50" y="92" width="26" height="36" rx="3"/><rect x="92" y="76" width="26" height="52" rx="3"/><rect x="134" y="60" width="26" height="68" rx="3"/><rect x="176" y="48" width="26" height="80" rx="3"/></g>
    <path d="M63 84 105 66 147 50 189 40" fill="none" stroke="#1d9e75" stroke-width="2.4"/>
    <text class="t" x="16" y="156">Gelir Yaklaşımı</text><text class="s" x="16" y="172">Kapitalizasyon / İNA</text>
  </g>
  <!-- Maliyet (depreciation) -->
  <g transform="translate(610,20)">
    <rect width="270" height="170" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
    <line x1="28" y1="24" x2="28" y2="128" stroke="#cbd5e1"/><line x1="28" y1="128" x2="242" y2="128" stroke="#cbd5e1"/>
    <path d="M28 36 C 90 60, 150 104, 242 122" fill="none" stroke="#b4975a" stroke-width="3"/>
    <g fill="#b4975a"><circle cx="28" cy="36" r="4"/><circle cx="135" cy="86" r="4"/><circle cx="242" cy="122" r="4"/></g>
    <text class="t" x="16" y="156">Maliyet Yaklaşımı</text><text class="s" x="16" y="172">Yeniden edinim − amortisman</text>
  </g>
</svg>
