<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönetim Paneli (CRM) · Meridyen Değerleme</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">














<style id="deg-inline-css">
/* ===========================================================================
   Meridyen Değerleme — SPK Lisanslı Gayrimenkul Değerleme · Kurumsal Stylesheet
   Temiz çok-dosya yapı (v2). Palet: lacivert · antrasit · beyaz · kontrollü altın/mavi.
   =========================================================================== */
:root{
  --navy:#0b1220; --navy-2:#13213f; --accent:#1e3a8a; --accent-2:#2f5bd0;
  --steel:#334155; --gold:#b4975a; --teal:#1d9e75;
  --ink:#0f172a; --ink-2:#475569; --muted:#64748b; --line:#e2e8f0;
  --surface:#f6f8fc; --surface-2:#eef2f9; --white:#fff;
  --head:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;
  --body:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;
  --r:16px; --r-sm:11px; --shadow:0 24px 60px -32px rgba(15,23,42,.35);
  --shadow-sm:0 10px 28px -18px rgba(15,23,42,.3);
  --hh:72px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--white);line-height:1.65;-webkit-font-smoothing:antialiased;padding-top:var(--hh)}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;line-height:1.16;margin:0;color:var(--ink);letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.eyebrow{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.sec{padding:58px 0}
.sec + .sec{padding-top:8px}
.sec-h{max-width:760px;margin:0 auto 34px;text-align:center}
.sec-h .eyebrow{display:block;margin-bottom:14px}
.sec-h h2{font-size:clamp(26px,3.6vw,38px)}
.sec-h p{color:var(--ink-2);font-size:17px;margin:14px 0 0}
@media(max-width:760px){.sec{padding:60px 0}.wrap{padding:0 20px}}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--head);font-weight:600;font-size:14.5px;padding:13px 24px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 16px 32px -16px rgba(30,58,138,.6)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 40px -16px rgba(30,58,138,.7)}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost-light{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.btn-ghost-light:hover{background:rgba(255,255,255,.18)}

/* ---- Header (fixed, tek satır) ---- */
.hdr{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:1000;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.5) blur(12px);border-bottom:1px solid var(--line)}
.hdr .bar{height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mk{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--navy));display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800;font-size:19px}
.brand b{font-family:var(--head);font-size:18px;font-weight:700;line-height:1.05;display:block}
.brand span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:30px}
.nav a{font-family:var(--head);font-weight:500;font-size:14.5px;color:var(--ink-2);position:relative;padding:6px 0;transition:.18s}
.nav a:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);transition:.22s}
.nav a:hover,.nav a.active{color:var(--accent)}
.nav a:hover:after,.nav a.active:after{width:100%}
.hdr-cta{display:flex;align-items:center;gap:12px}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;padding:8px;cursor:pointer}
.burger span{width:24px;height:2px;background:var(--ink);border-radius:2px;transition:.25s}
@media(max-width:980px){
  .nav{position:fixed;inset:var(--hh) 0 auto 0;flex-direction:column;align-items:stretch;gap:0;background:#fff;border-bottom:1px solid var(--line);padding:8px 0;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-sm)}
  .nav.open{transform:none;opacity:1;pointer-events:auto}
  .nav a{padding:14px 28px;border-bottom:1px solid var(--surface)}
  .nav a:after{display:none}
  .hdr-cta .btn{display:none}
  .hdr-cta .btn.js-giris{display:inline-flex;padding:9px 15px;font-size:13px}
  .burger{display:flex}
}

/* ---- Hero (2 kolon) ---- */
.hero{position:relative;background:radial-gradient(900px 500px at 88% -10%,rgba(47,91,208,.35),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--accent) 62%,var(--steel) 100%);color:#fff;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:26px 26px;pointer-events:none}
.hero .in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;padding:70px 0 76px}
.hero-main{min-width:0}
.hero .eyebrow{color:#bcd0ff}
.hero h1{color:#fff;font-size:clamp(30px,4.6vw,52px);margin:16px 0 18px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,#cfe0ff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .lead{color:#cdd8ea;font-size:17.5px;max-width:54ch;margin:0 0 28px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:30px}
.hero-badges{display:flex;gap:10px;flex-wrap:wrap}
.hero-badges span{font-size:12px;color:#dbe7fb;border:1px solid rgba(188,208,255,.3);border-radius:99px;padding:7px 13px;display:inline-flex;align-items:center;gap:7px}
.hero-badges span svg{width:14px;height:14px;color:#9fe6c0}
/* Hero sağ kurumsal panel */
.hero-panel{position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:24px;box-shadow:0 40px 80px -36px rgba(0,0,0,.6)}
.hero-panel .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#bcd0ff;margin-bottom:14px}
.hero-panel .pv{width:100%;height:auto}
.hero-panel .flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:#cdd8ea}
.hero-panel .flow b{color:#fff;font-weight:600}
.hero-panel .flow .ar{color:#9fe6c0;font-weight:800}
.hero-panel .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-panel .chips span{font-size:11px;color:#bcd0ff;border:1px solid rgba(147,180,255,.3);border-radius:99px;padding:6px 11px}
@media(max-width:980px){.hero .in{grid-template-columns:1fr;gap:36px;padding:48px 0 56px}.hero-panel{display:none}}

/* ---- Yasal güven bandı ---- */
.legalband{background:var(--surface);border-bottom:1px solid var(--line)}
.legalband .in{display:flex;gap:16px;align-items:flex-start;padding:22px 0}
.legalband .ic{width:46px;height:46px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.legalband b{font-family:var(--head);font-size:15.5px}
.legalband p{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:90ch}

/* ---- Genel grid kart ---- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:860px){.grid-3{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:.22s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#cdd8ea}
.card .ci{width:100%;height:128px;margin-bottom:16px;border-radius:12px;background:var(--surface);display:grid;place-items:center;overflow:hidden}
.card .ci svg,.card .ci img{width:auto;height:108px}
.card h3{font-size:19px;margin-bottom:8px}
.card p{color:var(--ink-2);font-size:14.5px;margin:0 0 12px}
.card ul{list-style:none;margin:0;padding:0}
.card li{position:relative;padding-left:22px;font-size:13.5px;color:var(--ink-2);margin-bottom:7px}
.card li:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.card .more{font-family:var(--head);font-weight:600;font-size:13.5px;color:var(--accent);display:inline-flex;align-items:center;gap:6px;margin-top:6px}

/* ---- Metodoloji ---- */
.meth{background:var(--surface)}
.meth .m{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center}
.meth .m .mv{height:120px;display:grid;place-items:center;margin-bottom:14px}
.meth .m .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--surface-2);border-radius:99px;padding:5px 11px;margin-bottom:8px}
.meth .m h3{font-size:18px;margin-bottom:8px}
.meth .m p{color:var(--ink-2);font-size:13.8px;margin:0}

/* ---- SPK/TDUB/IVS güven bloğu ---- */
.trust{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff}
.trust .in{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:center}
@media(max-width:860px){.trust .in{grid-template-columns:1fr;gap:32px}}
.trust .eyebrow{color:#bcd0ff}
.trust h2{color:#fff;font-size:clamp(24px,3.2vw,34px);margin:12px 0 14px}
.trust p{color:#cdd8ea;font-size:15.5px;margin:0 0 18px}
.trust .pills{display:flex;gap:10px;flex-wrap:wrap}
.trust .pills span{font-size:12.5px;color:#eaf1ff;border:1px solid rgba(188,208,255,.3);border-radius:10px;padding:9px 14px}
.trust .vis{display:grid;place-items:center}
.trust .vis svg{width:100%;max-width:440px;height:auto}

/* ---- Sorumluluk ayrımı ---- */
.resp .col{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.resp .col.platform{border-top:4px solid var(--steel)}
.resp .col.expert{border-top:4px solid var(--gold)}
.resp .col h3{font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.resp .col .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.resp .col ul{list-style:none;margin:14px 0 0;padding:0}
.resp .col li{position:relative;padding-left:26px;font-size:14px;color:var(--ink-2);margin-bottom:11px}
.resp .col li:before{content:"✓";position:absolute;left:0;top:0;color:var(--teal);font-weight:800}
.resp-flow{margin-top:30px;display:grid;place-items:center}
.resp-flow svg{width:100%;max-width:900px;height:auto}

/* ---- Başvuru süreci ---- */
.apply{background:var(--surface)}
.apply-flow{display:grid;place-items:center;margin:0 auto 34px;max-width:1000px}
.apply-flow svg{width:100%;height:auto}
.apply-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ---- CTA bandı ---- */
.ctaband{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.ctaband .in{display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;padding:46px 0}
.ctaband h2{color:#fff;font-size:clamp(22px,3vw,30px);max-width:24ch}
.ctaband p{color:#dbe7fb;margin:8px 0 0;max-width:60ch}

/* ---- Footer ---- */
.ft{background:var(--navy);color:#cdd8ea;padding:58px 0 26px}
.ft .cols{display:grid;grid-template-columns:1.5fr 1fr 1.05fr 1fr 1.05fr;gap:28px}
@media(max-width:1080px){.ft .cols{grid-template-columns:1.4fr 1fr 1fr}}
@media(max-width:860px){.ft .cols{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.ft .cols{grid-template-columns:1fr}}
.ft .brand b{color:#fff}.ft .brand span{color:#8fa6c8}
.ft p{font-size:13.5px;margin:14px 0 0;max-width:320px;color:#9fb3d4}
.ft h4{font-family:var(--head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bcd0ff;margin:0 0 16px}
.ft ul{list-style:none;margin:0;padding:0}
.ft li{margin-bottom:10px}
.ft a{font-size:13.5px;color:#9fb3d4;transition:.18s}
.ft a:hover{color:#fff}
.ft .bot{border-top:1px solid rgba(255,255,255,.1);margin-top:38px;padding-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#7f96bb}

/* ===== Faz 2 — sayfa-içi yardımcılar ===== */
.breadnav{font-size:13px;color:var(--muted);padding:14px 0 0}
.breadnav a{color:var(--accent);font-weight:600}
.taglist{display:flex;flex-wrap:wrap;gap:10px}
.taglist span{font-size:13.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;display:inline-flex;align-items:center;gap:8px}
.taglist span:before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent)}
.axis{margin-bottom:34px}
.axis h3{font-size:20px;margin-bottom:6px}
.axis .ax-d{color:var(--ink-2);font-size:14.5px;margin:0 0 16px}
.mblock{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;grid-template-columns:.7fr 1.3fr;gap:26px;align-items:center;margin-bottom:22px}
.mblock:nth-child(even){grid-template-columns:1.3fr .7fr}.mblock:nth-child(even) .mb-vis{order:2}
@media(max-width:760px){.mblock,.mblock:nth-child(even){grid-template-columns:1fr}.mblock:nth-child(even) .mb-vis{order:0}}
.mb-vis{background:var(--surface);border-radius:12px;padding:18px;display:grid;place-items:center}
.mb-vis svg{width:100%;height:auto;max-height:170px}
.mblock h3{font-size:20px;margin-bottom:6px}
.mblock .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--surface-2);border-radius:99px;padding:5px 11px;margin-bottom:8px}
.mblock p{color:var(--ink-2);font-size:14.5px;margin:0 0 10px}
.kv{display:flex;gap:8px;flex-wrap:wrap}.kv span{font-size:12px;color:var(--ink-2);background:var(--surface);border-radius:8px;padding:6px 10px}
.wideimg{display:grid;place-items:center;margin:8px auto 0;max-width:980px}.wideimg img{width:100%;height:auto}
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 24px}
.doc .row{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--surface)}
.doc .row:last-child{border-bottom:0}.doc .row b{font-family:var(--head);font-size:14.5px}
.doc .row span{color:var(--ink-2);font-size:13.5px}
@media(max-width:620px){.doc .row{grid-template-columns:1fr;gap:4px}}
.form{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;max-width:720px;margin:0 auto}
.form .fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:620px){.form .fg{grid-template-columns:1fr}}
.form label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 13px;font-family:var(--body);font-size:14.5px;color:var(--ink);outline:none;transition:.18s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,208,.12)}
.form .kvkk{display:flex;gap:9px;align-items:flex-start;margin:16px 0;font-size:13px;color:var(--ink-2)}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:18px 22px;color:var(--ink-2);font-size:14px;max-width:90ch}
.note b{color:var(--ink);font-family:var(--head)}

/* ===== Faz 3 — yeni üst menü (Hizmetlerimiz/Neden Biz/Referans/Blog/Talep + WhatsApp + Giriş) ===== */
.nav-wa{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--teal);flex:none;transition:.18s}
.nav-wa:hover{background:var(--surface);border-color:var(--teal)}
.btn-sm{padding:10px 18px;font-size:13.5px}
@media(max-width:980px){.nav-wa{display:none}}
/* Neden Biz / Referans / Blog */
.reason{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.reason .ri{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);margin-bottom:14px}
.reason h3{font-size:17px;margin-bottom:6px}.reason p{color:var(--ink-2);font-size:14px;margin:0}
.reftiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.reftiles{grid-template-columns:1fr 1fr}}@media(max-width:520px){.reftiles{grid-template-columns:1fr}}
.reftile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;align-items:center;gap:14px}
.reftile .rt-ic{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--navy));display:grid;place-items:center;color:#fff;flex:none}
.reftile b{font-family:var(--head);font-size:14.5px;display:block}.reftile span{color:var(--muted);font-size:12.5px}
.blogcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.22s}
.blogcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.blogcard .bc-top{height:110px;background:linear-gradient(135deg,var(--navy),var(--accent));display:grid;place-items:center}
.blogcard .bc-top svg{height:60px;color:#bcd0ff}
.blogcard .bc-b{padding:20px}.blogcard .tagx{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.blogcard h3{font-size:16.5px;margin:8px 0 8px}.blogcard p{color:var(--ink-2);font-size:13.8px;margin:0 0 12px}

/* ===== Faz 4 — Giriş (Personel + Müşteri Anahtar) modalı + ProX köprüsü ===== */
.gmodal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.gmodal.on{display:flex}
.gm-ov{position:absolute;inset:0;background:rgba(11,18,32,.6);backdrop-filter:blur(6px)}
.gm-card{position:relative;width:100%;max-width:440px;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:gmpop .25s ease}
@keyframes gmpop{from{transform:translateY(14px)}to{transform:none}}
.gm-x{position:absolute;top:12px;right:12px;background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;z-index:2}
.gm-head{display:flex;align-items:center;gap:12px;padding:22px 26px 4px}
.gm-head .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--navy));display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800}
.gm-head b{font-family:var(--head);font-size:16px}
.gm-tabs{display:flex;gap:6px;padding:14px 26px 0}
.gm-tabs button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-family:var(--head);font-weight:600;font-size:13.5px;padding:11px;border-radius:10px;cursor:pointer;transition:.18s}
.gm-tabs button.act{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.gm-body{padding:18px 26px 4px}
.gm-sub{color:var(--ink-2);font-size:13px;margin:0 0 14px;line-height:1.55}
.gm-body label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.gm-body input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 13px;font-family:var(--body);font-size:14.5px;outline:none;transition:.18s}
.gm-body input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,208,.12)}
.gm-body .btn{width:100%;justify-content:center;margin-top:16px;text-decoration:none}
.gm-err{font-size:12.5px;color:#dc2626;min-height:16px;margin-top:10px}
.gm-ok{font-size:13px;color:var(--teal);margin-top:10px}

/* ===== Bağımsız Yönetim Paneli (#degAdmin) + Toast ===== */
.sta-modal{position:fixed;inset:0;z-index:2100;display:none}
.sta-modal.on{display:block}
.sta-ov{position:absolute;inset:0;background:rgba(8,12,24,.62);backdrop-filter:blur(4px)}
.sta-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 44px 100px -34px rgba(0,0,0,.6);animation:gmpop .25s ease}
.sta-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.sta-hd b{font-family:var(--head);font-size:15px}
.sta-hd button{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.sta-tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.sta-tabs button{border:1px solid var(--line);background:#fff;border-radius:9px 9px 0 0;padding:9px 13px;font-family:var(--head);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s}
.sta-tabs button.act{background:var(--accent);border-color:var(--accent);color:#fff}
.sta-body{padding:20px;overflow:auto}
.sta-pane h4{margin:0 0 4px;font-family:var(--head);font-size:16px;color:var(--ink)}
.sta-pane .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.55}
.sta-f{margin-bottom:11px}
.sta-f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.sta-f input,.sta-f select,.sta-f textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:var(--body);outline:none;transition:.15s}
.sta-f input:focus,.sta-f select:focus,.sta-f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,208,.12)}
.sta-body textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:var(--body);outline:none;resize:vertical}
.sta-row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:540px){.sta-row2{grid-template-columns:1fr}}
.sta-go{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0;font-family:var(--head);font-weight:600;font-size:14px;padding:12px 20px;border-radius:10px;cursor:pointer;margin-top:6px;box-shadow:0 14px 30px -16px rgba(30,58,138,.6)}
.sta-go:hover{transform:translateY(-1px)}
.sta-out{margin-top:14px;font-size:13px;line-height:1.55}
.sta-out .ok{color:var(--teal);font-weight:600;text-decoration:none}
.sta-out .warn{color:#b45309}
.sta-out .bad{color:#dc2626}
.aa-tbl{width:100%;border-collapse:collapse;font-size:13px}
.aa-tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.aa-tbl td:last-child{text-align:right;color:var(--ink)}
.toastbox{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:13.5px;font-family:var(--head);font-weight:500;z-index:2200;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
.toastbox.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   HİZMETLERİMİZ — 2026 animasyonlu, lüks servis sayfası (hz-*)
   ============================================================ */
/* Scroll-reveal */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.75,.2,1),transform .7s cubic-bezier(.2,.75,.2,1);will-change:opacity,transform}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.07s}.reveal.d2{transition-delay:.14s}.reveal.d3{transition-delay:.21s}.reveal.d4{transition-delay:.28s}.reveal.d5{transition-delay:.35s}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
/* Animasyon keyframe'leri */
@keyframes hzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hzPulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes hzDash{to{stroke-dashoffset:0}}
@keyframes hzShine{0%{background-position:-180% 0}100%{background-position:180% 0}}
@keyframes hzSpin{to{transform:rotate(360deg)}}

/* Hizmet hero — sağ animasyonlu pano ek öğeleri */
.hz-hero-svg .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:hzDash 2.4s ease forwards .3s}
.hz-hero-svg .pulse{animation:hzPulse 2.6s ease-in-out infinite}
.hz-hero-svg .pulse.b{animation-delay:.5s}.hz-hero-svg .pulse.c{animation-delay:1s}
.hz-hero-svg .ring{transform-origin:center;animation:hzSpin 26s linear infinite}

/* Sayfa-içi kategori navigasyon şeridi */
.hz-catnav{position:sticky;top:var(--hh);z-index:60;background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hz-catnav .in{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.hz-catnav .in::-webkit-scrollbar{display:none}
.hz-catnav a{flex:none;font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;white-space:nowrap;transition:.18s}
.hz-catnav a:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}

/* İstatistik şeridi */
.hz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.hz-stat{text-align:center;padding:24px 14px;background:linear-gradient(180deg,var(--surface),#fff);border:1px solid var(--line);border-radius:15px}
.hz-stat b{display:block;font-family:var(--head);font-weight:800;font-size:32px;color:var(--accent);letter-spacing:-.02em;line-height:1}
.hz-stat span{font-size:12.5px;color:var(--ink-2);display:block;margin-top:6px}
@media(max-width:760px){.hz-stats{grid-template-columns:repeat(2,1fr)}}

/* Kategori bandı başlığı */
.hz-band{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;margin:0 0 32px}
.hz-band .no{font-family:var(--head);font-weight:800;font-size:clamp(42px,7vw,70px);line-height:.85;background:linear-gradient(125deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hz-band .bt h2{font-size:clamp(23px,3.2vw,34px);margin:0 0 8px}
.hz-band .bt p{margin:0;color:var(--ink-2);font-size:15px;max-width:84ch;line-height:1.6}
.hz-band .ln{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--gold),transparent);background-size:200% 100%;animation:hzShine 4.5s linear infinite;margin-top:14px;max-width:240px}
@media(max-width:620px){.hz-band{grid-template-columns:1fr;gap:8px}}

/* Servis kart grid */
.hz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.hz-card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px 20px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.hz-card:before{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:linear-gradient(var(--accent),var(--accent-2));transform:scaleY(0);transform-origin:top;transition:transform .3s}
.hz-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:#cdd8ea}
.hz-card:hover:before{transform:scaleY(1)}
.hz-ic{width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,var(--surface),#fff);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:16px;color:var(--accent)}
.hz-ic svg{width:34px;height:34px}
.hz-card:hover .hz-ic svg{animation:hzFloat 2.4s ease-in-out infinite}
.hz-card h3{font-size:18px;margin-bottom:8px;letter-spacing:-.01em}
.hz-card .desc{font-size:13.5px;color:var(--ink-2);line-height:1.62;margin-bottom:14px}
.hz-list{list-style:none;margin:0 0 14px;padding:0}
.hz-list li{position:relative;padding-left:21px;font-size:12.8px;color:var(--ink-2);margin-bottom:6px;line-height:1.5}
.hz-list li:before{content:"✓";position:absolute;left:0;top:0;color:var(--teal);font-weight:800;font-size:12px}
.hz-tags{display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);padding-top:13px;margin-top:auto}
.hz-tags span{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 9px}
.hz-tags span.gold{color:#8a6d2f;border-color:#e7d8b5;background:#faf5e9}

/* Değerleme yaklaşımları (gelişmiş) */
.hz-appr{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:860px){.hz-appr{grid-template-columns:1fr}}
.hz-ap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;transition:.25s}
.hz-ap:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.hz-ap .av{height:120px;border-radius:12px;background:var(--surface);display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
.hz-ap .av svg{width:100%;height:100%}
.hz-ap .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:99px;padding:4px 12px;margin-bottom:10px}
.hz-ap h3{font-size:18px;margin-bottom:7px}
.hz-ap p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 12px}
.hz-ap .use{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.hz-ap .use b{color:var(--ink-2)}

/* Süreç timeline */
.hz-steps{max-width:760px;margin:0 auto}
.hz-step{display:grid;grid-template-columns:56px 1fr;gap:20px;position:relative;padding:0 0 28px}
.hz-step:before{content:"";position:absolute;left:27px;top:10px;bottom:-4px;width:2px;background:linear-gradient(var(--accent),var(--line))}
.hz-step:last-child{padding-bottom:0}.hz-step:last-child:before{display:none}
.hz-step .dot{width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:19px;color:var(--accent);z-index:1}
.hz-step .bd h4{font-size:16.5px;margin-bottom:4px}
.hz-step .bd p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}

/* Rapor teslimat grid */
.hz-dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.hz-d{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.hz-d .di{width:40px;height:40px;flex:none;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.hz-d b{font-family:var(--head);font-size:14px;display:block;margin-bottom:3px}
.hz-d span{font-size:12.5px;color:var(--ink-2);line-height:1.5}

/* Mevzuat şeridi */
.hz-law{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
@media(max-width:860px){.hz-law{grid-template-columns:1fr;gap:24px}}
.hz-law .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hz-law .pills span{font-size:12.5px;font-weight:600;color:var(--accent);background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px}
.hz-lawvis{background:linear-gradient(160deg,var(--navy),var(--accent));border-radius:18px;padding:26px;color:#fff}
.hz-lawvis svg{width:100%;height:auto}

/* ===== Hizmet kartı "Teklif Al" + Teklif modalı ===== */
.hz-cta{margin-top:16px}
.hz-quote{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--head);font-weight:600;font-size:13.5px;color:var(--accent);background:linear-gradient(135deg,#fff,var(--surface));border:1.5px solid var(--line);border-radius:11px;padding:11px 16px;cursor:pointer;transition:.22s}
.hz-quote svg{width:15px;height:15px;transition:.22s}
.hz-quote:hover{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 16px 30px -16px rgba(30,58,138,.6);transform:translateY(-1px)}
.hz-quote:hover svg{transform:translateX(3px)}
/* Teklif modalı — gmodal kabuğunu paylaşır; ek öğeler */
.gm-chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--head);font-weight:600;font-size:12.5px;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 13px;margin-bottom:12px}
.gm-chip svg{width:14px;height:14px}
.gm-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm-row2 .gm-f label{margin-top:0}
@media(max-width:480px){.gm-row2{grid-template-columns:1fr}}

/* ============================================================
   NEDEN BİZ — saha gücü & veri altyapısı (nb-*) · 2026 animasyon
   ============================================================ */
/* Genel animasyon yardımcıları (her yerde kullanılabilir) */
.anim-draw{stroke-dasharray:660;stroke-dashoffset:660;animation:hzDash 2.3s ease forwards .25s}
.anim-pulse{animation:hzPulse 2.6s ease-in-out infinite}
.anim-pulse.b{animation-delay:.5s}.anim-pulse.c{animation-delay:1s}.anim-pulse.d{animation-delay:1.5s}
.anim-float{animation:hzFloat 4.6s ease-in-out infinite}
.anim-spin{transform-origin:center;animation:hzSpin 30s linear infinite}

/* Saha süreci — büyük animasyonlu kartlar */
.nb-proc{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:920px){.nb-proc{grid-template-columns:1fr}}
.nb-step{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 24px 22px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.nb-step:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:#cdd8ea}
.nb-no{position:absolute;top:14px;right:20px;font-family:var(--head);font-weight:800;font-size:44px;line-height:1;color:#eef2f9;z-index:0}
.nb-vis{position:relative;height:160px;border-radius:14px;background:radial-gradient(420px 200px at 72% -20%,rgba(47,91,208,.5),transparent 60%),linear-gradient(160deg,var(--navy),var(--accent));margin-bottom:18px;overflow:hidden;display:grid;place-items:center}
.nb-vis svg{width:100%;height:100%}
.nb-step h3{font-size:18.5px;margin-bottom:8px;position:relative}
.nb-step .ph{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:6px}
.nb-step p{font-size:13.6px;color:var(--ink-2);line-height:1.62;margin:0 0 12px}
.nb-step ul{list-style:none;margin:0;padding:0}
.nb-step li{position:relative;padding-left:21px;font-size:12.8px;color:var(--ink-2);margin-bottom:6px;line-height:1.5}
.nb-step li:before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:800;font-size:12px}

/* Veri altyapısı */
.nb-data{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}
@media(max-width:920px){.nb-data{grid-template-columns:1fr;gap:28px}}
.nb-data h2{font-size:clamp(24px,3.2vw,34px);margin:10px 0 14px}
.nb-data .lead2{color:var(--ink-2);font-size:15.5px;line-height:1.72;margin:0 0 20px}
.nb-feats{display:grid;gap:14px}
.nb-feat{display:flex;gap:13px;align-items:flex-start}
.nb-feat .fi{width:42px;height:42px;flex:none;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.nb-feat b{font-family:var(--head);font-size:14.5px;display:block;margin-bottom:2px}
.nb-feat span{font-size:13px;color:var(--ink-2);line-height:1.55}
.nb-chart{position:relative;background:radial-gradient(520px 240px at 82% -10%,rgba(47,91,208,.45),transparent 60%),linear-gradient(160deg,var(--navy),var(--accent));border-radius:20px;padding:30px 28px;color:#fff;box-shadow:0 44px 90px -38px rgba(0,0,0,.55)}
.nb-chart .big{font-family:var(--head);font-weight:800;font-size:clamp(36px,5.4vw,56px);letter-spacing:-.02em;line-height:1}
.nb-chart .big em{font-style:normal;color:#9fe6c0}
.nb-chart .cap{font-size:13px;color:#cdd8ea;margin:6px 0 18px}
.nb-chart svg{width:100%;height:auto;display:block}
.nb-chart .yrs{display:flex;justify-content:space-between;font-size:11px;color:#bcd0ff;margin-top:8px}

/* Neden Biz fark kartları (zengin) */
.nb-why{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:920px){.nb-why{grid-template-columns:1fr}}
.nb-w{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;transition:.25s}
.nb-w:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#cdd8ea}
.nb-w .wi{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;margin-bottom:14px}
.nb-w .wi svg{width:26px;height:26px}
.nb-w h3{font-size:17px;margin-bottom:7px}
.nb-w p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0}

/* "Çok tercih edilen" rozet (hz-card üzerinde) */
.hz-card .pref{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;letter-spacing:.04em;color:#8a6d2f;background:#faf5e9;border:1px solid #e7d8b5;border-radius:99px;padding:4px 10px}

/* ============================================================
   REFERANSLAR — ekosistem & süreç pipeline (rf-*) · 2026 animasyon
   ============================================================ */
@keyframes hzDashFlow{to{stroke-dashoffset:-22}}
.rf-link{stroke-dasharray:5 6;animation:hzDashFlow 1.4s linear infinite}
.rf-link.b{animation-duration:1.8s}.rf-link.c{animation-duration:1.1s}

/* Referans ekosistemi kartları */
.rf-eco{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:920px){.rf-eco{grid-template-columns:1fr}}
.rf-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px 20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,border-color .25s}
.rf-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.rf-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:#cdd8ea}
.rf-card:hover:before{transform:scaleX(1)}
.rf-ic{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;margin-bottom:15px}

.rf-card:hover .rf-ic svg{animation:hzFloat 2.4s ease-in-out infinite}
.rf-card h3{font-size:18px;margin-bottom:7px}
.rf-card p{font-size:13.6px;color:var(--ink-2);line-height:1.6;margin:0 0 14px}
.rf-use{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:11px;margin-top:auto}
.rf-use b{color:var(--accent)}
.rf-card .hz-cta{margin-top:14px}

/* Süreç pipeline (referans → imzalı rapor) */
.rf-pipe{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.rf-pipe:before{content:"";position:absolute;top:39px;left:9%;right:9%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));background-size:220% 100%;animation:hzShine 3.4s linear infinite;z-index:0}

.rn-ic svg{width:36px;height:36px}

}

/* Sektör/kapsam pill grid */

/* ============================================================
   BAŞVURU — talep ekranı sihirbazı (bv-*) · ileri seviye
   ============================================================ */
.bv-hero .in{grid-template-columns:.8fr 1.2fr;align-items:start;padding:52px 0 60px}
@media(max-width:980px){.bv-hero .in{grid-template-columns:1fr;gap:30px}}

.bv-mini .n{width:32px;height:32px;flex:none;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#9fe6c0;font-weight:800;font-family:var(--head);font-size:13px}

/* Form kartı */
.bv-card{background:#fff;border-radius:20px;box-shadow:0 44px 90px -38px rgba(0,0,0,.55);overflow:hidden;color:var(--ink)}
.bv-hd{padding:18px 24px;background:linear-gradient(135deg,var(--accent),var(--navy));color:#fff;display:flex;align-items:center;gap:12px}
.bv-hd .mk{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-family:var(--head);font-weight:800}

.bv-steps{display:flex;gap:6px;padding:18px 24px 0}
.bv-steps .s{flex:1;text-align:center}
.bv-steps .s .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:13px;background:var(--surface);color:var(--muted);border:1.5px solid var(--line);transition:.2s}
.bv-steps .s.act .dot{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.bv-steps .s.done .dot{background:var(--teal);color:#fff;border-color:transparent}
.bv-steps .s small{font-size:11px;color:var(--ink-2);font-weight:600}
.bv-prog{height:4px;background:var(--surface);margin:14px 24px 0;border-radius:4px;overflow:hidden}
.bv-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:33.33%;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.bv-body{padding:20px 24px 24px}
.bv-pane{display:none}.bv-pane.on{display:block;animation:gmpop .3s ease}
.bv-pane h4{font-size:15px;margin-bottom:14px;color:var(--ink)}
.bv-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.bv-row{grid-template-columns:1fr}}
.bv-f{margin-bottom:13px}
.bv-f label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.bv-f input,.bv-f select,.bv-f textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:var(--body);outline:none;background:#fff;transition:.15s;color:var(--ink)}
.bv-f input:focus,.bv-f select:focus,.bv-f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,208,.12)}
.bv-f select:disabled{background:var(--surface);color:var(--muted)}
.bv-chips{display:flex;flex-wrap:wrap;gap:8px}

.bv-chips .c{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;transition:.15s}

.bv-actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}

.bv-actions .grow{flex:1}
.bv-err{font-size:12.5px;color:#dc2626;min-height:15px;margin-top:8px}
.bv-note{font-size:11.5px;color:var(--muted);background:var(--surface);border-radius:8px;padding:9px 11px;margin-top:4px}
.bv-kvkk{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.bv-kvkk input{width:auto;margin-top:2px;flex:none}
.bv-foot{padding:13px 24px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
/* başarı */
.bv-success{display:none;padding:38px 28px 34px;text-align:center}
.bv-success.on{display:block;animation:gmpop .4s ease}
.bv-success .okc{width:72px;height:72px;border-radius:50%;background:rgba(31,158,117,.12);border:2px solid var(--teal);display:grid;place-items:center;color:var(--teal);margin:0 auto 18px}
.bv-success h3{font-size:23px;margin-bottom:8px}
.bv-success p{color:var(--ink-2);font-size:14.5px;max-width:48ch;margin:0 auto}
.bv-tno{display:inline-block;font-family:var(--head);font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 16px;margin-top:14px;letter-spacing:.04em}
.bv-summary{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin:18px auto 0;max-width:430px;font-size:13px;color:var(--ink-2)}

.bv-summary div:last-child{border-bottom:0}.bv-summary b{color:var(--ink);text-align:right}

/* ============================================================

   ============================================================ */
.ct-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:30px;align-items:stretch}
@media(max-width:900px){.ct-grid{grid-template-columns:1fr}}
.ct-info{display:grid;gap:14px;align-content:start}
.ct-row{display:flex;gap:15px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;transition:transform .2s,box-shadow .2s,border-color .2s}

.ct-row .ci{width:46px;height:46px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff}

.ct-on{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--teal)}
.ct-on i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(29,158,117,.5);animation:ctPulse 2s infinite}

.ct-map{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);min-height:360px;background:var(--surface)}
.ct-map iframe{width:100%;height:100%;min-height:360px;border:0;display:block;filter:saturate(1.05)}
.ct-pin{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--ink);box-shadow:var(--shadow-sm);display:flex;gap:8px;align-items:center;z-index:2;max-width:78%}
.ct-pin svg{width:16px;height:16px;color:var(--accent);flex:none}

/* Canlı destek (chat) */
.ct-support{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.ct-sh{display:flex;align-items:center;gap:12px;padding:16px 20px;background:linear-gradient(135deg,var(--accent),var(--navy));color:#fff}
.ct-sh .av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--head);font-weight:800;flex:none}

.ct-bot,.ct-me{max-width:84%;font-size:13.5px;line-height:1.5;padding:10px 13px;border-radius:14px}
.ct-bot{background:var(--surface);color:var(--ink-2);border-bottom-left-radius:4px;align-self:flex-start}

.ct-input{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.ct-input input{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:var(--body);outline:none}
.ct-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,208,.12)}
.ct-input button{border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:10px;padding:0 18px;font-family:var(--head);font-weight:600;font-size:14px;cursor:pointer}
.ct-quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}

.ct-quick a:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}

/* ============================================================
   SIKÇA SORULAN SORULAR (faq-*) · 2026 · SEO/akordeon
   ============================================================ */
.faq-search{position:sticky;top:var(--hh);z-index:60;background:rgba(255,255,255,.95);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:14px 0 6px}
.faq-search .box{position:relative;max-width:680px;margin:0 auto}
.faq-search input{width:100%;padding:14px 16px 14px 46px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:var(--body);outline:none;background:#fff}
.faq-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,208,.12)}
.faq-search .ic{position:absolute;left:15px;top:24px;transform:translateY(-50%);color:var(--muted)}
.faq-search .cnt{text-align:center;font-size:12px;color:var(--muted);margin-top:9px}
.faq-catnav{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}

.ft-logo:hover{background:rgba(255,255,255,.1);border-color:rgba(188,208,255,.4);transform:translateY(-2px)}

.org-top{display:flex;justify-content:center}
.org-node{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 22px;text-align:center;box-shadow:var(--shadow-sm);min-width:210px;transition:transform .22s,box-shadow .22s,border-color .22s}
.org-node:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cdd8ea}

.org-node b{font-family:var(--head);font-size:15px;display:block}
.org-node span{font-size:12px;color:var(--ink-2)}
.org-node.lead span{color:#cdd8ea}
.org-conn{width:2px;height:24px;background:linear-gradient(var(--accent),var(--line));margin:0 auto}
.org-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.org-ic{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;margin:0 auto 11px}
.org-ic svg{width:23px;height:23px}

.org-card p{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:0}

.sta-mini:hover{border-color:var(--accent)}
.sta-mini.bad{color:#dc2626;border-color:#f1c4c4}

   Sertifikalar + form kartı + kariyer + blog (ek) · 2026
   ============================================================ */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}

.crm-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}

/* ===== RTL (Arapça) ===== */
[dir="rtl"] body{direction:rtl}

/* ===== Mobil yatay-kayma güvenlik ağı + alt menü ===== */

}

/* ===== Hero paneli — ileri seviye canlı animasyon (hpx) ===== */
.hpx{overflow:hidden}
.hpx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hpx-head .cap{margin:0}
.hpx-live{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9fe6c0;white-space:nowrap}
.hpx-live i{width:7px;height:7px;border-radius:50%;background:#37d67a;animation:hpxBlink 1.9s ease-in-out infinite}
@keyframes hpxBlink{0%,100%{box-shadow:0 0 0 0 rgba(55,214,122,.55);opacity:1}55%{box-shadow:0 0 0 6px rgba(55,214,122,0);opacity:.65}}
.hpx-scene{position:relative}
.hpx-svg{width:100%;height:auto;display:block;overflow:visible}
.hpx .hl,.hpx-trend{stroke-dasharray:1;stroke-dashoffset:1;animation:hpxDraw 1.5s ease forwards}
.hpx .hl{animation-delay:calc(var(--d)*.22s + .25s)}
.hpx-trend{animation-delay:1.05s}
@keyframes hpxDraw{to{stroke-dashoffset:0}}
.hpx-tip{opacity:0;animation:hpxTip .5s ease 2.2s forwards}
@keyframes hpxTip{from{opacity:0;r:0}to{opacity:1;r:4.5px}}
.hpx-bars rect{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:hpxGrow .95s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:calc(var(--i)*.11s + .45s)}
@keyframes hpxGrow{to{transform:scaleY(1)}}
.hpx-scan{animation:hpxScan 4s ease-in-out 1.9s infinite}
@keyframes hpxScan{0%{transform:translateY(0);opacity:0}12%{opacity:.85}48%{transform:translateY(158px);opacity:.85}60%,100%{transform:translateY(158px);opacity:0}}
.hpx-seal{transform-box:fill-box;transform-origin:50% 50%;animation:hpxSealIn .7s cubic-bezier(.2,.9,.3,1.3) .35s both}
@keyframes hpxSealIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.hpx-ring{transform-box:fill-box;transform-origin:50% 50%;animation:hpxSpin 18s linear infinite}
@keyframes hpxSpin{to{transform:rotate(360deg)}}
.hpx-node{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:hpxNodeIn .5s ease forwards,hpxFloat 3.6s ease-in-out infinite;animation-delay:calc(var(--n)*.18s + 1.2s),calc(var(--n)*.5s + 1.7s)}
@keyframes hpxNodeIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes hpxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hpx-flow{animation:hpxMarch 1.1s linear infinite}
@keyframes hpxMarch{to{stroke-dashoffset:-24}}
.hpx-ticker{position:absolute;left:2px;bottom:-2px;display:flex;align-items:baseline;gap:7px;background:rgba(11,18,32,.55);backdrop-filter:blur(4px);border:1px solid rgba(159,230,192,.25);border-radius:11px;padding:6px 11px}
.hpx-ticker b{font-family:var(--head);font-weight:800;font-size:18px;color:#fff;line-height:1}
.hpx-ticker span{font-size:10px;color:#9fb3d4}
.hpx-ticker .hpx-up{font-style:normal;font-size:10.5px;font-weight:700;color:#37d67a}
.hpx-pipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.hpx-step{display:flex;align-items:center;gap:7px;font-size:12px;color:#aebfe0;opacity:.62;transition:.35s}
.hpx-step b{font-weight:600;color:#eaf1ff}
.hpx-step .hpx-dot{width:9px;height:9px;border-radius:50%;background:#54709f;transition:.35s}
.hpx-step.on{opacity:1;transform:translateY(-1px)}
.hpx-step.on .hpx-dot{background:#37d67a;box-shadow:0 0 12px 2px rgba(55,214,122,.75)}
.hpx-arw{color:#9fe6c0;font-weight:800;opacity:.45;transition:.35s}
.hpx-arw.on{opacity:1}
.hpx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hpx-stats>div{background:rgba(255,255,255,.05);border:1px solid rgba(147,180,255,.18);border-radius:12px;padding:11px 8px;text-align:center}
.hpx-stats b{display:block;font-family:var(--head);font-weight:800;font-size:19px;color:#fff;line-height:1.05}
.hpx-stats span{font-size:10.5px;color:#9fb3d4}
@media(prefers-reduced-motion:reduce){
  .hpx *{animation:none!important}
  .hpx .hl,.hpx-trend{stroke-dashoffset:0}
  .hpx-bars rect{transform:scaleY(1)}
  .hpx-tip,.hpx-node,.hpx-seal{opacity:1}
}

<script id="deg-inline-js">

    opt = opt || {};

      var ctrl = new AbortController();
      var to = setTimeout(function () { ctrl.abort(); }, 8000);
      var res = await fetch(EMLAK_API_BASE + path, {
        method: opt.method || 'GET', mode: 'cors', signal: ctrl.signal,
        headers: Object.assign({ 'Content-Type': 'application/json', 'X-Tenant-Id': EMLAK_TENANT.tenant_id, 'X-Tenant-Key': EMLAK_TENANT.tenant_key }, opt.headers || {}),
        body: opt.body ? JSON.stringify(opt.body) : null
      });
      clearTimeout(to);
      if (!res.ok) throw new Error('http ' + res.status);
      var ct = res.headers.get('content-type') || '';
      return ct.indexOf('application/json') !== -1 ? res.json() : res.blob();
    } catch (e) {
      return { fallback: true, message: String(e && e.message || e) }; // API yoksa demo/fallback

  /* ---- Yasal sayfa içeriği (admin'den override) + çerez bandı ---- */
  function degLegalApply() {
    var el = document.getElementById('legalBody'); if (!el) return;
    var page = el.getAttribute('data-page'); var pages = (degAdminLoad().pages) || {};
    var txt = (pages[page] || '').trim();
    if (!txt) return; // varsayılan yapısal metin kalır
    var html = txt.split(/\n{2,}/).map(function (blk) {
      blk = blk.replace(/^\n+|\n+$/g, ''); if (!blk) return '';
      var out = '', para = [];
      function flush() { if (para.length) { out += '<p>' + para.map(degEsc).join('<br>') + '</p>'; para = []; } }
      blk.split('\n').forEach(function (ln) {
        if (ln.indexOf('## ') === 0) { flush(); out += '<h2>' + degEsc(ln.slice(3).trim()) + '</h2>'; }
        else if (ln.indexOf('### ') === 0) { flush(); out += '<h3>' + degEsc(ln.slice(4).trim()) + '</h3>'; }
        else para.push(ln);
      });
      flush(); return out;
    }).join('');
    var upd = el.querySelector('.upd');
    el.innerHTML = (upd ? upd.outerHTML : '') + html;
  }

  function ensureTeklif() {
    var m = document.getElementById('teklifModal');
    if (m) return m;
    m = document.createElement('div'); m.className = 'gmodal'; m.id = 'teklifModal';
    m.innerHTML = teklifHTML();
    document.body.appendChild(m);
    m.addEventListener('click', function (e) { if (e.target.dataset && e.target.dataset.qclose) closeTeklif(); });
    m.querySelector('#tk_btn').addEventListener('click', degTeklifSubmit);
    return m;
  }
  window.openTeklif = function (service) {
    var m = ensureTeklif();
    var chip = m.querySelector('#tk_svc span'); if (chip) chip.textContent = service || 'Değerleme Hizmeti';
    m.dataset.service = service || '';
    var err = m.querySelector('#tk_err'); err.textContent = ''; err.style.color = '';
    m.classList.add('on');
    setTimeout(function () { var n = m.querySelector('#tk_name'); if (n) n.focus(); }, 60);
  };
  window.closeTeklif = function () { var m = document.getElementById('teklifModal'); if (m) m.classList.remove('on'); };
  async function degTeklifSubmit() {
    var m = document.getElementById('teklifModal');
    var name = (document.getElementById('tk_name') || {}).value.trim();
    var phone = (document.getElementById('tk_phone') || {}).value.trim();
    var err = document.getElementById('tk_err'); err.style.color = ''; err.textContent = '';
    if (!name) { err.textContent = '⚠ Ad soyad gereklidir.'; return; }
    if (!/[0-9]{10,}/.test(phone.replace(/\D/g, ''))) { err.textContent = '⚠ Geçerli bir telefon numarası girin.'; return; }
    var btn = document.getElementById('tk_btn'); btn.disabled = true; btn.textContent = 'Gönderiliyor…';
    var payload = { type: 'teklif', service: (m && m.dataset.service) || '', name: name, phone: phone, source: 'hizmetler' };
    window.degSaveLead(payload);
    var r = await proxApi('/api/v1/tenant/lead', { method: 'POST', body: payload });
    btn.disabled = false; btn.textContent = 'Teklif İste →';
    err.style.color = 'var(--teal)';
    err.innerHTML = '✓ Teklif talebiniz alındı' + (r && r.fallback ? ' (çevrimdışı/demo)' : '') + '. Uzmanımız en kısa sürede sizinle iletişime geçecek.';
    var n = document.getElementById('tk_name'), p = document.getElementById('tk_phone'); if (n) n.value = ''; if (p) p.value = '';
    degToast('Teklif talebiniz iletildi.');
  }

  /* ---- Scroll-reveal + sayaç (yalnız ilgili öğeler varsa) ---- */
  function degInitReveal() {
    var els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(function (e) { io.observe(e); });
  }
  function degInitCount() {
    var nums = document.querySelectorAll('[data-count]');
    if (!nums.length || !('IntersectionObserver' in window)) { nums.forEach(function (n) { n.textContent = n.getAttribute('data-count') + (n.getAttribute('data-suffix') || ''); }); return; }
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return; io.unobserve(en.target);
        var el = en.target, end = parseFloat(el.getAttribute('data-count')) || 0, suf = el.getAttribute('data-suffix') || '', t0 = null, dur = 1400;
        function step(ts) { if (!t0) t0 = ts; var p = Math.min((ts - t0) / dur, 1); var e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(end * e) + suf; if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
      });
    }, { threshold: 0.4 });
    nums.forEach(function (n) { io.observe(n); });
  }

  /* ---- SPK Lisans No (admin'den düzenlenebilir; .spk-lic düğümleri) ---- */
  function degSpkApply() {

    document.querySelectorAll('.spk-lic').forEach(function (el) { el.textContent = v; });

  /* ---- WhatsApp: tüm wa.me bağlantıları admin numarasına bağlı ---- */
  function degWaNumber() {
    var raw = '';

      var href = a.getAttribute('href') || '';

      a.setAttribute('href', 'https://wa.me/' + num + query);

  }

  /* ---- Yayınlanan ayarlar (site-config.json) + localStorage birleşimi ----
     Ziyaretçi: yayınlanan config; Yönetici tarayıcısı: localStorage canlı önizleme üste yazar. */
  function degMerge() {
    var loc = {}; try { loc = JSON.parse(localStorage.getItem('deg_admin') || '{}'); } catch (e) {}
    return Object.assign({}, window.DEG_PUBLISHED || {}, loc);
  }
  window.degSettings = degMerge;

  function degApplyApiKeys() {
    try { var a = JSON.parse(localStorage.getItem('deg_admin') || '{}'); if (a.proxKey) window.EMLAK_TENANT.tenant_key = a.proxKey; } catch (e) {}
  }
  // Yapay zeka tek giriş: önce ProX (kurum anahtarı), kota/erişim yoksa kullanıcının DeepSeek anahtarına düşer.
  window.degAi = async function (prompt, system) {
    try { var r = await proxApi('/api/v1/tenant/prox/ai', { method: 'POST', body: { prompt: prompt, system: system || '' } }); if (r && r.answer) return { answer: r.answer, source: 'prox' }; } catch (e) {}

    if (key) {
      try {
        var res = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model: 'deepseek-chat', stream: false, messages: (system ? [{ role: 'system', content: system }] : []).concat([{ role: 'user', content: prompt }]) })
        });
        if (res.ok) { var j = await res.json(); var t = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content; if (t) return { answer: t, source: 'deepseek' }; }
      } catch (e) {}

    return { fallback: true };
  };

  /* ---- Giriş tetikleyici + init ---- */
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;

  /* ---- Hero paneli canlı süreç animasyonu (Başvuru → Uzman → İmzalı Rapor) ---- */
  function degHeroAnim() {
    var pipe = document.querySelector('.hpx-pipe'); if (!pipe) return;
    var steps = [].slice.call(pipe.querySelectorAll('.hpx-step'));
    var arws = [].slice.call(pipe.querySelectorAll('.hpx-arw'));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { steps.forEach(function (s) { s.classList.add('on'); }); arws.forEach(function (a) { a.classList.add('on'); }); return; }
    var i = 0;
    function tick() {
      steps.forEach(function (s, k) { s.classList.toggle('on', k <= i); });
      arws.forEach(function (a, k) { a.classList.toggle('on', k < i); });
      i = (i + 1) % (steps.length + 1);
    }
    tick(); setInterval(tick, 1150);
    var val = document.querySelector('.hpx-ticker .hpx-num');
    if (val) {
      var base = parseFloat(val.getAttribute('data-count')) || 0, k = 0;

  }
