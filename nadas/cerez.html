<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çerez Politikası — NADAS · Cookie Policy</title>
<meta name="description" content="NADAS çerez politikası — kullandığımız zorunlu, analitik ve tercih çerezleri, süreleri ve tarayıcıdan tercihlerinizi nasıl yönetebileceğiniz.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#06101B">
<link rel="canonical" href="https://www.nadas.com.tr/cerez">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2306101B'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' text-anchor='middle' fill='%2338BDF8'%3EN%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NADAS">
<meta property="og:locale" content="tr_TR">
<meta property="og:title" content="Çerez Politikası — NADAS">
<meta property="og:description" content="NADAS internet sitesinde kullanılan çerez türleri ve çerez yönetimi hakkında bilgilendirme.">
<meta property="og:url" content="https://www.nadas.com.tr/cerez">
<meta property="og:image" content="og-index.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Çerez Politikası — NADAS">
<meta name="twitter:image" content="og-index.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"><noscript><div style="max-width:900px;margin:0 auto;padding:48px 20px;font-family:'Sora',sans-serif"><h1 style="color:#38BDF8">Çerez Politikası — NADAS</h1><p style="color:#CBD5E1">Sitemizde kullanılan çerezler hakkında bilgilendirme. Görüntülemek için JavaScript gereklidir.</p></div></noscript></div>
<script src="js/core.js?v=13"></script>
<script>
(function () {
  "use strict";
  var C = NX.C, css = NX.css;
  NX.setAccent(C.primary);

  var TICK = [["YASAL METİN", "ÇEREZ POLİTİKASI"], ["ÇEREZ TÜRLERİ", "ZORUNLU · İŞLEVSEL · ANALİTİK"], ["YÖNETİM", "TARAYICI AYARLARI"], ["KVKK UYUMLU", "AÇIK RIZA"], ["BAŞVURU", "destek@nadas.com.tr"], ["SON GÜNCELLEME", "18.07.2026"], ["SINCE 2005", "21 YIL"]];

  var FIRMA = "Nadas Gayrimenkul Bilgi İletişim Sistemleri Ticaret Limited Şirketi";
  var UPDATED = "18 Temmuz 2026";

  function P(t) { return '<p style="' + css({ fontSize: 14, lineHeight: 1.75, color: C.textSec, margin: "0 0 12px" }) + '">' + t + '</p>'; }
  function UL(items) { return '<ul style="' + css({ margin: "2px 0 12px", padding: 0, listStyle: "none", display: "flex", flexDirection: "column", gap: 8 }) + '">' + items.map(function (it) { return '<li style="' + css({ fontSize: 13.5, lineHeight: 1.6, color: C.textSec, display: "flex", gap: 10 }) + '"><span style="' + css({ color: C.primary, fontFamily: C.mono, fontSize: 11, marginTop: 3, flexShrink: 0 }) + '">→</span><span>' + it + '</span></li>'; }).join("") + '</ul>'; }
  function CookieTable() {
    var rows = [
      ["Zorunlu (Teknik)", "Oturum · site işlevi", "Sitenin temel işlevlerinin çalışması, güvenlik. Rıza gerektirmez.", C.accent],
      ["İşlevsel", "Kalıcı · 1 yıla kadar", "Dil, tema ve tercihlerinizin hatırlanması.", C.primary],
      ["Analitik", "Kalıcı · 2 yıla kadar", "Site kullanımının anonim/agregat ölçümü, iyileştirme.", C.warn],
      ["Üçüncü Taraf", "Sağlayıcıya göre değişir", "Font/altyapı sağlayıcıları kaynaklı teknik çerezler.", C.violet],
    ];
    var body = rows.map(function (r, i) { return '<div style="' + css({ display: "grid", gridTemplateColumns: "170px 150px 1fr", minWidth: 560, gap: 0, padding: "11px 14px", borderBottom: i < rows.length - 1 ? "1px solid " + C.border : "none", alignItems: "center" }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 11.5, color: r[3], fontWeight: 700, letterSpacing: "0.04em" }) + '">' + r[0] + '</span><span style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.textMut }) + '">' + r[1] + '</span><span style="' + css({ fontSize: 12.5, color: C.textSec, lineHeight: 1.5 }) + '">' + r[2] + '</span></div>'; }).join("");
    return '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, overflow: "auto", margin: "4px 0 12px" }) + '"><div style="' + css({ display: "grid", gridTemplateColumns: "170px 150px 1fr", minWidth: 560, gap: 0, fontFamily: C.mono, fontSize: 10, color: C.textFaint, padding: "10px 14px", borderBottom: "1px solid " + C.borderStrong, background: C.deep, letterSpacing: "0.08em" }) + '"><span>TÜR</span><span>SAKLAMA SÜRESİ</span><span>AMAÇ</span></div>' + body + '</div>';
  }

  var CFG = {
    code: "ÇEREZ", label: "Çerez Politikası",
    title: "Çerez (Cookie) Politikası",
    intro: "İşbu Çerez Politikası, <strong style=\"color:" + C.textPri + "\">" + FIRMA + "</strong> (“NADAS”) tarafından işletilen internet sitesinde kullanılan çerezler hakkında sizi bilgilendirmek amacıyla hazırlanmıştır. Bu politika, <a href=\"kvkk.html\" style=\"color:" + C.primary + ";text-decoration:none\">KVKK Aydınlatma Metni</a> ve <a href=\"gizlilik.html\" style=\"color:" + C.primary + ";text-decoration:none\">Gizlilik Politikası</a> ile birlikte uygulanır.",
    secs: [
      { h: "Çerez Nedir?", ps: ["Çerezler (cookies), bir internet sitesini ziyaret ettiğinizde tarayıcınız aracılığıyla cihazınıza kaydedilen küçük metin dosyalarıdır. Çerezler; sitenin düzgün çalışmasını sağlamak, tercihlerinizi hatırlamak ve site kullanımını anonim biçimde ölçmek gibi amaçlarla kullanılır."] },
      { h: "Kullandığımız Çerez Türleri", ps: ["Sitemizde aşağıdaki çerez türleri kullanılabilir. Zorunlu çerezler dışındaki çerezler yalnızca açık rızanıza dayalı olarak çalıştırılır:"], after: CookieTable() },
      { h: "Çerezleri Hangi Amaçlarla Kullanıyoruz?", list: ["Sitenin temel işlevlerinin ve güvenliğinin sağlanması", "Dil, tema ve benzeri kullanıcı tercihlerinin hatırlanması", "Site trafiğinin ve kullanım eğilimlerinin anonim/agregat olarak analiz edilmesi", "Hizmet kalitesinin ve kullanıcı deneyiminin iyileştirilmesi"] },
      { h: "Üçüncü Taraf Çerezleri", ps: ["Sitemizde yazı tipi ve altyapı hizmetleri gibi bazı fonksiyonlar için üçüncü taraf sağlayıcılar kullanılabilir. Bu sağlayıcılar kendi çerezlerini yerleştirebilir; söz konusu çerezler ilgili sağlayıcının gizlilik ve çerez politikalarına tabidir. NADAS, üçüncü taraf çerezleri pazarlama amacıyla kişisel profil oluşturmak için kullanmaz."] },
      { h: "Çerezleri Nasıl Yönetebilirsiniz?", ps: ["Çoğu tarayıcı çerezleri otomatik olarak kabul eder; ancak dilerseniz tarayıcı ayarlarınızdan çerezleri reddedebilir, silebilir veya çerez yerleştirilmeden önce uyarı almayı seçebilirsiniz:"], list: ["<strong>Chrome:</strong> Ayarlar → Gizlilik ve güvenlik → Çerezler ve diğer site verileri", "<strong>Firefox:</strong> Ayarlar → Gizlilik ve Güvenlik → Çerezler ve Site Verileri", "<strong>Safari:</strong> Tercihler → Gizlilik → Çerezleri yönet", "<strong>Edge:</strong> Ayarlar → Çerezler ve site izinleri"], after: '<div style="' + css({ marginTop: 8, padding: "10px 14px", border: "1px dashed " + C.border, background: "rgba(251,191,36,0.04)", fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.6, letterSpacing: "0.02em" }) + '">◐ Zorunlu (teknik) çerezleri devre dışı bırakmanız halinde sitenin bazı bölümleri düzgün çalışmayabilir.</div>' },
      { h: "Saklama Süreleri", ps: ["Oturum çerezleri tarayıcınızı kapattığınızda silinir. Kalıcı çerezler ise türüne göre belirli bir süre (genellikle 1–2 yıl) cihazınızda saklanır ve bu süre sonunda veya siz sildiğinizde otomatik olarak sona erer."] },
      { h: "Değişiklikler", ps: ["NADAS, işbu Çerez Politikası’nı mevzuat ve teknik gereksinimler doğrultusunda güncelleyebilir. Güncel metin her zaman bu sayfada yayımlanır. Son güncelleme tarihi: <strong style=\"color:" + C.textPri + "\">" + UPDATED + "</strong>."] },
    ],
  };

  function P0(t) { return P(t); }
  function Hero() {
    return '<section style="' + css({ padding: "22px 16px 26px", borderBottom: "1px solid " + C.borderStrong, position: "relative", overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 85% 20%, rgba(56,189,248,0.1), transparent 55%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 980, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700, marginBottom: 12 }) + '"><span style="' + css({ width: 14, height: 1, background: C.primary }) + '"></span>◆ ' + CFG.code + ' · YASAL METİN · NADAS</div>'
      + '<h1 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(1.7rem,4.4vw,2.6rem)", fontWeight: 700, lineHeight: 1.1, letterSpacing: "-0.02em", margin: 0, color: C.textPri, maxWidth: 860 }) + '">' + CFG.title + '</h1>'
      + '<div style="' + css({ marginTop: 12, display: "flex", gap: 14, flexWrap: "wrap", fontFamily: C.mono, fontSize: 10.5, color: C.textFaint, letterSpacing: "0.08em" }) + '"><span>SON GÜNCELLEME: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span><span>·</span><span>YÜRÜRLÜK: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span></div>'
      + '<div style="' + css({ marginTop: 16 }) + '">' + P0(CFG.intro) + '</div>'
      + '</div></section>';
  }
  function CompanyBox() {
    var others = [["KVKK Aydınlatma Metni", "kvkk.html"], ["Gizlilik Politikası", "gizlilik.html"], ["Çerez Politikası", "cerez.html"], ["Kullanım Koşulları", "kullanim-kosullari.html"]]
      .filter(function (x) { return x[1] !== "cerez.html"; })
      .map(function (x) { return '<a href="' + x[1] + '" style="' + css({ fontFamily: C.mono, fontSize: 11.5, color: C.primary, textDecoration: "none", letterSpacing: "0.04em", padding: "3px 0", display: "inline-block" }) + '">→ ' + x[0] + '</a>'; }).join("");
    return '<div style="' + css({ marginTop: 26, display: "grid", gridTemplateColumns: "minmax(0,1.4fr) minmax(0,1fr)", gap: 16 }) + '" class="nadas-twocol">'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◆ VERİ SORUMLUSU</div><div style="' + css({ fontSize: 13, color: C.textPri, fontWeight: 600, lineHeight: 1.5, marginBottom: 8 }) + '">' + FIRMA + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.7, letterSpacing: "0.02em" }) + '">MERSİS: 0627045662400013<br>Hastane Mah. Ayasofya Cad. Postane Sk. No: 23/5<br>Arnavutköy / İstanbul<br><a href="mailto:destek@nadas.com.tr" style="' + css({ color: C.primary, textDecoration: "none" }) + '">destek@nadas.com.tr</a></div></div>'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◈ İLGİLİ YASAL METİNLER</div><div style="' + css({ display: "flex", flexDirection: "column", gap: 4 }) + '">' + others + '</div></div>'
      + '</div>';
  }
  function Body() {
    var secs = CFG.secs.map(function (s, i) {
      return '<div style="' + css({ borderTop: i ? "1px solid " + C.border : "none", padding: "22px 0" }) + '">'
        + '<h2 style="' + css({ display: "flex", alignItems: "baseline", gap: 10, fontFamily: "'Sora',sans-serif", fontSize: "clamp(1.1rem,2.3vw,1.35rem)", fontWeight: 600, letterSpacing: "-0.01em", color: C.textPri, margin: "0 0 12px" }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 12, color: C.primary, fontWeight: 700 }) + '">' + (i + 1 < 10 ? "0" : "") + (i + 1) + '</span>' + s.h + '</h2>'
        + (s.ps ? s.ps.map(P).join("") : "")
        + (s.list ? UL(s.list) : "")
        + (s.after || "")
        + '</div>';
    }).join("");
    return '<section style="' + css({ padding: "8px 16px 30px" }) + '"><div style="' + css({ maxWidth: 980, margin: "0 auto" }) + '">' + secs + CompanyBox() + '</div></section>';
  }

  function renderApp() { return NX.Ticker(TICK) + NX.Masthead(CFG.label) + NX.Nav("") + Hero() + Body() + NX.Footer(); }
  NX.boot(renderApp);
})();
</script>
</body>
</html>
