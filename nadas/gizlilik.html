<!doctype html>

<head>

</head>
<body>
<div id="app"><noscript><div style="max-width:900px;margin:0 auto;padding:48px 20px;font-family:'Sora',sans-serif"><h1 style="color:#38BDF8">Gizlilik Politikası — NADAS</h1><p style="color:#CBD5E1">Kişisel verilerinizin gizliliğine ilişkin politikamız. Görüntülemek için JavaScript gereklidir.</p></div></noscript></div>
<script src="js/core.js?v=7"></script>
<script>
(function () {
  "use strict";
  var C = NX.C, css = NX.css;
  NX.setAccent(C.primary);

  var TICK = [["YASAL METİN", "GİZLİLİK POLİTİKASI"], ["İLKE", "AMAÇLA SINIRLI · ŞEFFAF"], ["GÜVENLİK", "ŞİFRELEME · ERİŞİM DENETİMİ"], ["VERİ SATIŞI", "YOK"], ["BAŞVURU", "destek@nadas.com.tr"], ["SON GÜNCELLEME", "18.07.2026"], ["SINCE 2005", "21 YIL"]];

  var FIRMA = "Nadas Gayrimenkul Bilgi İletişim Sistemleri Ticaret Limited Şirketi";
  var UPDATED = "18 Temmuz 2026";

  function P(t) { return '<p style="' + css({ fontSize: 14, lineHeight: 1.75, color: C.textSec, margin: "0 0 12px" }) + '">' + t + '</p>'; }
  function UL(items) { return '<ul style="' + css({ margin: "2px 0 12px", padding: 0, listStyle: "none", display: "flex", flexDirection: "column", gap: 8 }) + '">' + items.map(function (it) { return '<li style="' + css({ fontSize: 13.5, lineHeight: 1.6, color: C.textSec, display: "flex", gap: 10 }) + '"><span style="' + css({ color: C.primary, fontFamily: C.mono, fontSize: 11, marginTop: 3, flexShrink: 0 }) + '">→</span><span>' + it + '</span></li>'; }).join("") + '</ul>'; }

  var CFG = {
    code: "GİZLİLİK", label: "Gizlilik Politikası",
    title: "Gizlilik Politikası",
    intro: "<strong style=\"color:" + C.textPri + "\">" + FIRMA + "</strong> (“NADAS”) olarak gizliliğinize önem veriyoruz. İşbu Gizlilik Politikası, internet sitemiz ve hizmetlerimiz aracılığıyla toplanan bilgilerin nasıl işlendiğini açıklar. Kişisel verilerin işlenmesine ilişkin detaylı bilgi için <a href=\"kvkk.html\" style=\"color:" + C.primary + ";text-decoration:none\">KVKK Aydınlatma Metni</a>’ni inceleyebilirsiniz.",
    secs: [
      { h: "Hangi Bilgileri Topluyoruz?", ps: ["Sizinle kurduğumuz ilişkinin niteliğine göre aşağıdaki bilgileri toplayabiliriz:"], list: ["<strong>Doğrudan sağladığınız bilgiler:</strong> iletişim formu veya e-posta yoluyla ilettiğiniz ad, e-posta, telefon, kurum ve talep içeriği", "<strong>Otomatik toplanan bilgiler:</strong> IP adresi, tarayıcı/cihaz bilgisi, ziyaret edilen sayfalar ve çerez kayıtları", "<strong>Kurumsal veriler:</strong> agregat ve anonimize gayrimenkul verileri (belirli bir kişiyi tanımlamaz)"] },
      { h: "Bilgileri Nasıl Kullanıyoruz?", list: ["Taleplerinizi yanıtlamak ve size hizmet sunmak", "Hizmet kalitesini ölçmek, iyileştirmek ve geliştirmek", "Site güvenliğini sağlamak ve kötüye kullanımı önlemek", "Yasal yükümlülüklerimizi yerine getirmek"] },
      { h: "Bilgi Paylaşımı", ps: ["NADAS, kişisel verilerinizi <strong style=\"color:" + C.textPri + "\">pazarlama amacıyla üçüncü kişilere satmaz veya kiralamaz</strong>. Bilgileriniz yalnızca aşağıdaki hallerde paylaşılabilir:"], list: ["Hizmetin ifası için birlikte çalışılan güvenilir tedarikçiler ve altyapı sağlayıcıları (sözleşmesel gizlilik yükümlülüğü altında)", "Yasal zorunluluk halinde yetkili kamu kurum ve kuruluşları", "emlakekspertizi.com müşteri süreçlerinin yürütülmesi için ilgili birimler"] },
      { h: "Veri Güvenliği", ps: ["Bilgilerinizi yetkisiz erişim, kayıp ve kötüye kullanıma karşı korumak için makul idari ve teknik tedbirleri uygularız:"], list: ["Aktarımda ve saklamada uygun şifreleme yöntemleri", "Rol tabanlı erişim denetimi ve yetkilendirme", "Düzenli güvenlik gözden geçirmeleri ve günlük (log) kayıtları", "Veri minimizasyonu — yalnızca gerekli verinin toplanması"] },
      { h: "Veri Saklama Süresi", ps: ["Kişisel verileriniz, işleme amacının gerektirdiği süre ve ilgili mevzuatta öngörülen zamanaşımı/saklama süreleri boyunca saklanır; bu sürelerin sonunda silinir, yok edilir veya anonim hale getirilir."] },
      { h: "Haklarınız", ps: ["Kişisel verilerinize erişme, düzeltme, silinmesini isteme ve işlemeye itiraz etme dahil olmak üzere KVKK’nın 11. maddesinde sayılan haklara sahipsiniz. Taleplerinizi <strong style=\"color:" + C.textPri + "\">destek@nadas.com.tr</strong> adresine iletebilirsiniz. Ayrıntılar için <a href=\"kvkk.html\" style=\"color:" + C.primary + ";text-decoration:none\">KVKK Aydınlatma Metni</a>."] },
      { h: "Çocukların Gizliliği", ps: ["Hizmetlerimiz 18 yaşından küçük kişilere yönelik değildir. Bilerek çocuklardan kişisel veri toplamayız; bu yönde bir veri edinildiğinin tespiti halinde ilgili veri silinir."] },
      { h: "Üçüncü Taraf Bağlantılar", ps: ["Sitemiz, üçüncü taraf sitelere (ör. emlakekspertizi.com) bağlantılar içerebilir. Bu sitelerin gizlilik uygulamalarından NADAS sorumlu değildir; ilgili sitelerin kendi politikalarını incelemenizi öneririz."] },
      { h: "Değişiklikler ve İletişim", ps: ["Bu politika zaman zaman güncellenebilir; güncel metin her zaman bu sayfada yayımlanır. Son güncelleme: <strong style=\"color:" + C.textPri + "\">" + UPDATED + "</strong>. Sorularınız için: <strong style=\"color:" + C.textPri + "\">destek@nadas.com.tr</strong>."] },
    ],
  };

  function Hero() {
    return '<section style="' + css({ padding: "22px 16px 26px", borderBottom: "1px solid " + C.borderStrong, position: "relative", overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 85% 20%, rgba(56,189,248,0.1), transparent 55%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 980, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700, marginBottom: 12 }) + '"><span style="' + css({ width: 14, height: 1, background: C.primary }) + '"></span>◆ ' + CFG.code + ' · YASAL METİN · NADAS</div>'
      + '<h1 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(1.7rem,4.4vw,2.6rem)", fontWeight: 700, lineHeight: 1.1, letterSpacing: "-0.02em", margin: 0, color: C.textPri, maxWidth: 860 }) + '">' + CFG.title + '</h1>'
      + '<div style="' + css({ marginTop: 12, display: "flex", gap: 14, flexWrap: "wrap", fontFamily: C.mono, fontSize: 10.5, color: C.textFaint, letterSpacing: "0.08em" }) + '"><span>SON GÜNCELLEME: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span><span>·</span><span>YÜRÜRLÜK: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span></div>'
      + '<div style="' + css({ marginTop: 16 }) + '">' + P(CFG.intro) + '</div>'
      + '</div></section>';
  }
  function CompanyBox() {
    var others = [["KVKK Aydınlatma Metni", "kvkk.html"], ["Gizlilik Politikası", "gizlilik.html"], ["Çerez Politikası", "cerez.html"], ["Kullanım Koşulları", "kullanim-kosullari.html"]]
      .filter(function (x) { return x[1] !== "gizlilik.html"; })
      .map(function (x) { return '<a href="' + x[1] + '" style="' + css({ fontFamily: C.mono, fontSize: 11.5, color: C.primary, textDecoration: "none", letterSpacing: "0.04em", padding: "3px 0", display: "inline-block" }) + '">→ ' + x[0] + '</a>'; }).join("");
    return '<div style="' + css({ marginTop: 26, display: "grid", gridTemplateColumns: "minmax(0,1.4fr) minmax(0,1fr)", gap: 16 }) + '" class="nadas-twocol">'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◆ VERİ SORUMLUSU</div><div style="' + css({ fontSize: 13, color: C.textPri, fontWeight: 600, lineHeight: 1.5, marginBottom: 8 }) + '">' + FIRMA + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.7, letterSpacing: "0.02em" }) + '">MERSİS: 0627045662400013<br>Hastane Mah. Ayasofya Cad. Postane Sk. No: 23/5<br>Arnavutköy / İstanbul<br><a href="mailto:destek@nadas.com.tr" style="' + css({ color: C.primary, textDecoration: "none" }) + '">destek@nadas.com.tr</a></div></div>'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◈ İLGİLİ YASAL METİNLER</div><div style="' + css({ display: "flex", flexDirection: "column", gap: 4 }) + '">' + others + '</div></div>'
      + '</div>';
  }
  function Body() {
    var secs = CFG.secs.map(function (s, i) {
      return '<div style="' + css({ borderTop: i ? "1px solid " + C.border : "none", padding: "22px 0" }) + '">'
        + '<h2 style="' + css({ display: "flex", alignItems: "baseline", gap: 10, fontFamily: "'Sora',sans-serif", fontSize: "clamp(1.1rem,2.3vw,1.35rem)", fontWeight: 600, letterSpacing: "-0.01em", color: C.textPri, margin: "0 0 12px" }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 12, color: C.primary, fontWeight: 700 }) + '">' + (i + 1 < 10 ? "0" : "") + (i + 1) + '</span>' + s.h + '</h2>'
        + (s.ps ? s.ps.map(P).join("") : "")
        + (s.list ? UL(s.list) : "")
        + (s.after || "")
        + '</div>';
    }).join("");
    return '<section style="' + css({ padding: "8px 16px 30px" }) + '"><div style="' + css({ maxWidth: 980, margin: "0 auto" }) + '">' + secs + CompanyBox() + '</div></section>';
  }

  function renderApp() { return NX.Ticker(TICK) + NX.Masthead(CFG.label) + NX.Nav("") + Hero() + Body() + NX.Footer(); }
  NX.boot(renderApp);
})();
</script>
</body>
</html>
