  function cu(target, suf, pre) { return '<span data-cu="' + target + '"' + (suf ? ' data-suf="' + suf + '"' : '') + (pre ? ' data-pre="' + pre + '"' : '') + '>' + (pre || '') + '0' + (suf || '') + '</span>'; }

  function SectionDivider(index, title, subtitle) {

      card({ ic: "❝", tag: "KAYNAK", col: C.primary, ttl: "Kaynak gösterimi", body: "Yayına dönük çıktılarda veri kaynağı olarak NADAS/emlakekspertizi.com gösterilir. Kapsam ve biçim sözleşmeyle belirlenir." }),
      card({ ic: "◉", tag: "DENETİM", col: C.violet, ttl: "Adil kullanım & denetim", body: "Kullanım kapsam ve adil kullanımla sınırlıdır; olağan dışı desen denetlenir. Şeffaf, önceden bildirimli denetim hakkı sözleşmede tanımlanır." }),
    ].join("");
    var body = '<div style="' + grid(260, 12) + '">' + pts + '</div>'
      + note("Hukuki zemin: NADAS\'ın 480M+ kayıtlık veri tabanı, <strong style=\"color:" + C.textSec + "\">büyük emek ve yatırımla</strong> kurulmuş bir veri tabanı olarak FSEK ek m.8 kapsamında <strong style=\"color:" + C.textSec + "\">sui generis</strong> korumaya tabidir — lisanslamanın yasal dayanağı budur. Bu bölüm bilgilendirmedir; bağlayıcı şartlar imzalı lisans sözleşmesinde tanımlanır (hukuki danışmanlık değildir).");
    return SubSection("C.1", "Lisans şartları · dürüst çerçeve", "LİSANSLANIR · KAPSAM · TÜRETİLMİŞ ÜRÜN", body);
  }

  /* ===== C.2 · GÜVENLİK · KVKK · SLA ===== */
  function Compliance() {
    var pts = [
      card({ ic: "§", tag: "TESLİM GÜVENLİĞİ", col: C.accent, ttl: "Şifreli & imzalı teslim", body: "Toplu paketler AES-256 ile şifrelenir, imzalanır; taşıma TLS 1.3. API erişimi tenant anahtarı + Origin/IP kısıtı ile korunur.", list: ["AES-256 (dinlenim) · TLS 1.3 (taşıma)", "İmzalı paket · bütünlük doğrulaması", "Erişim: anahtar + allowlist"] }),

      card({ ic: "◆", tag: "DETERMİNİST", col: C.primary, ttl: "ProX · doğrulanabilir", body: "Endeks ve skorlar determinist ProX motorunun çıktısıdır — aynı girdi, aynı sonuç; halüsinasyon yok. Metodoloji dokümanı lisansla paylaşılır.", list: ["Aynı girdi → aynı çıktı", "Halüsinasyon yok", "Metodoloji dokümanı"] }),
    ].join("");
    return SubSection("C.2", "Güvenlik · KVKK · SLA", "ŞİFRELİ · KİŞİSEL VERİ ÖZENİ · TAAHHÜTLÜ", '<div style="' + grid(250, 12) + '">' + pts + '</div>');
  }

  /* ===== D · KİMLER ALIR + SÜREÇ ===== */
  function WhoProcess() {
    var who = ["Bankalar · değerleme birimleri", "Sigorta & reasürans", "GYO · fonlar · yatırım", "Belediye · kamu · planlama", "Proptech · portal · veri girişimi", "Danışmanlık & araştırma"].map(function (x) {
      return '<div style="' + css({ display: "flex", gap: 8, alignItems: "center", padding: "9px 12px", background: C.raised, border: "1px solid " + C.border, fontSize: 12.5, color: C.textSec }) + '"><span style="' + css({ color: C.violet, fontFamily: C.mono, fontSize: 11 }) + '">▸</span>' + x + '</div>';
    }).join("");
    var steps = [["01", "Kapsam", "İl/ilçe/kategori/dönem ve teslim modeli belirlenir"], ["02", "Lisans", "Şartlar, süre ve KVKK yükümlülükleri sözleşmeye yazılır"], ["03", "Kurulum", "API anahtarı açılır ya da ilk toplu paket teslim edilir"], ["04", "Güncelleme", "Canlı push veya taahhütlü periyodik paket ile süregelir"]].map(function (s) {
      return '<div style="' + css({ flex: "1 1 180px", background: C.raised, border: "1px solid " + C.borderStrong, padding: "14px 16px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.violet, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 6 }) + '">' + s[0] + '</div><div style="' + css({ fontFamily: "'Sora',sans-serif", fontSize: 14, fontWeight: 700, color: C.textPri, marginBottom: 4 }) + '">' + s[1] + '</div><div style="' + css({ fontSize: 12, color: C.textMut, lineHeight: 1.5 }) + '">' + s[2] + '</div></div>';
    }).join("");
    var body = '<div style="' + css({ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(190px,1fr))", gap: 8, marginBottom: 16 }) + '">' + who + '</div>'
      + '<div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.textFaint, letterSpacing: "0.1em", marginBottom: 8, fontWeight: 700 }) + '">◆ SÜREÇ</div>'
      + '<div style="' + css({ display: "flex", flexWrap: "wrap", gap: 8 }) + '">' + steps + '</div>'
      + note("Fiyatlandırma kapsama göre belirlenir (coğrafya · kategori · katman · teslim modeli · süre). Standart bir liste fiyatı vermeyiz; her lisans tekliflendirilir.");
    return SubSection("D.1", "Kimler alır & süreç", "KURUMSAL · 4 ADIM · TEKLİF BAZLI", body);
  }

  /* ===== ÜRÜN ===== */
  function Product() {
    return '<section style="' + css({ background: "linear-gradient(135deg, " + C.deep + " 0%, " + C.raised + " 100%)", borderTop: "2px solid " + C.violet, borderBottom: "1px solid " + C.borderStrong, padding: "40px 16px 34px", position: "relative", overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 82% 18%, rgba(34,211,238,0.13), transparent 60%), radial-gradient(circle at 10% 82%, rgba(56,189,248,0.07), transparent 50%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 1280, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, fontFamily: C.mono, fontSize: 11, letterSpacing: "0.14em" }) + '"><span style="' + css({ color: C.violet, fontWeight: 700 }) + '">◆ VERİ KAYNAĞI · NADAS ALTYAPISI</span><span style="' + css({ height: 1, flex: 1, background: C.violet, opacity: 0.4 }) + '"></span><span style="' + css({ color: C.textMut }) + '">LİSANS · TEKLİF</span></div>'
      + '<div style="' + css({ marginBottom: 16 }) + '"><img src="img/emlak-logo-full.png" alt="emlakekspertizi.com" style="' + css({ display: "block", width: 320, maxWidth: "100%", height: "auto" }) + '"><h2 style="' + css({ position: "absolute", width: 1, height: 1, overflow: "hidden", clip: "rect(0 0 0 0)", whiteSpace: "nowrap", margin: -1, padding: 0, border: 0 }) + '">emlakekspertizi.com</h2></div>'
      + '<p style="' + css({ marginTop: 8, fontSize: 15, lineHeight: 1.6, color: C.textSec, maxWidth: 960 }) + '">Lisanslanan veri, ' + pri("emlakekspertizi.com") + '\'u besleyen aynı ProX altyapısıdır — 480M+ kayıt, 257 aylık zincir, 38 boyutlu DNA. Bölgeniz için lisans kapsamı ve teklif:</p>'
      + '<div style="' + css({ marginTop: 20, display: "flex", gap: 12, flexWrap: "wrap" }) + '">'
      + '<a href="mailto:bilgi@emlakekspertizi.com" style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 22px", background: C.violet, color: C.deep, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.1em", textDecoration: "none", borderRadius: 2 }) + '">LİSANS TEKLİFİ AL →</a>'
      + '<a href="kurumsal-api.html" style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 22px", background: "transparent", color: C.primary, border: "1px solid " + C.primary, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.1em", textDecoration: "none", borderRadius: 2 }) + '">KURUMSAL API →</a>'
      + '</div></div></section>';
  }

  function renderApp() {
    return NX.Ticker(LICTICK) + NX.Masthead("Veri Lisansı") + NX.Nav("")
      + HeroLicense()
      + SectionDivider("A", "Kapsam · Ne Lisanslanır", "İL/İLÇE · KATEGORİ · KATMAN") + Scope()
      + SectionDivider("B", "Teslim Modelleri", "API · TOPLU/RAW · ON-PREMISE") + Delivery()
      + SectionDivider("C", "Şartlar · Güvenlik · Uyum", "LİSANS · KVKK · SLA") + Terms() + Compliance()
      + SectionDivider("D", "Kimler Alır & Süreç", "KURUMSAL · TEKLİF") + WhoProcess()
      + Product() + NX.Footer();
  }

  /* ===== HERO ANİMASYONU · KAPSAM → VERİ SETİ → LİSANSLI TESLİM ===== */
  function mountLicenseFlow() {
    var stage = document.getElementById("lic-stage");
    var cv = stage && document.getElementById("lic-canvas");
    if (!stage || !cv || !cv.getContext) return;
    var ctx = cv.getContext("2d");
    var capEl = document.getElementById("lic-cap"), cntEl = document.getElementById("lic-count");
    var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    var reduce = !!(mq && mq.matches);
    var W = 0, H = 0, dpr = 1, raf = 0, running = false, visible = true;
    var STEP = 1 / 60, acc = 0, last = 0, t = 0, TAU = 6.28318;
    var CY = "#38BDF8", GRN = "#34D399", VIO = "#22D3EE", WARN = "#FBBF24", GC = "#F1EAFF", MUT = "#64748B";
    var Px = 0, Ax = 0, Bx = 0, midY = 0, field = [], selRect = null, pool = [], free = [], MAX = 90, emitAcc = 0, licensed = 0, licShown = 0, selPhase = 0, selT = 0;
    var CAPS = ["İSTANBUL · KADIKÖY · KONUT", "ZAMAN SERİSİ + DNA + OLAY", "MODEL 1: API erişimi", "MODEL 2: TOPLU · on-premise", "AES-256 · imzalı teslim"];
    var capIdx = -1, capLast = 0;
    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }
    var sprites = {};
    function sprite(color) { if (sprites[color]) return sprites[color]; var r = 16, s = document.createElement("canvas"); s.width = s.height = r * 2; var sc = s.getContext("2d"), g = sc.createRadialGradient(r, r, 0, r, r, r); g.addColorStop(0, hexA(color, 1)); g.addColorStop(0.3, hexA(color, 0.5)); g.addColorStop(1, hexA(color, 0)); sc.fillStyle = g; sc.fillRect(0, 0, r * 2, r * 2); sprites[color] = s; return s; }
    function initPool() { pool = []; free = []; for (var i = 0; i < MAX; i++) { pool.push({ on: 0, ph: 0, t: 0, sp: 0, lane: 0, col: VIO, fx: 0, fy: 0, seed: 0 }); free.push(i); } }
    function alloc() { if (!free.length) return -1; var k = free.pop(); pool[k].on = 1; return k; }
    function rel(k) { pool[k].on = 0; free.push(k); }
    function buildField() {
      field = []; var cols = 9, rows = 6, x0 = W * 0.05, y0 = midY - H * 0.24, dx = (W * 0.20) / (cols - 1), dy = (H * 0.48) / (rows - 1);
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) { var inSel = c >= 3 && c <= 6 && r >= 1 && r <= 4; field.push({ x: x0 + c * dx, y: y0 + r * dy, sel: inSel, c: c, r: r }); }
      selRect = { x: x0 + 3 * dx - dx * 0.4, y: y0 + 1 * dy - dy * 0.4, w: 3 * dx + dx * 0.8, h: 3 * dy + dy * 0.8 };
    }
    function layout() { Px = W * 0.52; Ax = W * 0.86; Bx = W * 0.86; midY = H * 0.5; buildField(); }
    function emit() { var k = alloc(); if (k < 0) return; var q = pool[k]; var src = null, tries = 0; do { src = field[(Math.random() * field.length) | 0]; tries++; } while (src && !src.sel && tries < 8); q.ph = 0; q.t = 0; q.sp = 0.016 + Math.random() * 0.008; q.fx = src ? src.x : W * 0.15; q.fy = src ? src.y : midY; q.lane = Math.random() < 0.5 ? 0 : 1; q.col = q.lane === 0 ? CY : VIO; q.seed = Math.random(); }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function build() {
      W = stage.clientWidth; H = stage.clientHeight; if (!W || !H) { requestAnimationFrame(build); return; }
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); layout(); draw();
    }
    function stepSim(dt) {
      t += dt; selT += dt; selPhase = 0.5 + 0.5 * Math.sin(selT * 1.2);
      if (t - capLast > 2.0) { capLast = t; capIdx = (capIdx + 1) % CAPS.length; if (capEl) capEl.textContent = "▸ " + CAPS[capIdx]; }
      emitAcc += dt * 9; while (emitAcc >= 1) { emitAcc -= 1; emit(); }
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; q.t += q.sp; if (q.t >= 1) { q.ph++; q.t = 0; if (q.ph === 2) { licensed += 137; licShown = licensed; } if (q.ph > 2) rel(k); } }
    }
    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function node(x, col, label, sub, glow) {
      var r = Math.max(20, Math.min(H * 0.13, 32));
      var g = ctx.createRadialGradient(x, midY, 0, x, midY, r * 1.9); g.addColorStop(0, hexA(col, 0.22 + 0.16 * glow)); g.addColorStop(0.5, hexA(col, 0.05)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, midY, r * 1.9, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x, midY, r, 0, TAU); ctx.fillStyle = hexA(col, 0.08); ctx.fill(); ctx.strokeStyle = hexA(col, 0.6 + 0.3 * glow); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText(label, x, midY + r + 15); if (sub) { ctx.fillStyle = hexA(col, 0.85); ctx.fillText(sub, x, midY + r + 27); } ctx.textAlign = "left";
      return r;
    }
    function lane(x, y, col, top, bottom) {
      var w = W * 0.15, h = H * 0.19, bx = x - w / 2, by = y - h / 2;
      roundRect(bx, by, w, h, 5); ctx.fillStyle = "rgba(6,16,27,0.8)"; ctx.fill(); ctx.strokeStyle = hexA(col, 0.45); ctx.lineWidth = 1.3; ctx.stroke();
      ctx.fillStyle = hexA(col, 0.9); ctx.font = "700 9.5px " + C.mono; ctx.textAlign = "left"; ctx.fillText(top, bx + 10, by + 18);
      ctx.fillStyle = hexA("#CBD5E1", 0.6); ctx.font = "8.5px " + C.mono; ctx.fillText(bottom, bx + 10, by + 33);
      // lock glyph for bulk
      if (col === VIO) { var lx = bx + w - 20, ly = by + 14; ctx.strokeStyle = hexA(col, 0.8); ctx.lineWidth = 1.2; ctx.strokeRect(lx, ly, 10, 8); ctx.beginPath(); ctx.arc(lx + 5, ly, 3.2, Math.PI, TAU); ctx.stroke(); }
      return { x: bx, y: by, w: w, h: h };
    }
    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.02)"; ctx.lineWidth = 1;
      for (var gx = 0; gx <= W; gx += 44) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      var glow = selPhase;
      // veri alanı (sol)
      for (var i = 0; i < field.length; i++) { var f = field[i];
        ctx.beginPath(); ctx.arc(f.x, f.y, f.sel ? 2.4 : 1.6, 0, TAU);
        ctx.fillStyle = f.sel ? hexA(VIO, 0.85) : hexA("#94A3B8", 0.28); ctx.fill();
      }
      // kapsam çerçevesi
      if (selRect) { ctx.strokeStyle = hexA(VIO, 0.55 + 0.35 * glow); ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -t * 18; roundRect(selRect.x, selRect.y, selRect.w, selRect.h, 4); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = hexA(VIO, 0.9); ctx.font = "700 8px " + C.mono; ctx.textAlign = "left"; ctx.fillText("KAPSAM", selRect.x, selRect.y - 6); }
      // paket düğümü + iki lane
      var pr = node(Px, VIO, "VERİ SETİ", "paketlenir", glow);
      var apiBox = lane(Ax, midY - H * 0.16, CY, "API", "yönetilen erişim");
      var bulkBox = lane(Bx, midY + H * 0.16, VIO, "TOPLU/RAW", "on-premise");
      // bağlantı çizgileri paket→lane
      ctx.strokeStyle = hexA(CY, 0.12); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Px + pr, midY); ctx.quadraticCurveTo((Px + Ax) / 2, midY - H * 0.1, apiBox.x, midY - H * 0.16); ctx.stroke();
      ctx.strokeStyle = hexA(VIO, 0.12); ctx.beginPath(); ctx.moveTo(Px + pr, midY); ctx.quadraticCurveTo((Px + Bx) / 2, midY + H * 0.1, bulkBox.x, midY + H * 0.16); ctx.stroke();
      // parçacıklar
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col = q.col;
        if (q.ph === 0) { p = { x: lerp(q.fx, Px - pr * 0.7, q.t), y: lerp(q.fy, midY, q.t) }; col = VIO; }
        else if (q.ph === 1) { var ty = q.lane === 0 ? midY - H * 0.16 : midY + H * 0.16; p = { x: lerp(Px, q.lane === 0 ? apiBox.x : bulkBox.x, q.t), y: lerp(midY, ty, q.t) }; col = q.lane === 0 ? CY : VIO; }
        else { p = { x: q.lane === 0 ? apiBox.x : bulkBox.x, y: q.lane === 0 ? midY - H * 0.16 : midY + H * 0.16 }; col = q.lane === 0 ? CY : VIO; }
        var rr = q.ph === 0 ? 3 : 3.3; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - rr * 2, p.y - rr * 2, rr * 4, rr * 4);
        ctx.globalAlpha = 0.9; ctx.fillStyle = GC; ctx.beginPath(); ctx.arc(p.x, p.y, 1.1, 0, TAU); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText("NADAS VERİ TABANI · 480M+", W * 0.15, midY + H * 0.30); ctx.textAlign = "left";
      if (cntEl && licShown) cntEl.textContent = licShown.toLocaleString("tr-TR");
    }
    function tick(now) { if (!last) last = now; var dt = Math.min((now - last) / 1000, 0.05); last = now; acc += dt; while (acc >= STEP) { stepSim(STEP); acc -= STEP; } draw(); if (running) raf = requestAnimationFrame(tick); }
    function start() { if (running || reduce || !visible) return; running = true; last = 0; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    initPool(); build();
    if (reduce) { for (var w = 0; w < 240; w++) stepSim(STEP); draw(); }
    var rt = 0; function relayout() { clearTimeout(rt); rt = setTimeout(build, 140); }
    window.addEventListener("resize", relayout);
    if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(stage); } catch (e) {} }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
    if (mq && mq.addEventListener) mq.addEventListener("change", function (e) { reduce = e.matches; reduce ? stop() : start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (visible) start(); });
    if (window.IntersectionObserver) { try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }, { threshold: 0 }).observe(stage); } catch (e) {} }
    stage._pump = function (n) { for (var i = 0; i < (n || 60); i++) stepSim(STEP); draw(); };
    start();
  }

  NX.boot(renderApp);
  mountLicenseFlow();
  (function () {
    var els = document.querySelectorAll("[data-cu]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseFloat(el.getAttribute("data-cu")) || 0, suf = el.getAttribute("data-suf") || "", pre = el.getAttribute("data-pre") || "", start = null, dur = 1600;
        function fmt(v) { return pre + (target % 1 ? v.toFixed(2) : Math.round(v).toLocaleString("tr-TR")) + suf; }
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); el.textContent = fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () { el.textContent = fmt(target); }, 1900);
      })(els[i]);
    }
  })();
})();
</script>
