      + '<div style="'+css({display:"flex",gap:32,flexWrap:"wrap"})+'">'
      + '<div><div style="'+css({fontFamily:C.mono,fontSize:10,color:C.violet,fontWeight:700,letterSpacing:"0.12em",marginBottom:10})+'">NADAS</div>'+col1+'</div>'
      + '<div><div style="'+css({fontFamily:C.mono,fontSize:10,color:C.violet,fontWeight:700,letterSpacing:"0.12em",marginBottom:10})+'">ProX</div>'+col2+'</div>'
      + '<div><div style="'+css({fontFamily:C.mono,fontSize:10,color:C.violet,fontWeight:700,letterSpacing:"0.12em",marginBottom:10})+'">İLETİŞİM</div>'+col3+'</div>'
      + '</div></div>'
      + '<div style="'+css({paddingTop:16,borderTop:"1px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,fontFamily:C.mono,fontSize:10,color:C.textFaint,letterSpacing:"0.06em"})+'"><span>© 2005-2026 NADAS · Tüm hakları saklıdır.</span><span>ProX · DETERMİNİSTİK · HALÜSİNASYON SIFIR</span></div>'
      + '</div></footer>';
  }

  /* ===== SAYFA MONTAJI ===== */
  var PROXTICK = [
    ["ProX", "AKILLI EMLAK ASİSTANI"], ["MOTOR", "DETERMİNİSTİK"], ["HALÜSİNASYON", "SIFIR"],
    ["VERİ", "480M+ KAYIT"], ["TARİHSEL ZİNCİR", "21 YIL · 257 AY"], ["MAHALLE", "50.000+"],
    ["SOKAK BAZI", "İL · İLÇE · MAH · CAD · SOK"], ["RESMİ GAZETE", "CANLI TAKİP"],
    ["TBMM KARARI", "CANLI TAKİP"], ["HUKUK", "TAM DONANIMLI"], ["MOTOR", "ML/MML"],
    ["DİL", "TÜRKÇE OPTİMİZE"], ["ERİŞİM", "ÜCRETSİZ · PRO · API"], ["GÜVEN", "%96 MEDYAN"],
  ];
  function renderApp(){
    return NX.Ticker(PROXTICK) + NX.Masthead("ProX Asistan") + NX.Nav("ProX Asistan") + ProXFlow() + HeroProX()
      + SectionDivider("A","ProX Nedir?","TANIM · 6 TEMEL YETENEK") + ProXNedir() + ProX6Yetenek()
      + SectionDivider("B","Standart LLM Değil","7 KRİTİK FARK · KARŞILAŞTIRMA") + NedenStandartLLMDegil()
      + SectionDivider("C","Veri Altyapısı","480M KAYIT · 5 KATMAN · 27 KAYNAK") + ProXVeriAltyapisi()
        + '<div id="eko-mount">'+VeriEkosistemi()+'</div>' + VeriPipeline()
      + SectionDivider("D","Hukuk + Resmi Gazete","MEVZUAT TAKİBİ · CANLI · 7 GÜN AKIŞ") + HukukResmiGazete() + ResmiGazeteTicker()
      + SectionDivider("E","Kullanım Senaryoları","4 TİPİK ÖRNEK · GERÇEK SORU-CEVAP") + '<div id="senaryo-mount">'+KullanimSenaryolari()+'</div>'
      + SectionDivider("F","Erişim Paketleri","FREE → PRO → INVESTOR → CORPORATE → API") + ErisimPaketleri()
      + SectionDivider("G","Teknik Özellikler","20 KALEM · MOTOR + VERİ + ERİŞİM") + TeknikOzellikler()
      + EmlakEkspertiziProduct() + NX.Footer();
  }

  /* ===== ÇALIŞMA ZAMANI ===== */
  /* Bu sayfa NX.boot() kullanmıyor (kendi saat/sayaç/SEO kurulumu var), bu yüzden
     ProX wordmark dönüşümünü elle çağırıyoruz — boot içindekiyle aynı iş. */
  document.getElementById('app').innerHTML = renderApp();
  NX.proxify(document.getElementById('app'));
  mountProxFlow();

  // Saat
  function tick(){ var el=document.getElementById('mast-time'); if(el){ var d=new Date(); el.textContent=d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); } }
  tick(); setInterval(tick,1000);

  /* Sayaçlar: kayıt = GERÇEK güncel toplam (statik, sahte tik YOK). Anlık aktif sorgu +
     son güncelleme temsilî örnektir (canlı backend sayacı yok) — Math.random ile "canlı"
     üretim kaldırıldı; dürüstlük disiplini (ProX uydurmaz). */

  // Çok-alan-adı SEO: canonical + og:url + og:image mevcut domaine ayarla
  (function(){
    try {
      var o = location.origin + location.pathname;
      var can = document.querySelector('link[rel="canonical"]'); if(can) can.setAttribute('href', o);
      var ogu = document.querySelector('meta[property="og:url"]'); if(ogu) ogu.setAttribute('content', o);
      ['meta[property="og:image"]','meta[name="twitter:image"]'].forEach(function(sel){
        var m=document.querySelector(sel); if(m){ try{ m.setAttribute('content', new URL(m.getAttribute('content'), location.href).href); }catch(e){} }
      });
    } catch(e){}
  })();
})();
</script>
