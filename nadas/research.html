    var barRows = BARS.map(function (b, i) {
      var pct = Math.max(3, Math.round((b[1] / maxV) * 100)), col = cols[i % cols.length];
      return '<div style="' + css({ display: "grid", gridTemplateColumns: "88px 1fr 58px", alignItems: "center", gap: 12, padding: "5px 0" }) + '">'
        + '<span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.textSec, letterSpacing: "0.03em", whiteSpace: "nowrap" }) + '">' + b[0] + '</span>'
        + '<div style="' + css({ height: 12, background: "rgba(255,255,255,0.05)", borderRadius: 3, overflow: "hidden" }) + '"><div class="rc-bar" data-pct="' + pct + '" style="' + css({ height: 12, width: pct + "%", background: "linear-gradient(90deg," + col + "," + col + "88)", borderRadius: 3 }) + '"></div></div>'
        + '<span class="rc-val" data-val="' + b[1] + '" style="' + css({ fontFamily: "'Sora',sans-serif", fontSize: 13, fontWeight: 700, color: C.textPri, textAlign: "right" }) + '">₺' + b[1] + 'K</span></div>';
    }).join("");
    var barPanel = '<div style="' + css({ background: C.raised, border: "1px solid " + C.borderStrong, padding: "18px 18px 16px" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 6, marginBottom: 14 }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.primary, fontWeight: 700, letterSpacing: "0.1em" }) + '">◆ İL ₺/m² SIRALAMASI</span><span style="' + css({ fontFamily: C.mono, fontSize: 9, color: C.warn, letterSpacing: "0.06em" }) + '">TEMSİLÎ · amiral mahalle</span></div>'
      + barRows
      + '<div style="' + css({ marginTop: 12, fontFamily: C.mono, fontSize: 9, color: C.textFaint, letterSpacing: "0.03em", lineHeight: 1.5 }) + '">Barlar en yükseğe göre ölçekli · gerçek canlı il endeksi <a href="#" onclick="return false" style="' + css({ color: C.primary, textDecoration: "none" }) + '">C.1</a> bölümünde ve ProX API\'de.</div></div>';
    /* 21 yıllık endeks seyri — temsilî şekil (SVG path, çizilerek belirir) */
    var W = 640, H = 200, P = 10;
    var series = [10, 12, 16, 26, 22, 24, 29, 37, 45, 52, 49, 58, 66, 62, 70, 60, 68, 79, 88, 84, 92, 100];
    var n = series.length, mx = 100;
    var pts = series.map(function (v, i) { return [P + (i / (n - 1)) * (W - 2 * P), (H - P) - (v / mx) * (H - 2 * P)]; });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var area = line + " L" + (W - P) + " " + (H - P) + " L" + P + " " + (H - P) + " Z";
    var yrs = ["2005", "2010", "2015", "2020", "2026"].map(function (y, i) { return '<span style="' + css({ fontFamily: C.mono, fontSize: 9, color: C.textFaint }) + '">' + y + '</span>'; }).join("");
    var svg = '<svg id="rc-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="auto" preserveAspectRatio="none" style="' + css({ display: "block" }) + '">'
      + '<defs><linearGradient id="rcFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + C.primary + '" stop-opacity="0.28"></stop><stop offset="100%" stop-color="' + C.primary + '" stop-opacity="0"></stop></linearGradient></defs>'
      + '<path id="rc-area" d="' + area + '" fill="url(#rcFill)" opacity="0"></path>'
      + '<path id="rc-line" d="' + line + '" fill="none" stroke="' + C.primary + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path></svg>';
    var linePanel = '<div style="' + css({ background: C.raised, border: "1px solid " + C.borderStrong, padding: "18px 18px 16px", display: "flex", flexDirection: "column" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 6, marginBottom: 14 }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.primary, fontWeight: 700, letterSpacing: "0.1em" }) + '">◆ 21 YILLIK ENDEKS SEYRİ</span><span style="' + css({ fontFamily: C.mono, fontSize: 9, color: C.warn, letterSpacing: "0.06em" }) + '">TEMSİLÎ ŞEKİL · 257 AY</span></div>'
      + svg
      + '<div style="' + css({ display: "flex", justifyContent: "space-between", marginTop: 6 }) + '">' + yrs + '</div>'
      + '<div style="' + css({ marginTop: 10, fontFamily: C.mono, fontSize: 9, color: C.textFaint, letterSpacing: "0.03em", lineHeight: 1.5 }) + '">2005-01 → 2026-05 kesintisiz aylık zincir; şekil temsilîdir, gerçek seri emlakekspertizi.com endeksinde.</div></div>';
    return '<section style="' + css({ borderBottom: "1px solid " + C.borderStrong, padding: "20px 16px 34px", background: C.base }) + '">'
      + '<div style="' + css({ maxWidth: 1280, margin: "0 auto" }) + '">'
      + Eyebrow("◆ VERİ GÖRSELLEŞTİRME · KAYITTAN GRAFİĞE")
      + '<div style="' + css({ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 16, marginTop: 4 }) + '" class="nadas-twocol">' + barPanel + linePanel + '</div>'
      + '</div></section>';
  }

  /* research grafiklerinin canlanması — GSAP + IntersectionObserver (reduced-motion güvenli,
     ilerici geliştirme: JS/lib yoksa barlar son genişlikte, çizgi tam görünür kalır). */
  function mountResearchCharts() {
    var g = window.gsap;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!g || reduce || !("IntersectionObserver" in window)) return;
    var svg = document.getElementById("rc-svg");
    var sec = svg && svg.closest("section"); if (!sec) return;
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return; io.unobserve(sec);
        /* barlar: 0 → hedef genişlik (stagger) */
        var bars = sec.querySelectorAll(".rc-bar");
        g.set(bars, { width: 0 });
        g.to(bars, { width: function (i, el) { return el.getAttribute("data-pct") + "%"; }, duration: 1, ease: "power2.out", stagger: 0.06 });
        /* değerler: 0 → hedef (sayaç) */
        Array.prototype.forEach.call(sec.querySelectorAll(".rc-val"), function (el, i) {
          var t = parseFloat(el.getAttribute("data-val")) || 0, o = { v: 0 };
          g.to(o, { v: t, duration: 1.1, delay: 0.15 + i * 0.06, ease: "power1.out", onUpdate: function () { el.textContent = "₺" + Math.round(o.v) + "K"; }, onComplete: function () { el.textContent = "₺" + t + "K"; } });
        });
        /* çizgi: çizilerek belir + alan fade */
        var ln = document.getElementById("rc-line"), ar = document.getElementById("rc-area");
        if (ln && ln.getTotalLength) {
          var L = ln.getTotalLength();
          g.set(ln, { strokeDasharray: L, strokeDashoffset: L });
          g.to(ln, { strokeDashoffset: 0, duration: 1.6, ease: "power1.inOut", clearProps: "strokeDasharray,strokeDashoffset" });
        }
        if (ar) g.to(ar, { opacity: 1, duration: 1, delay: 0.6, ease: "power1.out" });
      });
    }, { threshold: 0.25 });
    io.observe(sec);
  }

  /* ===== MONTAJ ===== */
  /* ===== ProX VERİ HATTI — GSAP koreografili SVG pipeline (kaynaktan karara) ===== */
  function ResearchPipeline() {
    var VW = 960, VH = 172, cy = 80, NW = 150, NH = 54, ny = cy - NH / 2, X0 = 175, X1 = 785;
    var nodes = [
      { cx: 100, t: "VERİTABANI", n: "01", c: C.accent },
      { cx: 290, t: "HAZIRLIK", n: "02", c: C.accent },
      { cx: 480, t: "ProX", n: "03", c: C.primary, core: true },
      { cx: 670, t: "ENDEKS", n: "04", c: C.violet },
      { cx: 860, t: "API · RAPOR", n: "05", c: C.violet }
    ];
    var conns = "";
    for (var i = 0; i < nodes.length - 1; i++) {
      var x1 = nodes[i].cx + NW / 2, x2 = nodes[i + 1].cx - NW / 2;
      conns += '<line class="rp-conn" x1="' + x1 + '" y1="' + cy + '" x2="' + x2 + '" y2="' + cy + '" stroke="' + C.borderStrong + '" stroke-width="1.5" stroke-dasharray="3 5"></line>';
    }
    var pkts = "";
    for (var p = 0; p < 6; p++) pkts += '<circle class="rp-pkt" cx="' + X0 + '" cy="' + cy + '" r="3.4" fill="' + C.accent + '" opacity="0"></circle>';
    var nodeSvg = nodes.map(function (nd) {
      var x = nd.cx - NW / 2;
      var extra = nd.core
        ? '<circle id="rp-glow" cx="' + nd.cx + '" cy="' + cy + '" r="40" fill="url(#rpGlow)" opacity="0.4"></circle>'
        + '<circle id="rp-ring" cx="' + nd.cx + '" cy="' + cy + '" r="40" fill="none" stroke="' + C.primary + '" stroke-width="1.4" stroke-dasharray="5 9" opacity="0.55"></circle>'
        : '';
      return '<g class="rp-node">' + extra
        + '<rect x="' + x + '" y="' + ny + '" width="' + NW + '" height="' + NH + '" rx="8" fill="' + C.raised + '" stroke="' + nd.c + '" stroke-width="' + (nd.core ? 2 : 1.2) + '"></rect>'
        + '<text x="' + (x + 12) + '" y="' + (ny + 19) + '" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="' + nd.c + '">' + nd.n + '</text>'
        + '<text x="' + nd.cx + '" y="' + (ny + 37) + '" text-anchor="middle" font-family="Sora,sans-serif" font-size="15" font-weight="700" fill="' + C.textPri + '">' + nd.t + '</text>'
        + '</g>';
    }).join("");
    var svg = '<svg id="rp-svg" viewBox="0 0 ' + VW + ' ' + VH + '" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ProX veri hattı: veritabanı, hazırlık, ProX model, endeks, API" style="' + css({ display: "block" }) + '">'
      + '<defs><radialGradient id="rpGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="' + C.primary + '" stop-opacity="0.55"></stop><stop offset="100%" stop-color="' + C.primary + '" stop-opacity="0"></stop></radialGradient></defs>'
      + conns + pkts + nodeSvg + '</svg>';
    var stage = '<div id="rp-stage" style="' + css({ position: "relative", overflow: "hidden", border: "1px solid " + C.borderStrong, borderRadius: 5, background: "radial-gradient(130% 150% at 50% 18%, #12161b 0%, #0b0d0f 52%, #060708 100%)", marginTop: 14, padding: "30px 14px 22px" }) + '">'
      + '<div style="' + css({ position: "absolute", left: 14, top: 12, fontFamily: C.mono, fontSize: 9, color: C.textFaint, letterSpacing: "0.12em", fontWeight: 700, pointerEvents: "none" }) + '">◆ KAYNAK → MODEL → ÇIKTI</div>'
      + '<div style="' + css({ position: "absolute", right: 14, top: 12, display: "inline-flex", alignItems: "center", gap: 6, fontFamily: C.mono, fontSize: 8.5, color: C.accent, letterSpacing: "0.12em", pointerEvents: "none" }) + '"><span style="' + css({ width: 7, height: 7, borderRadius: 9999, background: C.accent, animation: "nadasPulse 1.4s ease-in-out infinite" }) + '"></span>CANLI · DETERMİNİST</div>'
      + svg
      + '<div id="rp-cap" style="' + css({ position: "absolute", left: 14, bottom: 12, right: 14, fontFamily: C.mono, fontSize: 9.5, color: C.textMut, letterSpacing: "0.04em", pointerEvents: "none", lineHeight: 1.4 }) + '">▸ 480M+ kayıt · ProX motorunda deterministik işlenir — aynı sorgu → aynı sonuç</div></div>';
    var legend = [
      ["01", "VERİTABANI", "480M+ kayıt · 21 yıl", C.accent],
      ["02", "VERİ HAZIRLAMA", "temizle · normalize · eşle", C.accent],
      ["03", "ProX MODELİ", "ML · MML · determinist", C.primary],
      ["04", "ENDEKS ÇIKTISI", "il · ilçe · mahalle ₺/m²", C.violet],
      ["05", "API · RAPOR", "REST/WS · PDF · dashboard", C.violet]
    ].map(function (o) {
      return '<div style="' + css({ display: "flex", alignItems: "baseline", gap: 7, minWidth: 0 }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 9, color: o[3], fontWeight: 700, letterSpacing: "0.08em" }) + '">' + o[0] + '</span><div style="' + css({ minWidth: 0 }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 9.5, color: C.textPri, fontWeight: 700, letterSpacing: "0.03em", lineHeight: 1.2 }) + '">' + o[1] + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 8, color: C.textFaint, lineHeight: 1.25 }) + '">' + o[2] + '</div></div></div>';
    }).join('<span style="' + css({ color: C.textFaint, alignSelf: "center" }) + '">›</span>');
    var legendRow = '<div style="' + css({ display: "flex", flexWrap: "wrap", gap: "6px 10px", alignItems: "center", marginTop: 10, padding: "10px 12px", background: "rgba(6,16,27,0.5)", border: "1px solid " + C.border, borderRadius: 3 }) + '">' + legend + '</div>';
    return '<section style="' + css({ position: "relative", padding: "20px 16px 6px", background: C.base, overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "relative", maxWidth: 1280, margin: "0 auto" }) + '">'
      + Eyebrow("◆ ProX VERİ HATTI · KAYNAKTAN KARARA · DETERMİNİST MODEL")
      + stage + legendRow + '</div></section>';
  }

  /* GSAP koreografi — reveal + sürekli veri akışı (paketler ProX'te renk değiştirir).
     prefers-reduced-motion / gsap yoksa: statik görünür (ilerici geliştirme). */
  function mountResearchPipeline() {
    var svg = document.getElementById("rp-svg"); if (!svg) return;
    var g = window.gsap;
    var nodes = svg.querySelectorAll(".rp-node"), conns = svg.querySelectorAll(".rp-conn"), pkts = svg.querySelectorAll(".rp-pkt");
    var ring = svg.querySelector("#rp-ring"), glow = svg.querySelector("#rp-glow");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!g || reduce) {
      Array.prototype.forEach.call(pkts, function (pk, i) {
        if (i < 3) { pk.setAttribute("cx", 290 + i * 190); pk.setAttribute("opacity", "0.9"); pk.setAttribute("fill", i < 1 ? C.accent : C.violet); }
      });
      return;
    }
    var PROX = 480, X0 = 175, X1 = 785, HALF = 1.7, ORIGIN = "480 80", GREEN = C.accent, VIOLET = C.violet;
    g.set(nodes, { opacity: 0, scale: 0.86, transformOrigin: "center center" });
    g.set(conns, { opacity: 0 });
    var started = false;
    function play() {
      if (started) return; started = true;
      var tl = g.timeline();
      tl.to(nodes, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)", stagger: 0.11 })
        .to(conns, { opacity: 1, duration: 0.4, stagger: 0.08 }, "-=0.25");
      if (ring) g.to(ring, { rotation: 360, duration: 9, ease: "none", repeat: -1, svgOrigin: ORIGIN });
      if (glow) g.to(glow, { opacity: 0.72, scale: 1.12, duration: 1.6, ease: "sine.inOut", repeat: -1, yoyo: true, svgOrigin: ORIGIN });
      Array.prototype.forEach.call(pkts, function (pk, i) {
        var t = g.timeline({ repeat: -1, delay: i * 0.55 });
        t.set(pk, { attr: { cx: X0, fill: GREEN }, opacity: 1 })
          .to(pk, { attr: { cx: PROX }, duration: HALF, ease: "none" })
          .set(pk, { attr: { fill: VIOLET } })
          .to(pk, { attr: { cx: X1 }, duration: HALF, ease: "none" })
          .set(pk, { opacity: 0 });
      });
    }
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { io.disconnect(); play(); } }, { threshold: 0.2 });
      io.observe(svg);
    } else { play(); }
  }

  function renderApp() {
    return NX.Ticker(RESTICK) + NX.Masthead("Research") + NX.Nav("Research") + ResearchPipeline() + HeroResearch() + FeaturedReport()
      + ResearchCharts()
      + SectionDivider("A", "Son Blog Yazıları", "emlakekspertizi.com/blog · 22.176 YAZI · AYLIK ANALİZ") + LatestResearchFeed()
      + SectionDivider("B", "İçerik Kategorileri", "KONUT · TİCARİ · ARSA · TURİSTİK · PİYASA BÜLTENİ") + ResearchCategories()
      + SectionDivider("C", "Canlı Endeksler", "ProX ENDEKS · GERÇEK m² · İL BAZINDA · CANLI") + IndicesLiveData()
      + SectionDivider("D", "Editorial · Kavram Rehberleri", "DNA · OLAY · TARİHSEL ZİNCİR · ProX") + EditorialReports()
      + SectionDivider("E", "Metodoloji", "6 PRENSİP · ŞEFFAF · DOĞRULANABİLİR") + MethodologySection()
      + SectionDivider("F", "Blog & Bülten", "YENİ YAZI BİLDİRİMİ · AYLIK ÖZET") + SubscribeBlock()
      + Product() + NX.Footer();
  }

  if (window.__PAGE_I18N) NX.setPageI18n(window.__PAGE_I18N);
  NX.boot(renderApp);
  mountResearchPipeline();
  mountResearchCharts();

  // Hero canlı sayaç animasyonu (CountUp) — görünür sekmede rAF animasyonu,
  // gizli sekmede (rAF çalışmaz) setTimeout geri-dönüşü son değeri garanti eder.
  (function () {
    var els = document.querySelectorAll('[id^="cu-"]');
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseInt(el.getAttribute("data-target"), 10) || 0, start = null, dur = 1600;
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); var v = target * (1 - Math.pow(1 - p, 3)); el.textContent = Math.round(v).toLocaleString("tr-TR"); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () {
          var cur = parseInt((el.textContent || "0").replace(/\D/g, ""), 10) || 0;
          if (cur < target) el.textContent = target.toLocaleString("tr-TR");
        }, 1900);
      })(els[i]);
    }
  })();

  // Canlı il endeksi — gerçek ProX endeks (il bazında konut ₺/m² + veri güven)
  var EMLAK_API_BASE = "https://www.emlakekspertizi.com";
  var EMLAK_TENANT = { tenant_id: "nadas", tenant_key: "prox_nadas_43ffdf3fe0501d5510e71616b618cfea" };   /* istemci-tarafı görünür; salt-okunur/alan-kısıtlı olmalı */
  function proxApi(path) {
    if (!EMLAK_TENANT.tenant_key) return Promise.resolve({ fallback: true });
    return fetch(EMLAK_API_BASE + path, { mode: "cors", headers: { "X-Tenant-Id": EMLAK_TENANT.tenant_id, "X-Tenant-Key": EMLAK_TENANT.tenant_key } }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).catch(function () { return { fallback: true }; });
  }
  (function () {
    if (location.protocol === "file:") return;   // CORS 403 → boş bırak
    RES_CITIES.forEach(function (c) {
      var path = "/api/v1/tenant/endeks?il=" + encodeURIComponent(c.il) + "&kategori=konut&durum=satilik";
      var to = new Promise(function (res) { setTimeout(function () { res({ fallback: true }); }, 6000); });
      Promise.race([proxApi(path), to]).then(function (r) {
        var m2El = document.getElementById("idx-m2-" + c.k), dEl = document.getElementById("idx-d-" + c.k), dot = document.getElementById("idx-dot-" + c.k);
        if (r && r.success === true && !r.fallback && r.data && +r.data.m2 > 0) {
          if (m2El) m2El.textContent = "₺" + Math.round(+r.data.m2).toLocaleString("tr-TR");
          if (dEl) {
            var parts = [];
            if (typeof r.data.delta === "number" && Math.abs(r.data.delta) >= 0.1) parts.push((r.data.delta >= 0 ? "▲" : "▼") + Math.abs(r.data.delta).toFixed(1) + "%");
            if (typeof r.data.score === "number" && r.data.score > 0) parts.push("güven %" + Math.round(r.data.score));
            dEl.textContent = parts.join(" · ") || "canlı"; dEl.style.color = C.accent;
          }
          if (dot) { dot.style.background = C.accent; dot.style.animation = "nadasPulse 1.6s ease-in-out infinite"; }
        } else if (dEl) { dEl.textContent = "veri yok"; }
      });
    });
  })();

  // Research bülteni formu — hafif onay
  (function () {
    var btn = document.getElementById("rs-submit");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var mail = (document.getElementById("rs-email") || {}).value || "";
      var st = document.getElementById("rs-status");
      if (!st) return;
      st.style.display = "block";
      if (!mail.trim() || mail.indexOf("@") < 0) { st.style.color = "#fca5a5"; st.textContent = "Lütfen geçerli bir e-posta adresi girin."; return; }
      st.style.color = C.accent;
      st.textContent = "✓ Aboneliğiniz alındı. İlk bülten en yakın yayında.";
      btn.textContent = "ABONE OLUNDU ✓";
      btn.disabled = true;
      btn.style.opacity = "0.7";
    });
  })();
})();
</script>
