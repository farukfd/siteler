      + '<button id="rs-submit" type="button" style="' + css({ width: "100%", padding: "12px", background: C.primary, color: C.deep, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.12em", border: "none", cursor: "pointer", borderRadius: 2 }) + '">RESEARCH BÜLTENİNE ABONE OL →</button>'
      + '<div id="rs-status" style="' + css({ marginTop: 10, fontFamily: C.mono, fontSize: 10, letterSpacing: "0.04em", lineHeight: 1.5, display: "none" }) + '"></div>'
      + '<div style="' + css({ marginTop: 10, fontFamily: C.mono, fontSize: 9.5, color: C.textFaint, letterSpacing: "0.04em", lineHeight: 1.5 }) + '">KVKK kapsamında verileriniz korunur. İstediğiniz zaman abonelikten çıkabilirsiniz. Kurumsal erişim için <a href="cozumler.html#kurumsal-iletisim" style="' + css({ color: C.primary, textDecoration: "none", fontWeight: 600 }) + '">kurumsal abonelik →</a></div>'
      + '</div></div></div></section>';
  }

      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 80% 20%, rgba(56,189,248,0.12), transparent 60%), radial-gradient(circle at 10% 80%, rgba(167,139,250,0.08), transparent 50%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 1280, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "center", gap: 10, marginBottom: 18, fontFamily: C.mono, fontSize: 11, letterSpacing: "0.14em" }) + '"><span style="' + css({ color: C.primary, fontWeight: 700 }) + '">◆ ÜRÜN · RESEARCH\'TEN KARAR PLATFORMUNA</span><span style="' + css({ height: 1, flex: 1, background: C.primary, opacity: 0.4 }) + '"></span><span style="' + css({ color: C.textMut }) + '">NADAS ALTYAPISI ÜZERİNDE</span></div>'
      + '<div style="' + css({ display: "grid", gridTemplateColumns: "auto 1fr", gap: 22, alignItems: "center", marginBottom: 14 }) + '" class="nadas-twocol">'
      + NX.EmlakEkspertiziLogo(88)
      + '<div><h2 style="' + css({ fontFamily: "'Sora',sans-serif", fontSize: "clamp(1.8rem,4.6vw,3rem)", fontWeight: 700, lineHeight: 1.05, letterSpacing: "-0.025em", margin: 0, color: C.textPri }) + '"><span style="' + css({ color: "#fff" }) + '">emlak</span><span style="' + css({ color: "#2DD4BF" }) + '">ekspertizi</span><span style="' + css({ color: C.accent }) + '">.com</span></h2>'
      + '<div style="' + css({ fontFamily: C.mono, fontSize: 11, color: "#2DD4BF", letterSpacing: "0.18em", marginTop: 4, fontWeight: 700 }) + '">DEĞERİNİ ŞİMDİ ÖĞREN</div></div></div>'
      + '<p style="' + css({ marginTop: 8, fontSize: 15, lineHeight: 1.6, color: C.textSec, maxWidth: 960 }) + '">Research\'te yayınlanan analizleri tek tek mahalle, tek tek varlık için almak isteyenler için <strong style="' + css({ color: C.textPri }) + '">emlakekspertizi.com</strong>. SPK lisanslı uzmanlardan resmi ekspertiz, ProX akıllı asistanından derinlemesine karar analizi.</p>'
      + '<div style="' + css({ marginTop: 22, display: "flex", gap: 12, flexWrap: "wrap" }) + '">'
      + '<a href="https://www.emlakekspertizi.com" style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 22px", background: C.primary, color: C.deep, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.1em", textDecoration: "none", borderRadius: 2 }) + '">EMLAKEKSPERTIZI.COM →</a>'

      + '</div></div></section>';
  }

  /* ===== MONTAJ ===== */
  function renderApp() {
    return NX.Ticker(RESTICK) + NX.Masthead("Research") + NX.Nav("Research") + HeroResearch() + FeaturedReport()
      + SectionDivider("A", "Son Araştırmalar", "LATEST · 8 RAPOR · EYLÜL 2026") + LatestResearchFeed()
      + SectionDivider("B", "Araştırma Kategorileri", "5 SERİ · YILLIK 50+ RAPOR") + ResearchCategories()
      + SectionDivider("C", "Canlı Endeksler", "LIVE INDICES · 12 GÖSTERGE · REAL-TIME") + IndicesLiveData()
      + SectionDivider("D", "Editorial & Özel Yazılar", "UZUN FORM · METHODOLOGY · DATA · HISTORY") + EditorialReports()
      + SectionDivider("E", "Metodoloji", "6 PRENSİP · ŞEFFAF · DOĞRULANABİLİR") + MethodologySection()
      + SectionDivider("F", "Basın & Medya", "BLOOMBERG · DÜNYA · HABERTÜRK · AA · CNN") + PressMentions()
      + SectionDivider("G", "Research Bülteni", "ABONE OL · ÜCRETSİZ · HAFTALIK/AYLIK/ÇEYREKLİK") + SubscribeBlock()
      + Product() + NX.Footer();
  }

  NX.boot(renderApp);

  // Hero canlı sayaç animasyonu (CountUp) — görünür sekmede rAF animasyonu,
  // gizli sekmede (rAF çalışmaz) setTimeout geri-dönüşü son değeri garanti eder.
  (function () {
    var els = document.querySelectorAll('[id^="cu-"]');
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseInt(el.getAttribute("data-target"), 10) || 0, start = null, dur = 1600;
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); var v = target * (1 - Math.pow(1 - p, 3)); el.textContent = Math.round(v).toLocaleString("tr-TR"); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () {
          var cur = parseInt((el.textContent || "0").replace(/\D/g, ""), 10) || 0;
          if (cur < target) el.textContent = target.toLocaleString("tr-TR");
        }, 1900);
      })(els[i]);
    }
  })();

  // Research bülteni formu — hafif onay
  (function () {
    var btn = document.getElementById("rs-submit");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var mail = (document.getElementById("rs-email") || {}).value || "";
      var st = document.getElementById("rs-status");
      if (!st) return;
      st.style.display = "block";
      if (!mail.trim() || mail.indexOf("@") < 0) { st.style.color = "#fca5a5"; st.textContent = "Lütfen geçerli bir e-posta adresi girin."; return; }
      st.style.color = C.accent;
      st.textContent = "✓ Aboneliğiniz alındı. İlk bülten en yakın yayında.";
      btn.textContent = "ABONE OLUNDU ✓";
      btn.disabled = true;
      btn.style.opacity = "0.7";
    });
  })();
})();
