<script>
(function () {
  "use strict";
  var C = NX.C, css = NX.css;
  if (window.__PAGE_I18N) NX.setPageI18n(window.__PAGE_I18N);

  /* ===== ProX / emlakekspertizi CANLI backend (Veri Terminali) ======================
     NADAS kurumsal tenant anahtarı doldurulunca terminal GERÇEK endekse bağlanır.
     Anahtar boş / erişilemez ise dürüstçe 'TEMSİLÎ ÖRNEK'e düşer — sahte 'CANLI' YOK. */
  var EMLAK_API_BASE = "https://www.emlakekspertizi.com";
  var EMLAK_TENANT = { tenant_id: "nadas", tenant_key: "" };   /* NADAS kurumsal ProX anahtarı — canlı endeks. NOT: istemci-tarafı görünür; salt-okunur/alan-kısıtlı olmalı. */
  function proxApi(path, opts) {
    if (!EMLAK_TENANT.tenant_key) return Promise.resolve({ fallback: true });
    opts = opts || {};
    var init = { mode: "cors", headers: { "X-Tenant-Id": EMLAK_TENANT.tenant_id, "X-Tenant-Key": EMLAK_TENANT.tenant_key } };
    if (opts.method) init.method = opts.method;
    if (opts.body) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
    return fetch(EMLAK_API_BASE + path, init)
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .catch(function () { return { fallback: true }; });
  }
  var DT_REAL = {};   /* "il|ilce|mah|cat" → {m2,delta,score,ilan,veri,kapsam,trend[]} (gerçek) | null */
  function dtKey() { return DT.city + "|" + DT.district + "|" + DT.neighborhood + "|" + DT.catId; }
  function dtCanli() { return !!DT_REAL[dtKey()]; }
  /* seçili kategori → API parametreleri. API yalnız konut|ticari|arsa + satilik|kiralik destekler;
     bina→konut, turistik→ticari eşlenir; durum kategori adındaki -Kir/-Sat'tan türetilir. */
  function dtApiParams() {
    var gc = catGroupName(DT.catId);
    var katMap = { konut: "konut", bina: "konut", turistik: "ticari", ticari: "ticari", arsa: "arsa" };
    return { kategori: katMap[gc.group] || "konut", durum: /kir/i.test(gc.catName) ? "kiralik" : "satilik" };
  }
  function dtLoadReal() {
    var key = dtKey();
    if (key in DT_REAL) return;   /* soruldu (gerçek ya da null) — tekrar sorma, döngü yok */
    var ap = dtApiParams();
    var q = "il=" + encodeURIComponent(DT.city) + "&ilce=" + encodeURIComponent(DT.district) + "&mahalle=" + encodeURIComponent(DT.neighborhood) + "&kategori=" + ap.kategori + "&durum=" + ap.durum;
    var to = new Promise(function (res) { setTimeout(function () { res({ fallback: true }); }, 4000); });   /* asılı kalma yok */
    Promise.race([proxApi("/api/v1/tenant/endeks?" + q), to]).then(function (r) {
      if (r && r.success === true && !r.fallback && r.data && +r.data.m2 > 0) {
        var D = r.data;
        DT_REAL[key] = {
          m2: +D.m2,
          delta: (typeof D.delta === "number" ? D.delta : null),
          score: (typeof D.score === "number" ? D.score : null),
          ilan: (typeof D.ilan_sayisi === "number" ? D.ilan_sayisi : null),
          veri: (typeof D.veri_adedi === "number" ? D.veri_adedi : null),
          kapsam: r.kapsam || null,
          trend: Array.isArray(D.trend) ? D.trend.filter(function (t) { return t && +t.m2 > 0; }).map(function (t) { return { period: String(t.period), m2: +t.m2 }; }) : []
        };
      } else { DT_REAL[key] = null; }
      if (DT_REAL[key] && dtKey() === key && document.getElementById("dt-card")) mountTerminal(true);   /* gerçek geldi → tazele (yeniden fetch YOK) */
      updateDurum();
    });
  }
  function updateDurum() {
    var el = document.getElementById("dt-durum"); if (!el) return;
    var on = dtCanli();
    el.innerHTML = '<span style="' + css({ width: 6, height: 6, borderRadius: 9999, background: on ? C.accent : C.warn, animation: on ? "nadasPulse 1.4s ease-in-out infinite" : "none" }) + '"></span>' + (on ? "CANLI · GERÇEK ENDEKS" : "TEMSİLÎ ÖRNEK");
    el.style.color = on ? C.accent : C.warn;
  }
  /* ProX /analyze — gerçek değer aralığı + piyasa yönü + karar/risk özeti + pazarlık payı.
     100 m² brüt referans; grafikteki değer bandı + analiz paneli bundan beslenir. */
  var DT_ANALYZE = {};   /* key → {minM2,maxM2,strongM2,spread,conf,band,yon,karar,risk,pazarlik,eksik} | null */
  function dtLoadAnalyze() {
    var key = dtKey();
    if (key in DT_ANALYZE) return;
    var ap = dtApiParams();
    var body = { il: DT.city, ilce: DT.district, mahalle: DT.neighborhood, kategori: ap.kategori, durum: ap.durum, brut_m2: 100, attrs: {} };
    var to = new Promise(function (res) { setTimeout(function () { res({ fallback: true }); }, 6000); });
    Promise.race([proxApi("/api/v1/tenant/prox/analyze", { method: "POST", body: body }), to]).then(function (r) {
      if (r && r.success === true && !r.fallback && r.range && (+r.range.min_m2 > 0 || +r.strongest_m2 > 0)) {
        DT_ANALYZE[key] = {
          minM2: +r.range.min_m2 || 0, maxM2: +r.range.max_m2 || 0, strongM2: +r.strongest_m2 || 0,
          spread: (typeof r.range.spread_pct === "number" ? r.range.spread_pct : null),
          conf: (typeof r.confidence === "number" ? r.confidence : null), band: r.confidence_band || null,
          yon: r.piyasa_yonu || null, karar: r.karar_ozeti || null, risk: r.risk_ozeti || null,
          pazarlik: Array.isArray(r.pazarlik_payi_pct) ? r.pazarlik_payi_pct : null,
          eksik: Array.isArray(r.eksik_bilgi) ? r.eksik_bilgi : null
        };
      } else { DT_ANALYZE[key] = null; }
      if (dtKey() === key && document.getElementById("dt-card")) mountTerminal(true);   /* geldi → tazele (yeniden fetch YOK) */
    });
  }
  /* Gerçek konum servisleri (/locations) — 81 il · gerçek ilçe · gerçek mahalle.
     Gelmezse gömülü REGIONS'a düşer (dürüst fallback). Sonuçlar cache'lenir. */
  var LOC = { iller: null, ilceler: {}, mahalleler: {} };
  function locIller() { return LOC.iller || Object.keys(REGIONS); }
  function locIlceler() { return LOC.ilceler[DT.city] || Object.keys(REGIONS[DT.city] || {}); }
  function locMahalleler() { return LOC.mahalleler[DT.city + "|" + DT.district] || (REGIONS[DT.city] && REGIONS[DT.city][DT.district]) || []; }
  function loadIller(cb) {
    if (LOC.iller) { cb && cb(); return; }
    proxApi("/api/v1/tenant/locations/iller").then(function (r) { LOC.iller = (r && r.success && Array.isArray(r.data) && r.data.length) ? r.data : null; cb && cb(); });
  }
  function loadIlceler(il, cb) {
    if (LOC.ilceler[il]) { cb && cb(); return; }
    proxApi("/api/v1/tenant/locations/ilceler?il=" + encodeURIComponent(il)).then(function (r) { LOC.ilceler[il] = (r && r.success && Array.isArray(r.data) && r.data.length) ? r.data : (REGIONS[il] ? Object.keys(REGIONS[il]) : []); cb && cb(); });
  }
  function loadMahalleler(il, ilce, cb) {
    var k = il + "|" + ilce;
    if (LOC.mahalleler[k]) { cb && cb(); return; }
    proxApi("/api/v1/tenant/locations/mahalleler?il=" + encodeURIComponent(il) + "&ilce=" + encodeURIComponent(ilce)).then(function (r) { LOC.mahalleler[k] = (r && r.success && Array.isArray(r.data) && r.data.length) ? r.data : ((REGIONS[il] && REGIONS[il][ilce]) || []); cb && cb(); });
  }
  /* Açılışta seçili konumun gerçek listelerini yükle, sonra komut çubuğunu tazele. */
  function dtLocInit() {
    loadIller(function () { loadIlceler(DT.city, function () { loadMahalleler(DT.city, DT.district, function () { if (document.getElementById("dt-card")) mountTerminal(true); }); }); });
  }
  NX.setAccent(C.primary);
  var PINK = "#F472B6";

  var GROUP_COLOR = { konut: C.primary, arsa: C.warn, ticari: C.accent, bina: C.violet, turistik: PINK };
  var GROUP_LABEL = { konut: "Konut", arsa: "Arsa", ticari: "Ticari", bina: "Bina", turistik: "Turistik" };
  var EVT_COLOR = { deprem: C.danger, kur: C.warn, faiz: C.accent, siyasi: C.violet, makro: PINK, regulasyon: C.primary };
  var MONTHS = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];

  var CATEGORIES = {
    konut: [{ id: 1, n: "Daire-Sat" }, { id: 2, n: "Daire-Kir" }, { id: 5, n: "Villa-Sat" }, { id: 6, n: "Villa-Kir" }, { id: 9, n: "Yazlık-Sat" }, { id: 10, n: "Yazlık-Kir" }, { id: 39, n: "Çiftlik Evi-Sat" }, { id: 40, n: "Çiftlik Evi-Kir" }, { id: 67, n: "Rezidans-Sat" }, { id: 68, n: "Rezidans-Kir" }, { id: 69, n: "Müstakil-Sat" }, { id: 70, n: "Müstakil-Kir" }],
    arsa: [{ id: 41, n: "Konut İmarlı" }, { id: 42, n: "Ticari İmarlı" }, { id: 43, n: "Sanayi İmarlı" }, { id: 44, n: "Sosyal Alan" }, { id: 45, n: "Bağ-Bahçe" }, { id: 46, n: "Tarla" }],
    ticari: [{ id: 47, n: "Mağaza-Sat" }, { id: 48, n: "Mağaza-Kir" }, { id: 49, n: "Depo-Sat" }, { id: 50, n: "Depo-Kir" }, { id: 51, n: "Atölye-Sat" }, { id: 52, n: "Atölye-Kir" }, { id: 53, n: "Plaza Katı-Sat" }, { id: 54, n: "Plaza Katı-Kir" }, { id: 55, n: "Fabrika-Sat" }, { id: 56, n: "Fabrika-Kir" }, { id: 57, n: "Ofis-Sat" }, { id: 58, n: "Ofis-Kir" }],

    turistik: [{ id: 62, n: "Tatil Köyü" }, { id: 63, n: "Otel" }, { id: 65, n: "Pansiyon" }, { id: 66, n: "Butik Otel" }],

  var REGIONS = {
    İstanbul: { Kadıköy: ["Caddebostan", "Suadiye", "Fenerbahçe", "Moda", "Bostancı"], Beşiktaş: ["Levent", "Etiler", "Bebek", "Ortaköy", "Arnavutköy"], Sarıyer: ["Maslak", "Tarabya", "Yeniköy", "Emirgan", "İstinye"], Üsküdar: ["Beylerbeyi", "Çengelköy", "Acıbadem", "Kuzguncuk", "Altunizade"] },

    İzmir: { Konak: ["Alsancak", "Göztepe", "Karataş", "Basmane", "Kemeraltı"], Karşıyaka: ["Bostanlı", "Bahriye Üçok", "Mavişehir", "Şemikler", "Atakent"], Bornova: ["Erzene", "Kazımdirik", "Evka 3", "Yeşilçam", "Doğanlar"] },
    Antalya: { Muratpaşa: ["Lara", "Meltem", "Şirinyalı", "Tahılpazarı", "Konyaaltı"], Konyaaltı: ["Hurma", "Liman", "Sarısu", "Çamyuva", "Arapsuyu"] },

  };

  var EVENTS = [

  function genSeries(baseLevel, volatility, seed) {
    var series = [], val = baseLevel, idx = 0;
    for (var y = 2005; y <= 2026; y++) {
      for (var m = 0; m < 12; m++) {
        if (y === 2026 && m > 4) break;
        var yrInfl = y < 2018 ? 0.008 : y < 2021 ? 0.018 : y < 2024 ? 0.045 : 0.022;
        var wave = Math.sin((idx * 0.31) + seed) * volatility * 0.35;
        var noise = (Math.sin(idx * 1.7 + seed * 3) * Math.cos(idx * 0.8 + seed)) * volatility * 0.55;
        var ev = 0;
        for (var e = 0; e < EVENTS.length; e++) {
          var E = EVENTS[e];
          if (y === E.y && m === E.m) ev = E.imp;
          if (y > E.y || (y === E.y && m > E.m)) { var dist = (y - E.y) * 12 + (m - E.m); ev += E.imp * Math.max(0, 1 - dist / 8); }
        }
        val = val * (1 + (wave + noise + ev) / 100) * (1 + yrInfl / 12);
        series.push({ y: y, m: m, v: Math.round(val) });
        idx++;
      }
    }
    return series;
  }

      if (Math.abs(dx) >= Math.abs(dy)) { var k = Math.abs(dx) * 0.45; c1 = { x: a.x + k, y: a.y }; c2 = { x: b.x - k, y: b.y }; }
      else { var k2 = Math.abs(dy) * 0.45; c1 = { x: a.x, y: a.y + k2 }; c2 = { x: b.x, y: b.y - k2 }; }
      return { a: a, b: b, c1: c1, c2: c2, color: color, group: group };

    function bez(p, t) {
      var u = 1 - t, uu = u * u, uuu = uu * u, tt = t * t, ttt = tt * t;
      return { x: uuu * p.a.x + 3 * uu * t * p.c1.x + 3 * u * tt * p.c2.x + ttt * p.b.x,
               y: uuu * p.a.y + 3 * uu * t * p.c1.y + 3 * u * tt * p.c2.y + ttt * p.b.y };
    }
    function seed() {
      parts = []; var per = W < 860 ? 2 : 3;
      for (var p = 0; p < paths.length; p++) for (var j = 0; j < per; j++)
        parts.push({ p: p, t: (j / per) + Math.random() / per, v: 0.0018 + Math.random() * 0.0018, r: 1.7 + Math.random() * 1.7 });
    }
    function build() {

      if (!W || !H) { requestAnimationFrame(build); return; }  /* gizli/sıfır boyutlu kapsayıcıda mount edilirse yeniden dene */
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      cv.style.width = W + "px"; cv.style.height = H + "px";

      function R(el) { var r = el.getBoundingClientRect(); return { l: r.left - wr.left, t: r.top - wr.top, r: r.right - wr.left, b: r.bottom - wr.top, cx: (r.left + r.right) / 2 - wr.left, cy: (r.top + r.bottom) / 2 - wr.top }; }

      var srv = R(srvEl), prx = R(prxEl), i;

      if (W < 860) { /* dar: dikey akış, kaynak/çıktı gruplarının kenarından */
        var sg = R(document.getElementById("pipe-src-group")), og = R(document.getElementById("pipe-out-group"));
        for (i = 0; i < PIPE_SOURCES.length; i++)
          paths.push(mkPath({ x: sg.l + (sg.r - sg.l) * ((i + 0.5) / PIPE_SOURCES.length), y: sg.b }, { x: srv.cx, y: srv.t }, PIPE_SOURCES[i].c, "in"));
        paths.push(mkPath({ x: srv.cx, y: srv.b }, { x: prx.cx, y: prx.t }, C.accent, "mid"));
        for (i = 0; i < PIPE_OUTPUTS.length; i++)
          paths.push(mkPath({ x: prx.cx, y: prx.b }, { x: og.l + (og.r - og.l) * ((i + 0.5) / PIPE_OUTPUTS.length), y: og.t }, PIPE_OUTPUTS[i].c, "out"));
      } else { /* geniş: yatay akış, her çipin kendi kenarından */

        for (i = 0; i < srcEls.length; i++) { var s = R(srcEls[i]); paths.push(mkPath({ x: s.r, y: s.cy }, { x: srv.l, y: srv.cy }, PIPE_SOURCES[i].c, "in")); }
        paths.push(mkPath({ x: srv.r, y: srv.cy - 7 }, { x: prx.l, y: prx.cy - 7 }, C.violet, "mid"));
        paths.push(mkPath({ x: srv.r, y: srv.cy }, { x: prx.l, y: prx.cy }, C.accent, "mid"));
        paths.push(mkPath({ x: srv.r, y: srv.cy + 7 }, { x: prx.l, y: prx.cy + 7 }, C.violet, "mid"));
        for (i = 0; i < outEls.length; i++) { var o = R(outEls[i]); paths.push(mkPath({ x: prx.r, y: prx.cy }, { x: o.l, y: o.cy }, PIPE_OUTPUTS[i].c, "out")); }
      }

    function lit(g) {
      if (focus < 0) return 1;
      if (focus === 0) return g === "in" ? 1 : 0.1;
      if (focus === 1) return (g === "in" || g === "mid") ? 1 : 0.1;
      if (focus === 2) return (g === "mid" || g === "out") ? 1 : 0.1;
      return g === "out" ? 1 : 0.1;
    }
    function draw() {
      var i, p;
      ctx.clearRect(0, 0, W, H);

    }
    function start() { if (running || reduce || !visible) return; running = true; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

    var heads = wrap.querySelectorAll("[data-pipe-head]"), cols = wrap.querySelectorAll("[data-pipe-stage]");
    function setFocus(i) {

      if (i < 0) wrap.classList.remove("is-focus"); else wrap.classList.add("is-focus");

          else list[c].classList.remove("is-active");
        }

      mark(cols, "data-pipe-stage"); mark(heads, "data-pipe-head");

    }
    for (var c = 0; c < cols.length; c++) (function (el, idx) {
      el.addEventListener("mouseenter", function () { setFocus(idx); });
      el.addEventListener("mouseleave", function () { setFocus(-1); });
    })(cols[c], parseInt(cols[c].getAttribute("data-pipe-stage"), 10));

    build();
    /* İkisi birden: resize viewport değişimini, RO kapsayıcı-içi değişimi (yan panel vb.) yakalar.
       RO’yu tek başına bırakmıyoruz — bazı gömülü WebView’larda hiç ateşlenmiyor. */
    var rt = 0;

  /* ===== 02 · VERİ TERMİNALİ — çok modlu veri iş istasyonu =====

  var DT = { city: "İstanbul", district: "Kadıköy", neighborhood: "Caddebostan", catId: "1", period: "5Y", mode: "endeks" };

  /* — istatistik yardımcıları — */
  function dtMedian(a) { var s = a.slice().sort(function (x, y) { return x - y; }), n = s.length; return !n ? 0 : (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2); }

    var m = r.reduce(function (s, x) { return s + x; }, 0) / r.length;
    return Math.sqrt(r.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / r.length);
  }

  function dtComputeSeries() {
    var gc = catGroupName(DT.catId), group = gc.group, catName = gc.catName;
    var full = getSeries(DT.city + "/" + DT.district + "/" + DT.neighborhood, group, DT.catId);
    var periodMonths = { "1A": 1, "3A": 3, "1Y": 12, "5Y": 60, "10Y": 120, "MAX": full.length };
    var cutN = Math.min(periodMonths[DT.period], full.length);
    var series = full.slice(-cutN).map(function (s) { return { y: s.y, m: s.m, v: s.v, real: false }; });
    var dtReal = DT_REAL[dtKey()], live = false, liveDelta = null, realCount = 0;

      /* modellenmiş şekli gerçek güncel m²'ye ölçekle (geçmiş ŞEKİL model, uç gerçek) */

      /* trend son ayı içermese de uç gerçeğe sabit (ölçek zaten oturttu) */
      if (series.length) { series[series.length - 1].v = Math.round(dtReal.m2); series[series.length - 1].real = true; }

    return { series: series, group: group, catName: catName, live: live, liveDelta: liveDelta, real: dtReal || null, realCount: realCount };

  function dtEndeksBody() {

        + '<rect x="' + PAD.l + '" y="' + yb1.toFixed(1) + '" width="' + PW + '" height="' + Math.max(0, yb2 - yb1).toFixed(1) + '" fill="' + C.accent + '" opacity="0.07"></rect>'

    var yAxis = [0, 25, 50, 75, 100].map(function (t) { var yy = Yc(t); return '<line x1="' + PAD.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - PAD.r) + '" y2="' + yy.toFixed(1) + '" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"></line><text x="' + (PAD.l - 5) + '" y="' + (yy + 3).toFixed(1) + '" font-size="8.5" fill="' + C.textFaint + '" font-family="ui-monospace,monospace" text-anchor="end">' + t + '</text>'; }).join("");
    var paths = lines.map(function (L) { return '<path data-cmp-line="' + L.g.k + '" d="' + L.path + '" fill="none" stroke="' + L.col + '" stroke-width="1.6" stroke-linejoin="round" opacity="0.95"></path><circle data-cmp-dot="' + L.g.k + '" cx="' + L.lx.toFixed(1) + '" cy="' + L.ly.toFixed(1) + '" r="3" fill="' + L.col + '"></circle>'; }).join("");

    var header = '<div style="' + css({ borderBottom: "1px solid " + C.border, padding: "14px 18px", display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 14 }) + '"><div><div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.textMut, letterSpacing: "0.1em", marginBottom: 5 }) + '">' + DT.city.toLocaleUpperCase("tr-TR") + ' / ' + DT.district.toLocaleUpperCase("tr-TR") + ' / ' + DT.neighborhood.toLocaleUpperCase("tr-TR") + '</div><div style="' + css({ fontSize: "1.3rem", fontWeight: 700, color: C.textPri, fontFamily: "'Sora',sans-serif", letterSpacing: "-0.02em" }) + '">5 ana grup · normalize 0-100</div></div><div style="' + css({ display: "flex", gap: 4, flexWrap: "wrap" }) + '">' + dtPeriodBtns() + '</div></div>';
    var note = '<div style="' + css({ padding: "12px 16px", background: "#020812", fontFamily: C.mono, fontSize: 10.5, color: C.textMut, letterSpacing: "0.04em", lineHeight: 1.6 }) + '"><span style="' + css({ color: C.warn }) + '">temsilî örnek</span> · her grup kendi min-maks aralığına normalize edildi; amaç mutlak fiyat değil <b style="' + css({ color: C.textSec, fontWeight: 700 }) + '">momentum/şekil</b> karşılaştırması. Bir gruba tıklayıp izole edin.</div>';
    return header + '<div style="' + css({ padding: "10px 8px 4px" }) + '">' + svg + '</div><div style="' + css({ display: "flex", gap: 6, flexWrap: "wrap", padding: "4px 16px 14px" }) + '">' + legend + '</div>' + note;
  }

  /* file:// uyarısı — tarayıcı, dosya kaynağından (null origin) API çağrısını CORS ile
     engeller (sunucu 403). Sessizce temsilîye düşmek yerine nedeni açıkça söyle. */
  function dtFileHint() {
    if (location.protocol !== "file:") return "";
    return '<div style="' + css({ padding: "9px 14px", background: "rgba(251,191,36,0.09)", borderBottom: "1px solid " + C.warn, fontFamily: C.mono, fontSize: 10.5, color: C.warn, letterSpacing: "0.01em", lineHeight: 1.55 }) + '">⚠ <b>file:// modundasınız</b> — tarayıcı canlı ProX API çağrısını CORS ile engelliyor (null origin), şu an <b>temsilî</b> gösteriliyor. Gerçek veri için siteyi <b>http:// üzerinden</b> açın: <code style="' + css({ color: C.textPri }) + '">python3 -m http.server 8799</code> → <code style="' + css({ color: C.primary }) + '">http://localhost:8799/nadas/index.html</code></div>';
  }
  function buildTerminalCard() {
    return dtFileHint() + dtCommandBar() + dtModeTabs() + (DT.mode === "karsilastir" ? dtCompareBody() : dtEndeksBody());
  }

  function DataTerminalShell() {
    return '<section id="terminal" style="' + css({ borderBottom: "1px solid " + C.borderStrong, padding: "16px 16px 24px" }) + '"><div style="' + css({ maxWidth: 1280, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.12em" }) + '">02 · VERİ TERMİNALİ</span>'
      + '<h2 style="' + css({ fontFamily: "'Sora',sans-serif", fontSize: 15, color: C.textPri, fontWeight: 600, margin: 0, display: "inline", letterSpacing: "-0.01em" }) + '">Mahalle düzeyinde interaktif endeks</h2>'
      + '<span style="' + css({ height: 1, flex: 1, minWidth: 40, background: C.borderStrong }) + '"></span><span id="dt-durum" style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.warn, letterSpacing: "0.08em", display: "flex", alignItems: "center", gap: 6 }) + '"><span style="' + css({ width: 6, height: 6, borderRadius: 9999, background: C.warn }) + '"></span>TEMSİLÎ ÖRNEK</span></div>'
      + '<div id="dt-card" style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised }) + '"></div>'
      + '</div></section>';
  }

  function mountTerminal(skipFetch) {
    var card = document.getElementById("dt-card");
    if (!card) return;
    card.innerHTML = buildTerminalCard();
    updateDurum();
    if (!skipFetch) { dtLoadReal(); dtLoadAnalyze(); }
    var cityEl = document.getElementById("dt-city"), distEl = document.getElementById("dt-district"), neighEl = document.getElementById("dt-neigh"), catEl = document.getElementById("dt-cat");
    cityEl.addEventListener("change", function () { DT.city = this.value; loadIlceler(DT.city, function () { DT.district = locIlceler()[0] || ""; loadMahalleler(DT.city, DT.district, function () { DT.neighborhood = locMahalleler()[0] || ""; mountTerminal(); }); }); });
    distEl.addEventListener("change", function () { DT.district = this.value; loadMahalleler(DT.city, DT.district, function () { DT.neighborhood = locMahalleler()[0] || ""; mountTerminal(); }); });
    neighEl.addEventListener("change", function () { DT.neighborhood = this.value; mountTerminal(); });

    var mtabs = card.querySelectorAll("[data-dtmode]");

    var pbtns = card.querySelectorAll("[data-dtp]");
    for (var i = 0; i < pbtns.length; i++) pbtns[i].addEventListener("click", function () { DT.period = this.getAttribute("data-dtp"); mountTerminal(); });
    if (DT.mode === "karsilastir") { mountCompareInteractions(card); return; }
    mountEndeksInteractions(card);
  }

  function dtEndeksLink() { return "https://www.emlakekspertizi.com/emlak-endeksi?il=" + encodeURIComponent(DT.city) + "&ilce=" + encodeURIComponent(DT.district) + "&mahalle=" + encodeURIComponent(DT.neighborhood) + "&kategori=" + DT.catId; }
  function dtExportPNG() {
    var svg = document.getElementById("dt-svg"); if (!svg) return;
    var clone = svg.cloneNode(true); clone.setAttribute("width", W); clone.setAttribute("height", H);
    var xml = new XMLSerializer().serializeToString(clone);
    var img = new Image();
    img.onload = function () {
      var s = 2, cv = document.createElement("canvas"); cv.width = W * s; cv.height = H * s;
      var ctx = cv.getContext("2d"); ctx.fillStyle = "#06101B"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      try {
        var a = document.createElement("a");
        a.download = "nadas-" + (DT.neighborhood || "endeks").toLocaleLowerCase("tr-TR").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") + "-endeks.png";
        a.href = cv.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove();
      } catch (e) {}
    };
    img.onerror = function () {};
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  }
  function dtShare(btn) {
    var url = dtEndeksLink(), gc = catGroupName(DT.catId);
    var title = DT.neighborhood + " · " + gc.catName + " — NADAS Veri Terminali";
    var text = DT.city + "/" + DT.district + "/" + DT.neighborhood + " " + gc.catName + " endeksi · NADAS";
    function done() { if (!btn) return; var o = btn.getAttribute("data-lbl") || btn.textContent; btn.setAttribute("data-lbl", o); btn.textContent = "✓ KOPYALANDI"; setTimeout(function () { btn.textContent = o; }, 1600); }
    function legacyCopy() { try { var ta = document.createElement("textarea"); ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); } catch (e) {} }
    if (navigator.share) { navigator.share({ title: title, text: text, url: url }).catch(function () {}); }
    else if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, legacyCopy); }
    else { legacyCopy(); }
  }

  function mountEndeksInteractions(card) {
    var hline = document.getElementById("dt-hline"), hguide = document.getElementById("dt-hguide"), hcirc = document.getElementById("dt-hcirc"), tip = document.getElementById("dt-tip"), tipD = document.getElementById("dt-tip-date"), tipV = document.getElementById("dt-tip-val"), tipC = document.getElementById("dt-tip-chg");
    function showHover(idx) {
      var p = dtPts[idx]; if (!p || !hline) return;
      hline.setAttribute("x1", p[0]); hline.setAttribute("x2", p[0]); hline.style.display = "";
      if (hguide) { hguide.setAttribute("y1", p[1]); hguide.setAttribute("y2", p[1]); hguide.style.display = ""; }
      hcirc.setAttribute("cx", p[0]); hcirc.setAttribute("cy", p[1]); hcirc.style.display = "";
      var tx = Math.min(Math.max(p[0], 82), W - 82), ty = Math.max(p[1] - 66, PAD.t + 4);
      tip.setAttribute("transform", "translate(" + tx + "," + ty + ")"); tip.style.display = "";
      tipD.textContent = MONTHS[dtSeries[idx].m] + " " + dtSeries[idx].y;
      tipV.textContent = "₺" + dtSeries[idx].v.toLocaleString("tr-TR") + "/m²";
      if (tipC) {
        var base = (dtSeries[0] || {}).v || 0, chg = base ? ((dtSeries[idx].v - base) / base) * 100 : 0;
        tipC.textContent = (chg >= 0 ? "▲ +" : "▼ ") + chg.toFixed(1) + "% · dönem";
        tipC.setAttribute("fill", chg >= 0 ? C.accent : C.danger);
      }
    }
    function hideHover() { if (hline) { hline.style.display = "none"; hcirc.style.display = "none"; tip.style.display = "none"; if (hguide) hguide.style.display = "none"; } }
    var hits = card.querySelectorAll("[data-dti]");
    for (var j = 0; j < hits.length; j++) hits[j].addEventListener("mouseenter", function () { showHover(parseInt(this.getAttribute("data-dti"), 10)); });
    var svg = document.getElementById("dt-svg"); if (svg) svg.addEventListener("mouseleave", hideHover);
    function evHi(idx, on) {
      var lineG = card.querySelector('[data-ev-line="' + idx + '"]'), cardEl = card.querySelector('[data-ev-card="' + idx + '"]');
      if (lineG) { var ln = lineG.querySelector("line"), ci = lineG.querySelector("circle"); if (ln) ln.setAttribute("opacity", on ? "1" : "0.5"); if (ci) ci.setAttribute("r", on ? "5" : "3.5"); }
      if (cardEl) cardEl.style.background = on ? C.elev : "transparent";
    }
    var cards = card.querySelectorAll("[data-ev-card]");
    for (var k = 0; k < cards.length; k++) (function (el, idx) {
      el.addEventListener("mouseenter", function () { evHi(idx, true); });
      el.addEventListener("mouseleave", function () { evHi(idx, false); });
    })(cards[k], parseInt(cards[k].getAttribute("data-ev-card"), 10));
    var lineGs = card.querySelectorAll("[data-ev-line]");
    for (var l = 0; l < lineGs.length; l++) (function (el, idx) {
      el.style.cursor = "pointer";
      el.addEventListener("mouseenter", function () { evHi(idx, true); });
      el.addEventListener("mouseleave", function () { evHi(idx, false); });
    })(lineGs[l], parseInt(lineGs[l].getAttribute("data-ev-line"), 10));
    var pngBtn = card.querySelector("[data-dt-png]"); if (pngBtn) pngBtn.addEventListener("click", dtExportPNG);
    var shBtn = card.querySelector("[data-dt-share]"); if (shBtn) shBtn.addEventListener("click", function () { dtShare(shBtn); });
  }

  function mountCompareInteractions(card) {
    var legs = card.querySelectorAll("[data-cmp-leg]"), isolated = null;
    function apply(hoverKey) {
      var key = isolated || hoverKey;
      var lines = card.querySelectorAll("[data-cmp-line]"), dots = card.querySelectorAll("[data-cmp-dot]"), i;
      for (i = 0; i < lines.length; i++) { var k = lines[i].getAttribute("data-cmp-line"); lines[i].setAttribute("opacity", !key || k === key ? "0.95" : "0.12"); lines[i].setAttribute("stroke-width", key && k === key ? "2.4" : "1.6"); }
      for (i = 0; i < dots.length; i++) { var kd = dots[i].getAttribute("data-cmp-dot"); dots[i].setAttribute("opacity", !key || kd === key ? "1" : "0.12"); }
      for (i = 0; i < legs.length; i++) { var kl = legs[i].getAttribute("data-cmp-leg"); legs[i].style.borderColor = (isolated === kl) ? GROUP_COLOR[kl] : C.borderStrong; }
    }
    for (var i = 0; i < legs.length; i++) (function (el, key) {
      el.addEventListener("mouseenter", function () { apply(key); });
      el.addEventListener("mouseleave", function () { apply(null); });
      el.addEventListener("click", function () { isolated = (isolated === key) ? null : key; apply(null); });
    })(legs[i], legs[i].getAttribute("data-cmp-leg"));
  }

  /* ===== 03 · 5 BÜYÜK ŞEHİR · CANLI ENDEKS KARŞILAŞTIRMASI =====
     Her şehir amiral mahallesiyle (konut/satılık) temsil edilir; gerçek /endeks
     verisine bağlı (m²/skor/delta/ilan). Anahtar yok / veri gelmezse dürüstçe temsilî. */
  var CITY_FLAGSHIP = {
    "İstanbul": { ilce: "Kadıköy", mah: "Caddebostan" },
    "Ankara": { ilce: "Çankaya", mah: "Kavaklıdere" },
    "İzmir": { ilce: "Konak", mah: "Alsancak" },
    "Antalya": { ilce: "Muratpaşa", mah: "Lara" },
    "Bursa": { ilce: "Nilüfer", mah: "Görükle" }
  };
  var CH_REAL = null;   /* null=sorulmadı · {} doldukça: city → {m2,score,delta,ilan,mah} | null */
  function chLoadReal() {
    if (CH_REAL) return;
    CH_REAL = {};
    if (!EMLAK_TENANT.tenant_key) { chRender(); return; }   /* anahtar yok → temsilî */
    var cities = Object.keys(CITY_FLAGSHIP), pending = cities.length;
    cities.forEach(function (city) {
      var f = CITY_FLAGSHIP[city];
      var q = "il=" + encodeURIComponent(city) + "&ilce=" + encodeURIComponent(f.ilce) + "&mahalle=" + encodeURIComponent(f.mah) + "&kategori=konut&durum=satilik";
      var to = new Promise(function (res) { setTimeout(function () { res({ fallback: true }); }, 5000); });
      Promise.race([proxApi("/api/v1/tenant/endeks?" + q), to]).then(function (r) {
        CH_REAL[city] = (r && r.success === true && !r.fallback && r.data && +r.data.m2 > 0)
          ? { m2: +r.data.m2, score: (typeof r.data.score === "number" ? r.data.score : null), delta: (typeof r.data.delta === "number" ? r.data.delta : null), ilan: (typeof r.data.ilan_sayisi === "number" ? r.data.ilan_sayisi : null), mah: f.ilce + "/" + f.mah }
          : null;
        if (--pending === 0) chRender();
      });
    });
  }
  function chRender() {
    var body = document.getElementById("ch-body"); if (body) body.innerHTML = chBody();
    var dur = document.getElementById("ch-durum"); if (!dur) return;
    var cities = Object.keys(CITY_FLAGSHIP);
    var reals = CH_REAL ? cities.filter(function (c) { return CH_REAL[c]; }).length : 0;
    var resolved = CH_REAL ? cities.filter(function (c) { return c in CH_REAL; }).length : 0;
    var on = reals > 0;
    var lbl = reals === cities.length ? "CANLI · GERÇEK ENDEKS" : reals > 0 ? "KISMEN CANLI · " + reals + "/" + cities.length : resolved >= cities.length ? "TEMSİLÎ ÖRNEK" : "YÜKLENİYOR…";
    dur.innerHTML = '<span style="' + css({ width: 6, height: 6, borderRadius: 9999, background: on ? C.accent : C.warn, animation: on ? "nadasPulse 1.4s ease-in-out infinite" : "none" }) + '"></span>' + lbl;
    dur.style.color = on ? C.accent : C.warn;
  }
  function chRow(city, d, maxM2) {
    var has = d && d.m2 > 0;
    var w = has ? Math.max(3, Math.round((d.m2 / maxM2) * 100)) : 0;
    var scol = has && d.score != null ? (d.score >= 75 ? C.accent : d.score >= 50 ? C.primary : C.warn) : C.textFaint;
    var sub = has ? d.mah : (CITY_FLAGSHIP[city].ilce + "/" + CITY_FLAGSHIP[city].mah);
    return '<div style="' + css({ padding: "10px 12px", borderBottom: "1px solid " + C.border }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 6, flexWrap: "wrap" }) + '">'
      + '<span style="' + css({ fontFamily: C.mono, fontSize: 12, fontWeight: 700, color: C.textPri, letterSpacing: "0.06em", minWidth: 74 }) + '">' + city.toLocaleUpperCase("tr-TR") + '</span>'
      + '<span style="' + css({ fontFamily: C.mono, fontSize: 9.5, color: C.textFaint }) + '">' + sub + '</span>'
      + '<span style="' + css({ marginLeft: "auto", fontFamily: "'Sora',sans-serif", fontSize: 16, fontWeight: 700, color: has ? C.textPri : C.textFaint, letterSpacing: "-0.02em" }) + '">' + (has ? "₺" + Math.round(d.m2).toLocaleString("tr-TR") : "—") + '</span>'
      + '<span style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.textFaint }) + '">' + (has ? "/m²" : "") + '</span></div>'
      + '<div style="' + css({ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }) + '">'
      + '<div style="' + css({ flexBasis: 160, flexGrow: 1, height: 6, background: "rgba(255,255,255,0.05)", borderRadius: 3, overflow: "hidden" }) + '"><div style="' + css({ height: 6, width: w + "%", background: scol, borderRadius: 3, transition: "width .5s" }) + '"></div></div>'
      + (has && d.score != null ? '<span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: scol, fontWeight: 700 }) + '">skor ' + (Math.round(d.score * 10) / 10) + '</span>' : '')
      + (has && d.delta != null ? '<span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: d.delta >= 0 ? C.accent : C.danger }) + '">' + (d.delta >= 0 ? "▲" : "▼") + Math.abs(d.delta).toFixed(1) + '%</span>' : '')
      + (has && d.ilan != null ? '<span style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.textMut }) + '">' + d.ilan + ' ilan</span>' : '')
      + '</div></div>';
  }
  function chBody() {
    var cities = Object.keys(CITY_FLAGSHIP);
    var got = cities.map(function (c) { return { c: c, d: (CH_REAL && (c in CH_REAL)) ? CH_REAL[c] : undefined }; });
    var reals = got.filter(function (g) { return g.d && g.d.m2 > 0; });
    var maxM2 = reals.length ? Math.max.apply(null, reals.map(function (g) { return g.d.m2; })) : 1;
    var ranked = got.slice().sort(function (a, b) { return ((b.d && b.d.m2) || 0) - ((a.d && a.d.m2) || 0); });
    var rows = ranked.map(function (g) { return chRow(g.c, g.d, maxM2); }).join("");
    var hi;
    if (reals.length) {
      function hiCell(lbl, city, val, col) { return '<div style="' + css({ padding: "9px 0", borderBottom: "1px solid " + C.border }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 9.5, color: C.textFaint, letterSpacing: "0.1em", marginBottom: 4 }) + '">' + lbl + '</div><div style="' + css({ display: "flex", alignItems: "baseline", gap: 8 }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 12.5, fontWeight: 700, color: C.textPri }) + '">' + city.toLocaleUpperCase("tr-TR") + '</span><span style="' + css({ marginLeft: "auto", fontFamily: C.mono, fontSize: 13, fontWeight: 700, color: col }) + '">' + val + '</span></div></div>'; }
      var byM2 = reals.slice().sort(function (a, b) { return b.d.m2 - a.d.m2; })[0];
      var scoreArr = reals.filter(function (g) { return g.d.score != null; }).sort(function (a, b) { return b.d.score - a.d.score; });
      var ilanArr = reals.filter(function (g) { return g.d.ilan != null; }).sort(function (a, b) { return b.d.ilan - a.d.ilan; });
      hi = hiCell("EN YÜKSEK m²", byM2.c, "₺" + Math.round(byM2.d.m2).toLocaleString("tr-TR"), C.accent)
        + (scoreArr[0] ? hiCell("EN YÜKSEK SKOR", scoreArr[0].c, "" + (Math.round(scoreArr[0].d.score * 10) / 10), C.primary) : "")
        + (ilanArr[0] ? hiCell("EN ÇOK İLAN", ilanArr[0].c, "" + ilanArr[0].d.ilan, C.textPri) : "");
    } else {
      hi = '<div style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.6 }) + '">Canlı veri yükleniyor… gelmezse dürüstçe temsilî örneğe düşülür.</div>';
    }
    return '<div style="' + css({ display: "grid", gridTemplateColumns: "minmax(0,1.6fr) minmax(0,1fr)", gap: 16 }) + '" class="nadas-heatmap-grid">'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised }) + '">' + rows
      + '<div style="' + css({ padding: "10px 12px", fontFamily: C.mono, fontSize: 9.5, color: C.textFaint, letterSpacing: "0.04em", lineHeight: 1.6 }) + '">m² BARLARI EN YÜKSEĞE GÖRE ÖLÇEKLİ · her şehir amiral mahallesiyle (konut/satılık) temsil edilir · canlı ProX endeksi</div></div>'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "4px 14px 12px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.12em", padding: "10px 0 4px" }) + '">ÖNE ÇIKANLAR <span style="' + css({ color: C.textFaint, letterSpacing: 0 }) + '">· gerçek veriden</span></div>' + hi + '</div>'
      + '</div>';
