<body>

<div id="app"><noscript><div style="max-width:900px;margin:0 auto;padding:48px 20px;font-family:'Sora',sans-serif"><h1 style="color:#38BDF8">KVKK İlgili Kişi Başvuru Formu — NADAS</h1><p style="color:#CBD5E1">KVKK m.11 haklarınız için başvurunuzu destek@nadas.com.tr adresine iletebilirsiniz. Görüntülemek için JavaScript gereklidir.</p></div></noscript></div>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/vendor/gsap.min.js"></script>
<script src="js/core.js?v=48"></script>
<script src="js/i18n/kvkk-basvuru.js?v=8"></script>
<script>
(function () {
  "use strict";
  var C = NX.C, css = NX.css;
  NX.setAccent(C.primary);

  var TICK = [["YASAL", "KVKK BAŞVURU FORMU"], ["DAYANAK", "6698 · MADDE 11"], ["YANIT SÜRESİ", "EN GEÇ 30 GÜN"], ["ÜCRET", "KURAL OLARAK ÜCRETSİZ"], ["BAŞVURU", "destek@nadas.com.tr"], ["SON GÜNCELLEME", "25.07.2026"], ["SINCE 2005", "21 YIL"]];
  var FIRMA = "Nadas Gayrimenkul Bilgi İletişim Sistemleri Ticaret Limited Şirketi";

  function P(t) { return '<p style="' + css({ fontSize: 14, lineHeight: 1.75, color: C.textSec, margin: "0 0 12px" }) + '">' + t + '</p>'; }
  function lbl(t, forId) { return '<label ' + (forId ? 'for="' + forId + '" ' : '') + 'style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.textFaint, letterSpacing: "0.1em", marginBottom: 6, display: "block", fontWeight: 700 }) + '">' + t + '</label>'; }
  function inp(attrs) { return '<input ' + attrs + ' style="' + css({ width: "100%", padding: "11px 12px", background: C.deep, border: "1px solid " + C.borderStrong, color: C.textPri, fontFamily: C.mono, fontSize: 13, outline: "none", boxSizing: "border-box" }) + '">'; }

  function Hero() {
    return '<section style="' + css({ position: "relative", padding: "26px 16px 20px", background: C.base, borderBottom: "1px solid " + C.borderStrong, overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 82% 12%, rgba(56,189,248,0.1), transparent 55%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 980, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.14em", fontWeight: 700, marginBottom: 12 }) + '"><span style="' + css({ width: 14, height: 1, background: C.primary }) + '"></span>KVKK · İLGİLİ KİŞİ BAŞVURUSU</div>'
      + '<h1 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(1.7rem,4.2vw,2.6rem)", fontWeight: 700, lineHeight: 1.1, letterSpacing: "-0.02em", margin: 0, color: C.textPri }) + '">İlgili Kişi Başvuru Formu</h1>'
      + '<div style="' + css({ marginTop: 16 }) + '">' + P("6698 sayılı Kanun’un 11. maddesi kapsamındaki haklarınızı kullanmak için bu formu kullanabilirsiniz. Başvurunuz, <strong style=\"color:" + C.textPri + "\">" + FIRMA + "</strong> (veri sorumlusu) tarafından en geç <strong style=\"color:" + C.textPri + "\">30 gün</strong> içinde ve kural olarak ücretsiz sonuçlandırılır. Kimliğinizin doğrulanabilmesi için başvurunuzda gerekli bilgileri eksiksiz vermeniz önemlidir. Ayrıntı: <a href=\"kvkk.html\" style=\"color:" + C.primary + ";text-decoration:none\">KVKK Aydınlatma Metni</a>.") + '</div>'
      + '</div></section>';
  }

  function Channels() {
    var ch = [
      ["Yazılı (ıslak imzalı)", "Islak imzalı dilekçe ile şirket merkez adresine: Hastane Mah. Hadımköy İstanbul Cad. No: 46/B, Arnavutköy / İstanbul."],
      ["KEP / Güvenli e-imza", "Kayıtlı elektronik posta (KEP), güvenli elektronik imza veya mobil imza ile — KEP adresi Künye sayfasında yayımlanacaktır."],
      ["Kayıtlı e-posta", "Sistemimizde kayıtlı e-posta adresinizden: destek@nadas.com.tr (konu: KVKK Başvurusu)."],
    ].map(function (x) {
      return '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, borderRadius: 4, padding: "14px 16px" }) + '"><div style="' + css({ fontFamily: "'Sora',sans-serif", fontSize: 13.5, fontWeight: 700, color: C.textPri, marginBottom: 4 }) + '">' + x[0] + '</div><div style="' + css({ fontSize: 12, color: C.textMut, lineHeight: 1.6 }) + '">' + x[1] + '</div></div>';
    }).join("");
    return '<div style="' + css({ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 10 }) + '">' + ch + '</div>';
  }

  function Form() {
    var konu = ["Seçiniz...", "Kişisel verilerimin işlenip işlenmediğini öğrenme", "İşlenmişse buna ilişkin bilgi talep etme", "İşlenme amacını ve amaca uygun kullanımı öğrenme", "Aktarıldığı üçüncü kişileri öğrenme", "Eksik/yanlış işlenmişse düzeltilmesini isteme", "Silinmesini/yok edilmesini isteme", "Düzeltme/silmenin aktarılan kişilere bildirilmesini isteme", "Otomatik analiz sonucuna itiraz", "Zararın giderilmesini talep etme"].map(function (s) { return '<option>' + s + '</option>'; }).join("");
    return '<div style="' + css({ background: C.raised, border: "1px solid " + C.primary, borderRadius: 4, padding: "24px 22px" }) + '">'
      + '<div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.primary, fontWeight: 700, letterSpacing: "0.14em", marginBottom: 16 }) + '">◆ BAŞVURU FORMU</div>'
      + '<div style="' + css({ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }) + '" class="nadas-twocol"><div>' + lbl("AD SOYAD *", "kb-name") + inp('id="kb-name" type="text" placeholder="İsim Soyisim"') + '</div><div>' + lbl("T.C. KİMLİK NO (KİMLİK TEYİDİ)", "kb-tc") + inp('id="kb-tc" type="text" inputmode="numeric" placeholder="Opsiyonel — teyit için"') + '</div></div>'
      + '<div style="' + css({ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }) + '" class="nadas-twocol"><div>' + lbl("E-POSTA *", "kb-email") + inp('id="kb-email" type="email" placeholder="adresiniz@ornek.com"') + '</div><div>' + lbl("TELEFON", "kb-phone") + inp('id="kb-phone" type="tel" placeholder="Opsiyonel"') + '</div></div>'
      + '<div style="' + css({ marginBottom: 12 }) + '">' + lbl("TALEP KONUSU (KVKK M.11) *", "kb-konu") + '<select id="kb-konu" style="' + css({ width: "100%", padding: "11px 12px", background: C.deep, border: "1px solid " + C.borderStrong, color: C.textPri, fontFamily: C.mono, fontSize: 13, outline: "none", boxSizing: "border-box" }) + '">' + konu + '</select></div>'
      + '<div style="' + css({ marginBottom: 16 }) + '">' + lbl("AÇIKLAMA *", "kb-msg") + '<textarea id="kb-msg" rows="5" placeholder="Talebinizi ve varsa ilgili işlem/kayıt bilgisini açıklayın." style="' + css({ width: "100%", padding: "11px 12px", background: C.deep, border: "1px solid " + C.borderStrong, color: C.textPri, fontFamily: C.mono, fontSize: 13, outline: "none", boxSizing: "border-box", resize: "vertical" }) + '"></textarea></div>'
      + '<div style="' + css({ marginBottom: 16, display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 12px", background: C.deep, border: "1px solid " + C.border }) + '"><input type="checkbox" id="kb-kvkk" style="' + css({ marginTop: 3, accentColor: C.primary }) + '"><label for="kb-kvkk" style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.textMut, lineHeight: 1.5, cursor: "pointer" }) + '"><strong style="' + css({ color: C.textSec }) + '">Onay:</strong> Bu formda verdiğim bilgilerin, başvurumun değerlendirilmesi ve yanıtlanması amacıyla <a href="kvkk.html" style="' + css({ color: C.primary, textDecoration: "none" }) + '">KVKK Aydınlatma Metni</a> kapsamında işlenmesini kabul ediyorum.</label></div>'
      + '<button id="kb-send" type="button" style="' + css({ width: "100%", padding: "14px", background: C.primary, color: C.deep, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.12em", border: "none", cursor: "pointer", borderRadius: 2 }) + '">BAŞVURUYU GÖNDER →</button>'
      + '<div id="kb-status" style="' + css({ marginTop: 12, fontFamily: C.mono, fontSize: 10, color: C.textFaint, letterSpacing: "0.04em", lineHeight: 1.6, textAlign: "center" }) + '">* Zorunlu alanlar · Başvurunuz destek@nadas.com.tr adresine iletilir ve en geç 30 gün içinde yanıtlanır.</div>'
      + '</div>';
  }

  function Body() {
    return '<section style="' + css({ padding: "20px 16px 30px" }) + '"><div style="' + css({ maxWidth: 980, margin: "0 auto" }) + '">'
      + '<div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◆ BAŞVURU KANALLARI</div>' + Channels()
      + '<div style="' + css({ marginTop: 22 }) + '">' + Form() + '</div>'
      + '<div style="' + css({ marginTop: 16, padding: "12px 14px", border: "1px dashed " + C.borderStrong, background: "rgba(56,189,248,0.03)", borderRadius: 3, fontFamily: C.mono, fontSize: 10.5, color: C.textMut, lineHeight: 1.6 }) + '">⌬ Bu form bir başvuru kolaylığıdır; yazılı, KEP veya kayıtlı e-posta kanalları da geçerlidir. İşlemin ayrıca bir maliyet gerektirmesi hâlinde Kişisel Verileri Koruma Kurulu’nca belirlenen tarifedeki ücret alınabilir.</div>'
      + '</div></section>';
  }

  function renderApp() { return NX.Ticker(TICK) + NX.Masthead("KVKK Başvuru") + NX.Nav("") + Hero() + Body() + NX.Footer(); }
  if (window.__PAGE_I18N) NX.setPageI18n(window.__PAGE_I18N);
  NX.boot(renderApp);

  (function () {
    var btn = document.getElementById("kb-send"); if (!btn) return;
    btn.addEventListener("click", function () {
      var g = function (id) { return (document.getElementById(id) || {}).value || ""; };
      var st = document.getElementById("kb-status");
      var reMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      function err(t) { if (st) { st.style.color = C.danger; st.textContent = "⚠ " + t; } }
      if (!g("kb-name").trim()) return err("Lütfen ad soyad girin.");
      if (!reMail.test(g("kb-email"))) return err("Lütfen geçerli bir e-posta girin.");
      if ((document.getElementById("kb-konu") || {}).selectedIndex === 0) return err("Lütfen talep konusunu seçin.");
      if (!g("kb-msg").trim()) return err("Lütfen açıklama girin.");
      if (!(document.getElementById("kb-kvkk") || {}).checked) return err("Lütfen KVKK onayını işaretleyin.");
      if (st) { st.style.color = C.accent; st.textContent = "✓ Başvurunuz alındı. destek@nadas.com.tr üzerinden en geç 30 gün içinde yanıtlanacaktır."; }
      ["kb-name", "kb-tc", "kb-email", "kb-phone", "kb-msg"].forEach(function (id) { var e = document.getElementById(id); if (e) e.value = ""; });
      var k = document.getElementById("kb-kvkk"); if (k) k.checked = false;
    });
  })();
})();
</script>
</body>
</html>
