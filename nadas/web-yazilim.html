      + '<div style="' + css({ marginTop: 16 }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.textFaint, letterSpacing: "0.1em", marginBottom: 8, fontWeight: 700 }) + '">◆ ÖRNEK GÜNLÜK ÜRETİM AKIŞI</div><div style="' + css({ display: "flex", gap: 8, flexWrap: "wrap" }) + '">' + stream + '</div></div>'
      + note("Optimizasyon garanti değildir: içeriği bulunur ve alıntılanabilir kılacak şekilde yapılandırırız; ancak Google ya da AI yanıt motorlarındaki sıra/görünürlük tek tarafın kontrolünde değildir. İçerik hacmi (günde 5+), türü ve kapsamı içerik anlaşmasına bağlıdır. Tüm fiyatlara %20 KDV dahildir.");
    return '<section style="' + css({ position: "relative", overflow: "hidden", background: "linear-gradient(135deg," + C.deep + " 0%," + C.raised + " 100%)", borderBottom: "1px solid " + C.borderStrong, padding: "28px 16px" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 85% 12%, rgba(52,211,153,0.13), transparent 55%), radial-gradient(circle at 10% 90%, rgba(56,189,248,0.07), transparent 50%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative" }) + '">' + inner + '</div></section>';
  }

  function renderApp() {
    return NX.Ticker(WYTICK) + NX.Masthead("Web Yazılım") + NX.Nav("")
      + HeroWeb()
      + SectionDivider("★", "Bizi Ayıran Fark · İçerik Üreticisiyiz", "KURUP BIRAKMIYORUZ · HER GÜN İÇERİK") + ContentEngine()
      + SectionDivider("A", "Ne Geliştiriyoruz", "SİTE · UYGULAMA · PORTAL · ENTEGRASYON") + Services()
      + SectionDivider("B", "Nasıl Çalışıyoruz", "SÜREÇ · SIFIRDAN ÖZEL KOD") + Process()
      + SectionDivider("C", "Teknik Yığın & Kalite", "2026 · ÖLÇÜLEBİLİR STANDART") + TechQuality()
      + SectionDivider("D", "Neden NADAS", "KANIT · DÜRÜST ÇERÇEVE") + WhyNadas()
      + Product() + NX.Footer();
  }

  /* ===== HERO ANİMASYONU · KOD → BUILD → CANLI YAYIN ===== */
  function mountBuildFlow() {
    var stage = document.getElementById("wy-stage");
    var cv = stage && document.getElementById("wy-canvas");
    if (!stage || !cv || !cv.getContext) return;
    var ctx = cv.getContext("2d");
    var capEl = document.getElementById("wy-cap"), cntEl = document.getElementById("wy-count");
    var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    var reduce = !!(mq && mq.matches);
    var W = 0, H = 0, dpr = 1, raf = 0, running = false, visible = true;
    var STEP = 1 / 60, acc = 0, last = 0, t = 0, TAU = 6.28318;
    var CY = "#38BDF8", GRN = "#34D399", VIO = "#22D3EE", WARN = "#FBBF24", GC = "#EAF6FF", MUT = "#64748B";
    var Ex = 0, Bx = 0, Fx = 0, midY = 0, codeRows = [], pool = [], free = [], MAX = 84, emitAcc = 0, deploys = 0, depShown = 0, buildFlash = 0, blocks = [];
    var CAPS = ["tasarım → kod", "build passed · 0 hata", "bundle → CDN dağıtımı", "LCP 1.2s · CLS 0.01 · INP 120ms", "deploy → CANLI · 200 OK", "WCAG 2.2 AA · erişilebilir"];
    var capIdx = -1, capLast = 0;
    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }
    var sprites = {};
    function sprite(color) { if (sprites[color]) return sprites[color]; var r = 16, s = document.createElement("canvas"); s.width = s.height = r * 2; var sc = s.getContext("2d"), g = sc.createRadialGradient(r, r, 0, r, r, r); g.addColorStop(0, hexA(color, 1)); g.addColorStop(0.3, hexA(color, 0.5)); g.addColorStop(1, hexA(color, 0)); sc.fillStyle = g; sc.fillRect(0, 0, r * 2, r * 2); sprites[color] = s; return s; }
    function initPool() { pool = []; free = []; for (var i = 0; i < MAX; i++) { pool.push({ on: 0, ph: 0, t: 0, sp: 0, y0: 0, col: CY, blk: 0 }); free.push(i); } }
    function alloc() { if (!free.length) return -1; var k = free.pop(); pool[k].on = 1; return k; }
    function rel(k) { pool[k].on = 0; free.push(k); }
    function layout() {
      Ex = W * 0.15; Bx = W * 0.5; Fx = W * 0.83; midY = H * 0.5;
      var n = 6, gap = Math.min(20, H * 0.09), y0 = midY - (n - 1) * gap / 2;
      codeRows = []; for (var i = 0; i < n; i++) codeRows.push({ y: y0 + i * gap, w: 0.4 + ((i * 37) % 55) / 100, ind: (i % 3) });
      // browser içi bloklar (header, hero, card1, card2) — göreli kutu
      blocks = [{ x: 0.12, y: 0.12, w: 0.76, h: 0.14, hit: -9 }, { x: 0.12, y: 0.30, w: 0.76, h: 0.24, hit: -9 }, { x: 0.12, y: 0.58, w: 0.36, h: 0.28, hit: -9 }, { x: 0.52, y: 0.58, w: 0.36, h: 0.28, hit: -9 }];
    }
    function emit() { var k = alloc(); if (k < 0) return; var q = pool[k], r = codeRows[(Math.random() * codeRows.length) | 0]; q.ph = 0; q.t = 0; q.sp = 0.015 + Math.random() * 0.008; q.y0 = r.y; q.col = CY; q.blk = (Math.random() * blocks.length) | 0; }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function build() {
      W = stage.clientWidth; H = stage.clientHeight; if (!W || !H) { requestAnimationFrame(build); return; }
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); layout(); draw();
    }
    function stepSim(dt) {
      t += dt;
      if (t - capLast > 2.0) { capLast = t; capIdx = (capIdx + 1) % CAPS.length; if (capEl) capEl.textContent = "▸ " + CAPS[capIdx]; }
      emitAcc += dt * 9; while (emitAcc >= 1) { emitAcc -= 1; emit(); }
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; q.t += q.sp; if (q.t >= 1) { q.ph++; q.t = 0; if (q.ph === 1) buildFlash = 1; if (q.ph === 2) { deploys++; depShown = deploys; if (blocks[q.blk]) blocks[q.blk].hit = t; } if (q.ph > 2) rel(k); } }
      buildFlash *= Math.pow(0.9, dt * 60);
    }
    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.02)"; ctx.lineWidth = 1;
      for (var gx = 0; gx <= W; gx += 44) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      var glow = Math.max(0.5 + 0.5 * Math.sin(t * 1.6) * 0.5, buildFlash);
      // ---- EDİTÖR (sol) ----
      var ew = W * 0.2, eh = H * 0.6, ex = Ex - ew / 2, ey = midY - eh / 2;
      roundRect(ex, ey, ew, eh, 5); ctx.fillStyle = "rgba(6,16,27,0.75)"; ctx.fill(); ctx.strokeStyle = hexA(CY, 0.35); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = hexA(CY, 0.85); ctx.font = "700 8.5px " + C.mono; ctx.textAlign = "left"; ctx.fillText("</> KOD", ex + 10, ey + 15);
      for (var i = 0; i < codeRows.length; i++) { var r = codeRows[i], ly = r.y, lx = ex + 12 + r.ind * 9; var scan = Math.abs(((t * 0.7) % 1) - (i / codeRows.length)) < 0.09;
        roundRect(lx, ly - 3, (ew - 22 - r.ind * 9) * r.w, 5, 2); ctx.fillStyle = hexA(i % 2 ? GRN : CY, scan ? 0.9 : 0.4); ctx.fill();
        if (r.w < 0.7) { roundRect(lx + (ew - 22) * r.w + 2, ly - 3, (ew - 26) * (0.28), 5, 2); ctx.fillStyle = hexA(VIO, 0.28); ctx.fill(); }
      }
      // ---- BUILD düğümü (orta) ----
      var br = Math.max(18, Math.min(H * 0.12, 30));
      var g = ctx.createRadialGradient(Bx, midY, 0, Bx, midY, br * 2); g.addColorStop(0, hexA(GRN, 0.22 + 0.2 * buildFlash)); g.addColorStop(0.5, hexA(GRN, 0.05)); g.addColorStop(1, hexA(GRN, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(Bx, midY, br * 2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(Bx, midY, br, 0, TAU); ctx.fillStyle = hexA(GRN, 0.07); ctx.fill(); ctx.strokeStyle = hexA(GRN, 0.55 + 0.35 * buildFlash); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = hexA(GRN, 0.4); ctx.lineWidth = 1; ctx.setLineDash([2, 6]); ctx.lineDashOffset = -t * 24; ctx.beginPath(); ctx.arc(Bx, midY, br * 0.66, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText("BUILD", Bx, midY + br + 15); ctx.fillStyle = hexA(GRN, 0.85); ctx.fillText("bundle · test", Bx, midY + br + 27); ctx.textAlign = "left";
      // ---- BROWSER frame (sağ) ----
      var fw = W * 0.26, fh = H * 0.66, fx = Fx - fw / 2, fy = midY - fh / 2;
      roundRect(fx, fy, fw, fh, 6); ctx.fillStyle = "rgba(3,8,16,0.9)"; ctx.fill(); ctx.strokeStyle = hexA(GRN, 0.45 + 0.2 * glow); ctx.lineWidth = 1.3; ctx.stroke();
      var chrome = Math.max(14, fh * 0.09);
      ctx.fillStyle = hexA("#0A1626", 0.9); roundRect(fx, fy, fw, chrome, 6); ctx.fill();
      var dc = [WARN, GRN, CY]; for (var d = 0; d < 3; d++) { ctx.beginPath(); ctx.arc(fx + 10 + d * 9, fy + chrome / 2, 2.4, 0, TAU); ctx.fillStyle = hexA(dc[d], 0.7); ctx.fill(); }
      ctx.beginPath(); ctx.arc(fx + fw - 14, fy + chrome / 2, 2.6, 0, TAU); ctx.fillStyle = GRN; ctx.fill();
      // içerik bölgesi + bloklar
      var cyT = fy + chrome, ch = fh - chrome;
      ctx.save(); roundRect(fx + 3, cyT, fw - 6, ch - 3, 4); ctx.clip();
      for (var b = 0; b < blocks.length; b++) { var bl = blocks[b], age = t - bl.hit, pulse = age < 0.6 ? (1 - age / 0.6) : 0;
        var bx = fx + bl.x * fw, by = cyT + bl.y * ch, bw = bl.w * fw, bh = bl.h * ch;
        roundRect(bx, by, bw, bh, 3); ctx.fillStyle = hexA(b === 1 ? CY : GRN, 0.10 + 0.5 * pulse); ctx.fill(); ctx.strokeStyle = hexA(b === 1 ? CY : GRN, 0.3 + 0.5 * pulse); ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText("CANLI SİTE", Fx, fy + fh + 15); ctx.textAlign = "left";
      ctx.fillStyle = MUT; ctx.textAlign = "center"; ctx.fillText("</> KOD", Ex, ey + eh + 15); ctx.textAlign = "left";
      // ---- parçacıklar ----
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col = q.col;
        if (q.ph === 0) { p = { x: lerp(Ex + ew * 0.4, Bx - br * 0.7, q.t), y: lerp(q.y0, midY, q.t) }; col = CY; }
        else if (q.ph === 1) { var bl2 = blocks[q.blk], tx = fx + (bl2.x + bl2.w / 2) * fw, ty = cyT + (bl2.y + bl2.h / 2) * ch; p = { x: lerp(Bx, tx, q.t), y: lerp(midY, ty, q.t) }; col = GRN; }
        else { p = { x: Fx, y: midY }; col = GRN; }
        var rr = q.ph === 0 ? 3 : 3.3; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - rr * 2, p.y - rr * 2, rr * 4, rr * 4);
        ctx.globalAlpha = 0.9; ctx.fillStyle = GC; ctx.beginPath(); ctx.arc(p.x, p.y, 1.1, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (cntEl && depShown) cntEl.textContent = depShown.toLocaleString("tr-TR");
    }
    function tick(now) { if (!last) last = now; var dt = Math.min((now - last) / 1000, 0.05); last = now; acc += dt; while (acc >= STEP) { stepSim(STEP); acc -= STEP; } draw(); if (running) raf = requestAnimationFrame(tick); }
    function start() { if (running || reduce || !visible) return; running = true; last = 0; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    initPool(); build();
    if (reduce) { for (var w = 0; w < 240; w++) stepSim(STEP); draw(); }
    var rt = 0; function relayout() { clearTimeout(rt); rt = setTimeout(build, 140); }
    window.addEventListener("resize", relayout);
    if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(stage); } catch (e) {} }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
    if (mq && mq.addEventListener) mq.addEventListener("change", function (e) { reduce = e.matches; reduce ? stop() : start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (visible) start(); });
    if (window.IntersectionObserver) { try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }, { threshold: 0 }).observe(stage); } catch (e) {} }
    stage._pump = function (n) { for (var i = 0; i < (n || 60); i++) stepSim(STEP); draw(); };
    start();
  }

  NX.boot(renderApp);
  mountBuildFlow();
  (function () {
    var els = document.querySelectorAll("[data-cu]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseFloat(el.getAttribute("data-cu")) || 0, suf = el.getAttribute("data-suf") || "", pre = el.getAttribute("data-pre") || "", start = null, dur = 1600;
        function fmt(v) { return pre + (target % 1 ? v.toFixed(2) : Math.round(v).toLocaleString("tr-TR")) + suf; }
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); el.textContent = fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () { el.textContent = fmt(target); }, 1900);
      })(els[i]);
    }
  })();
})();
</script>
