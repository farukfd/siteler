            if (typeof res.data.score === "number") r.score = res.data.score;

    }

    var W = 0, H = 0, dpr = 1, raf = 0, running = false, visible = true;
    var STEP = 1 / 60, acc = 0, last = 0, t = 0, frameN = 0;
    var cx = 0, cy = 0, R = 120, srcs = [], outs = [], sprites = {}, gridLayer = null;
    var coreFlash = 0, outFlash = [], produce = [], dnaFill = 0.4, curAct = -1, curProg = 0, emitAcc = 0, qOut = [];
    var MAX = (window.matchMedia && window.matchMedia("(max-width:820px)").matches) ? 140 : 300;
    var pool = [], free = [];

    var ACTS = [
      { dur: 3.2, cap: "① KAYNAKLAR — 6 kaynaktan ham veri akıyor · web · saha · kamu · TÜİK · mevzuat · belediye" },
      { dur: 2.6, cap: "② TOPLA — motora çekiliyor · ingest + normalize · ~1,2M satır/gün" },
      { dur: 2.9, cap: "③ TEMİZLE — doğrulama · tekilleştirme · aykırı-değerler eleniyor ✕" },
      { dur: 3.1, cap: "④ ML · MML — 38 boyutlu mahalle DNA’sı + aylık zaman serisi üretiliyor" },
      { dur: 3.2, cap: "⑤ ÇIKTI — API · ProX karar analizi · PDF rapor · müşteri paneli" }

    var TAU = 6.28318;

      var oEls = [].slice.call(stage.querySelectorAll('[data-role="out"]'));

      });

        var col = el.getAttribute("data-col") || C.accent, pp = pipe(rimx, rimy, lx, ly, col);

      });

    }
    function buildGrid() {
      gridLayer = document.createElement("canvas"); gridLayer.width = Math.max(1, Math.round(W * dpr)); gridLayer.height = Math.max(1, Math.round(H * dpr));

      for (var x = 0; x <= W; x += 46) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
      for (var y = 0; y <= H; y += 46) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    }
    function build() {
      W = stage.clientWidth; H = stage.clientHeight; if (!W || !H) { requestAnimationFrame(build); return; }
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); anchors(); buildGrid(); draw();
    }
    function emit(si) { var k = alloc(); if (k < 0) return; var q = pool[k], s = srcs[si]; q.pipe = s.pipe; q.t = 0; q.sp = 0.012 + Math.random() * 0.008; q.col = s.col; q.ph = 0; q.rej = 0; q.a = 1; q.seed = Math.random(); q.dir = s.dir; q.oa = s.ang; }

    function syncSteps() { for (var i = 0; i < actEls.length; i++) { var fill = actEls[i].firstChild, w = i < curAct ? 100 : i === curAct ? Math.round(curProg * 100) : 0; if (fill && fill.style) fill.style.width = w + "%"; actEls[i].style.borderColor = (i === curAct) ? C.primary : C.border; } }

    function stepSim(dt) {
      t += dt;
      var lt = t % LOOP, cum = 0, ai = 0;
      for (var i = 0; i < ACTS.length; i++) { if (lt < cum + ACTS[i].dur) { ai = i; break; } cum += ACTS[i].dur; }
      curProg = (lt - cum) / ACTS[ai].dur;
      if (ai !== curAct) { curAct = ai; if (capEl) capEl.textContent = ACTS[ai].cap; }
      if (t - feedLast > 1.35) { feedLast = t; feedIdx = (feedIdx + 1) % FEED.length; cycleFeed(); }
      if (t - dimLast > 0.5) { dimLast = t; dimIdx = (dimIdx + 1) % DIM.length; if (feedDim) feedDim.textContent = "DNA " + pad2(dimIdx + 1) + "/38 · " + DIM[dimIdx]; }
      procN += dt * 14.2; elimN += dt * 14.2 * 0.18;
      if ((procF++ % 7) === 0) { if (feedProc) feedProc.textContent = Math.floor(procN).toLocaleString("tr-TR"); if (feedElim) feedElim.textContent = Math.floor(elimN).toLocaleString("tr-TR"); }
      dnaFill += (((ai === 3) ? 1 : 0.4) - dnaFill) * Math.min(1, dt * 1.6);
      emitAcc += dt * (ai === 0 ? 34 : 20);
      while (emitAcc >= 1) { emitAcc -= 1; if (srcs.length) emit((Math.random() * srcs.length) | 0); }
      for (var k = 0; k < MAX; k++) {
        var q = pool[k]; if (!q.on) continue;
        if (q.ph === 0) { q.t += q.sp; if (q.t >= 1) { q.ph = 1; q.or = R; q.os = 0; coreFlash = 1; } }
        else if (q.ph === 1) {
          q.os += dt / 0.85; var e = q.os < 1 ? q.os : 1; q.or = R * (1 - 0.72 * e * e); q.oa += q.dir * dt * 3.4;
          if (!q.rej && q.os > 0.30 && q.os < 0.52 && q.seed < 0.20) { q.rej = 1; q.ph = 3; q.x = cx + q.or * Math.cos(q.oa); q.y = cy + q.or * Math.sin(q.oa); q.vx = Math.cos(q.oa) * 150; q.vy = Math.sin(q.oa) * 150; q.a = 1; q.col = C.danger; }
          if (q.os >= 1) { coreFlash = Math.min(1, coreFlash + 0.4); qOut.push(t); rel(k); }
        }
        else if (q.ph === 2) { q.t += q.sp; if (q.t >= 1) { outFlash[q.out] = 1; if (Math.random() < 0.6) produce[q.out] = 1; rel(k); } }
        else if (q.ph === 3) { q.vx *= (1 - 0.6 * dt); q.vy *= (1 - 0.6 * dt); q.vy += 120 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.a -= 1.4 * dt; if (q.a <= 0) rel(k); }
      }
      while (qOut.length && (t - qOut[0]) > 0.25) { qOut.shift(); if (outs.length) { var oi = (Math.random() * outs.length) | 0, kk = alloc(); if (kk >= 0) { var p = pool[kk]; p.pipe = outs[oi].pipe; p.t = 0; p.sp = 0.013 + Math.random() * 0.008; p.col = outs[oi].col; p.ph = 2; p.out = oi; p.a = 1; } } }
      coreFlash *= Math.pow(0.9, dt * 60);

    }

    function strokePipe(p) { ctx.beginPath(); ctx.moveTo(p.x0, p.y0); ctx.bezierCurveTo(p.c1x, p.c1y, p.c2x, p.c2y, p.x1, p.y1); ctx.stroke(); }
    function ring(r, col, a, lw) { ctx.strokeStyle = hexA(col, a); ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke(); }
    function drawReactor() {
      // dış çekirdek ışıması
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.4), coreGlow = Math.max(pulse * 0.5, coreFlash);
      var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.15);
      bg.addColorStop(0, hexA(C.primary, 0.10 + 0.06 * coreGlow)); bg.addColorStop(0.5, hexA(C.primary, 0.03)); bg.addColorStop(1, "rgba(56,189,248,0)");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, TAU); ctx.fill();
      // dış halka + dönen tikler

      var ticks = 54, ro = t * 0.15;
      ctx.strokeStyle = hexA(C.primary, 0.28); ctx.lineWidth = 1.4;
      for (var i = 0; i < ticks; i++) { var a = ro + i / ticks * TAU, big = (i % 9 === 0); var r1 = R, r2 = R + (big ? 7 : 3); ctx.beginPath(); ctx.moveTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)); ctx.lineTo(cx + r2 * Math.cos(a), cy + r2 * Math.sin(a)); ctx.stroke(); }

      ctx.setLineDash([5, 9]); ctx.lineDashOffset = -t * 26; ring(R * 0.52, C.violet, 0.30, 1.1); ctx.setLineDash([]);
      // 38-segment DNA halkası
      var Rd = R * 0.74, sweep = (t * 0.9) % TAU;
      for (i = 0; i < 38; i++) {
        var da = t * 0.18 + i / 38 * TAU, near = Math.abs(((da - sweep + Math.PI * 3) % TAU) - Math.PI);
        var hl = near < 0.4 ? (0.4 - near) / 0.4 : 0, cur = (i === dimIdx);
        var len = (3 + 7 * (0.4 + 0.6 * Math.abs(Math.sin(i * 1.27)))) * (0.4 + 0.6 * dnaFill); if (cur) len *= 1.9;
        var aa = 0.20 + 0.55 * dnaFill + 0.5 * hl; if (cur) aa += 0.55;
        var r1 = Rd, r2 = Rd + len;
        ctx.strokeStyle = hexA(cur ? "#EAF6FF" : C.accent, Math.min(1, aa)); ctx.lineWidth = 1.6 + 1.4 * hl + (cur ? 1.6 : 0);
        ctx.beginPath(); ctx.moveTo(cx + r1 * Math.cos(da), cy + r1 * Math.sin(da)); ctx.lineTo(cx + r2 * Math.cos(da), cy + r2 * Math.sin(da)); ctx.stroke();
        if (cur) { ctx.fillStyle = hexA(C.accent, 0.9); ctx.beginPath(); ctx.arc(cx + r2 * Math.cos(da), cy + r2 * Math.sin(da), 2.2, 0, TAU); ctx.fill(); }
      }

      var Rc = R * 0.32 * (1 + 0.05 * pulse + 0.08 * coreFlash);
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rc);
      cg.addColorStop(0, hexA(C.primary, 0.55 + 0.35 * coreGlow)); cg.addColorStop(0.6, hexA(C.primary, 0.14)); cg.addColorStop(1, "rgba(56,189,248,0)");
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, Rc, 0, TAU); ctx.fill();
      ring(Rc, C.primary, 0.4 + 0.3 * coreGlow, 1);
    }
    function drawParticle(q) {
      var s, te, tp, tr, pos;
      if (q.ph === 0 || q.ph === 2) {
        for (s = 4; s >= 1; s--) { te = q.t - s * 0.03; if (te < 0) continue; tp = bz(q.pipe, te); tr = (5 - s) * 1.3; ctx.globalAlpha = 0.32 - s * 0.055; ctx.drawImage(sprite(q.col), tp.x - tr, tp.y - tr, tr * 2, tr * 2); }
        pos = bz(q.pipe, q.t); ctx.globalAlpha = 0.96; ctx.drawImage(sprite(q.col), pos.x - 6, pos.y - 6, 12, 12);
        ctx.globalAlpha = 0.9; ctx.fillStyle = "#EAF6FF"; ctx.beginPath(); ctx.arc(pos.x, pos.y, 1.3, 0, TAU); ctx.fill();
      } else if (q.ph === 1) {
        var x = cx + q.or * Math.cos(q.oa), y = cy + q.or * Math.sin(q.oa), col = q.os > 0.55 ? C.accent : q.col, hr = 4 + 2 * q.os;
        ctx.globalAlpha = 0.9; ctx.drawImage(sprite(col), x - hr, y - hr, hr * 2, hr * 2);
        ctx.globalAlpha = 0.85; ctx.fillStyle = "#EAF6FF"; ctx.beginPath(); ctx.arc(x, y, 1.1, 0, TAU); ctx.fill();
      } else if (q.ph === 3) { ctx.globalAlpha = Math.max(0, q.a) * 0.92; ctx.drawImage(sprite(C.danger), q.x - 5, q.y - 5, 10, 10); }
    }
    function draw() {
      if (!srcs.length && !outs.length) return;
      ctx.clearRect(0, 0, W, H);
      if (gridLayer) ctx.drawImage(gridLayer, 0, 0, W, H);
      var i;
      for (i = 0; i < srcs.length; i++) { ctx.strokeStyle = srcs[i].pipe.grad; ctx.lineWidth = 1.2; strokePipe(srcs[i].pipe); }
      for (i = 0; i < outs.length; i++) { ctx.strokeStyle = outs[i].pipe.grad; ctx.lineWidth = 1.2; strokePipe(outs[i].pipe); }
      drawReactor();
      ctx.globalCompositeOperation = "lighter";
      for (i = 0; i < outs.length; i++) { if (outFlash[i] > 0.01) { var o = outs[i], orr = 18 * outFlash[i]; ctx.globalAlpha = outFlash[i] * 0.8; ctx.drawImage(sprite(o.col), o.rimx - orr, o.rimy - orr, orr * 2, orr * 2); } }

  (function () {
    var els = document.querySelectorAll("[data-cu]");
    for (var i = 0; i < els.length; i++) {

        var target = parseFloat(el.getAttribute("data-cu")) || 0, suf = el.getAttribute("data-suf") || "", pre = el.getAttribute("data-pre") || "", start = null, dur = 1600;
        function fmt(v) { return pre + Math.round(v).toLocaleString("tr-TR") + suf; }
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); el.textContent = fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }

})();
