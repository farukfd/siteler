      return '<div style="' + css({ background: C.raised, padding: 16, position: "relative" }) + '"><div style="' + css({ position: "absolute", top: 12, right: 14, fontSize: 22, color: c.col, opacity: 0.6, fontFamily: C.mono }) + '">' + c.sym + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: c.col, fontWeight: 700, letterSpacing: "0.08em", marginBottom: 4 }) + '">' + c.ent + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.textFaint, letterSpacing: "0.04em", marginBottom: 10 }) + '">' + c.src + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 11, color: c.col, fontWeight: 600, marginBottom: 8 }) + '">· ' + c.issue + '</div><p style="' + css({ fontSize: 12, lineHeight: 1.55, color: C.textMut, margin: 0 }) + '">' + c.detail + '</p></div>';

      + '<h2 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(1.7rem,4.4vw,2.8rem)", fontWeight: 700, lineHeight: 1.1, letterSpacing: "-0.025em", margin: 0, color: C.textPri, maxWidth: 1000 }) + '">Türkiye’de gerçek piyasa verisini <span style="' + css({ color: C.primary }) + '">mahalle ölçeğinde tutan</span><br><span style="' + css({ color: C.primary }) + '">tek özel veri altyapısı.</span></h2>'
