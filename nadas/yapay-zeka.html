      emitAcc += dt * 9; while (emitAcc >= 1) { emitAcc -= 1; emit(); }
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; q.t += q.sp;
        if (q.t >= 1) { q.ph++; q.t = 0;
          if (q.lane === 0) { if (q.ph > 1) { approved++; apprShown = approved; rel(k); } }
          else { if (q.ph === 1) gateFlash = 1; if (q.ph > 2) { approved++; apprShown = approved; rel(k); } }
        } }
      gateFlash *= Math.pow(0.9, dt * 60);
    }
    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function node(x, y, col, label, sub, glow, r) {
      r = r || Math.max(18, Math.min(H * 0.11, 28));
      var g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.9); g.addColorStop(0, hexA(col, 0.22 + 0.18 * glow)); g.addColorStop(0.5, hexA(col, 0.05)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = hexA(col, 0.08); ctx.fill(); ctx.strokeStyle = hexA(col, 0.6 + 0.3 * glow); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText(label, x, y + r + 14); if (sub) { ctx.fillStyle = hexA(col, 0.85); ctx.fillText(sub, x, y + r + 25); } ctx.textAlign = "left";
      return r;
    }
    function outPanel(x, y, col, top) {
      var w = W * 0.13, h = H * 0.17, bx = x - w / 2, by = y - h / 2;
      roundRect(bx, by, w, h, 5); ctx.fillStyle = "rgba(6,16,27,0.82)"; ctx.fill(); ctx.strokeStyle = hexA(col, 0.45); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = hexA(col, 0.9); ctx.font = "700 9px " + C.mono; ctx.textAlign = "left"; ctx.fillText(top, bx + 9, by + 16);
      return { x: bx, y: by, w: w, h: h };
    }
    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.02)"; ctx.lineWidth = 1;
      for (var gx = 0; gx <= W; gx += 44) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      ctx.strokeStyle = hexA("#94A3B8", 0.14); ctx.lineWidth = 1; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(W * 0.02, H * 0.51); ctx.lineTo(W * 0.98, H * 0.51); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = hexA("#94A3B8", 0.4); ctx.font = "700 8px " + C.mono; ctx.textAlign = "center"; ctx.fillText("HESAPLAYAN  ≠  YAZAN", W * 0.5, H * 0.51 + 3); ctx.textAlign = "left";
      ctx.fillStyle = hexA(GRN, 0.5); ctx.font = "700 8.5px " + C.mono; ctx.textAlign = "center"; ctx.fillText("VERİ", Sx, topY - H * 0.13); ctx.textAlign = "left";
      for (var i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(Sx + (i % 2) * 8 - 4, topY - H * 0.09 + i * 7, 1.7, 0, TAU); ctx.fillStyle = hexA(GRN, 0.4); ctx.fill(); }
      var pr = node(Nx1, topY, GRN, "ProX", "determinist", Math.max(proxPulse * 0.5, 0), 0);
      ctx.strokeStyle = hexA(GRN, 0.35); ctx.lineWidth = 1; ctx.setLineDash([2, 5]); ctx.lineDashOffset = -t * 14; ctx.beginPath(); ctx.arc(Nx1, topY, pr * 0.64, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      var kp = outPanel(Ox, topY, GRN, "SAYISAL KARAR");
      node(Nx2, botY, VIO, "DİL MODELİ", "üretken · LLM", 0.3, 0);
      var er = Math.max(15, Math.min(H * 0.08, 22));
      var eg = ctx.createRadialGradient(Gx, botY, 0, Gx, botY, er * 1.8); eg.addColorStop(0, hexA(CY, 0.2 + 0.3 * gateFlash)); eg.addColorStop(1, hexA(CY, 0));
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(Gx, botY, er * 1.8, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(Gx, botY, er, 0, TAU); ctx.fillStyle = hexA(CY, 0.08); ctx.fill(); ctx.strokeStyle = hexA(CY, 0.6 + 0.3 * gateFlash); ctx.lineWidth = 1.4; ctx.stroke();
      ctx.strokeStyle = hexA(CY, 0.8 + 0.2 * gateFlash); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(Gx - er * 0.32, botY); ctx.lineTo(Gx - er * 0.06, botY + er * 0.28); ctx.lineTo(Gx + er * 0.36, botY - er * 0.3); ctx.stroke();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText("İNSAN EDİTÖR", Gx, botY + er + 14); ctx.fillStyle = hexA(CY, 0.85); ctx.fillText("onay kapısı", Gx, botY + er + 25); ctx.textAlign = "left";
      var mp = outPanel(Ox, botY, VIO, "ONAYLI METİN");
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col;
        if (q.lane === 0) {
          if (q.ph === 0) { p = { x: lerp(Sx + W * 0.03, Nx1 - pr * 0.7, q.t), y: lerp(q.y0, topY, q.t) }; }
          else { p = { x: lerp(Nx1, kp.x, q.t), y: topY }; }
          col = GRN;
        } else {
          if (q.ph === 0) { p = { x: lerp(Nx2, Gx - er * 0.7, q.t), y: botY }; col = VIO; }
          else if (q.ph === 1) { p = { x: Gx, y: botY }; col = CY; }
          else { p = { x: lerp(Gx, mp.x, q.t), y: botY }; col = VIO; }
        }
        var rr = 3.2; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - rr * 2, p.y - rr * 2, rr * 4, rr * 4);
        ctx.globalAlpha = 0.9; ctx.fillStyle = GC; ctx.beginPath(); ctx.arc(p.x, p.y, 1.1, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (cntEl && apprShown) cntEl.textContent = apprShown.toLocaleString("tr-TR");
    }
    function tick(now) { if (!last) last = now; var dt = Math.min((now - last) / 1000, 0.05); last = now; acc += dt; while (acc >= STEP) { stepSim(STEP); acc -= STEP; } draw(); if (running) raf = requestAnimationFrame(tick); }
    function start() { if (running || reduce || !visible) return; running = true; last = 0; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    initPool(); build();
    if (reduce) { for (var w = 0; w < 240; w++) stepSim(STEP); draw(); }
    var rt = 0; function relayout() { clearTimeout(rt); rt = setTimeout(build, 140); }
    window.addEventListener("resize", relayout);
    if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(stage); } catch (e) {} }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
    if (mq && mq.addEventListener) mq.addEventListener("change", function (e) { reduce = e.matches; reduce ? stop() : start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (visible) start(); });
    if (window.IntersectionObserver) { try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }, { threshold: 0 }).observe(stage); } catch (e) {} }
    stage._pump = function (n) { for (var i = 0; i < (n || 60); i++) stepSim(STEP); draw(); };
    start();
  }

  NX.boot(renderApp);
  mountAIFlow();
  (function () {
    var els = document.querySelectorAll("[data-cu]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseFloat(el.getAttribute("data-cu")) || 0, suf = el.getAttribute("data-suf") || "", pre = el.getAttribute("data-pre") || "", start = null, dur = 1600;
        function fmt(v) { return pre + (target % 1 ? v.toFixed(2) : Math.round(v).toLocaleString("tr-TR")) + suf; }
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); el.textContent = fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () { el.textContent = fmt(target); }, 1900);
      })(els[i]);
    }
  })();
})();
</script>
