      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col;
        if (q.ph === 0) { p = { x: lerp(DATA, RAG, q.t), y: lerp(q.y0, midY, q.t) }; col = CY; }
        else if (q.ph === 1) { var ty = q.core === 0 ? proxY : llmY; p = { x: lerp(RAG, coreX, q.t), y: lerp(midY, ty, q.t) }; col = q.core === 0 ? GRN : VIO; }
        else if (q.core === 0) { if (q.ph === 2) { p = { x: lerp(coreX, gateX, q.t), y: lerp(proxY, midY, q.t) }; col = GRN; } else { p = { x: lerp(gateX, outX, q.t), y: midY }; col = GRN; } }
        else if (q.tool === 0) { if (q.ph === 2) { p = { x: lerp(coreX, gateX, q.t), y: lerp(llmY, midY, q.t) }; col = VIO; } else { p = { x: lerp(gateX, outX, q.t), y: midY }; col = VIO; } }
        else { if (q.ph === 2) { p = { x: lerp(coreX, toolX, q.t), y: llmY }; col = WARN; } else if (q.ph === 3) { p = { x: lerp(toolX, gateX, q.t), y: lerp(llmY, midY, q.t) }; col = WARN; } else { p = { x: lerp(gateX, outX, q.t), y: midY }; col = VIO; } }
        var prr = 3; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - prr * 2, p.y - prr * 2, prr * 4, prr * 4);
        ctx.globalAlpha = 0.9; ctx.fillStyle = GC; ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (cntEl && doneShown) cntEl.textContent = doneShown.toLocaleString("tr-TR");
    }
    function tick(now) { if (!last) last = now; var dt = Math.min((now - last) / 1000, 0.05); last = now; acc += dt; while (acc >= STEP) { stepSim(STEP); acc -= STEP; } draw(); if (running) raf = requestAnimationFrame(tick); }
    function start() { if (running || reduce || !visible) return; running = true; last = 0; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    initPool(); build();
    if (reduce) { for (var w = 0; w < 240; w++) stepSim(STEP); draw(); }
    var rt = 0; function relayout() { clearTimeout(rt); rt = setTimeout(build, 140); }
    window.addEventListener("resize", relayout);
    if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(stage); } catch (e) {} }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
    if (mq && mq.addEventListener) mq.addEventListener("change", function (e) { reduce = e.matches; reduce ? stop() : start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (visible) start(); });
    if (window.IntersectionObserver) { try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }, { threshold: 0 }).observe(stage); } catch (e) {} }
    stage._pump = function (n) { for (var i = 0; i < (n || 60); i++) stepSim(STEP); draw(); };
    start();
  }

  /* ===== C BÖLÜMÜ ANİMASYONU · RAG + TOOL BORU HATTI ===== */
  function mountRagFlow() {
    var stage = document.getElementById("rag-stage");
    var cv = stage && document.getElementById("rag-canvas");
    if (!stage || !cv || !cv.getContext) return;
    var ctx = cv.getContext("2d");
    var capEl = document.getElementById("rag-cap"), cntEl = document.getElementById("rag-count");
    var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    var reduce = !!(mq && mq.matches);
    var W = 0, H = 0, dpr = 1, raf = 0, running = false, visible = true;
    var STEP = 1 / 60, acc = 0, last = 0, t = 0, TAU = 6.28318;
    var CY = "#38BDF8", GRN = "#34D399", VIO = "#A78BFA", WARN = "#FBBF24", GC = "#EAF6FF", MUT = "#64748B";
    var X = {}, midY = 0, botY = 0, pool = [], free = [], MAX = 72, emitAcc = 0, answered = 0, ansShown = 0, dbFlash = 0, toolFlash = 0;
    var CAPS = ["soru → embedding (vektör)", "vektör arama · en yakın parçalar", "retrieval → modele bağlam", "tool: ProX / API çağrısı", "yanıt + kaynak gösterimi"];
    var capIdx = -1, capLast = 0;
    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }
    var sprites = {};
    function sprite(color) { if (sprites[color]) return sprites[color]; var r = 14, s = document.createElement("canvas"); s.width = s.height = r * 2; var sc = s.getContext("2d"), g = sc.createRadialGradient(r, r, 0, r, r, r); g.addColorStop(0, hexA(color, 1)); g.addColorStop(0.3, hexA(color, 0.5)); g.addColorStop(1, hexA(color, 0)); sc.fillStyle = g; sc.fillRect(0, 0, r * 2, r * 2); sprites[color] = s; return s; }
    function initPool() { pool = []; free = []; for (var i = 0; i < MAX; i++) { pool.push({ on: 0, ph: 0, t: 0, sp: 0, tool: 0, y0: 0 }); free.push(i); } }
    function alloc() { if (!free.length) return -1; var k = free.pop(); pool[k].on = 1; return k; }
    function rel(k) { pool[k].on = 0; free.push(k); }
    function layout() { X = { soru: W * 0.07, embed: W * 0.25, db: W * 0.44, llm: W * 0.66, ans: W * 0.9 }; midY = H * 0.4; botY = H * 0.68; }
    function emit() { var k = alloc(); if (k < 0) return; var q = pool[k]; q.ph = 0; q.t = 0; q.sp = 0.016 + Math.random() * 0.008; q.tool = Math.random() < 0.35 ? 1 : 0; q.y0 = midY + (Math.random() - 0.5) * H * 0.05; }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function build() { W = stage.clientWidth; H = stage.clientHeight; if (!W || !H) { requestAnimationFrame(build); return; } dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); layout(); draw(); }
    function stepSim(dt) {
      t += dt;
      if (t - capLast > 1.9) { capLast = t; capIdx = (capIdx + 1) % CAPS.length; if (capEl) capEl.textContent = "▸ " + CAPS[capIdx]; }
      emitAcc += dt * 7; while (emitAcc >= 1) { emitAcc -= 1; emit(); }
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; q.t += q.sp; if (q.t >= 1) { q.ph++; q.t = 0;
        if (q.ph === 2) dbFlash = 1;
        if (!q.tool) { if (q.ph >= 3) { answered++; ansShown = answered; rel(k); } }
        else { if (q.ph === 3) toolFlash = 1; if (q.ph >= 5) { answered++; ansShown = answered; rel(k); } }
      } }
      dbFlash *= Math.pow(0.9, dt * 60); toolFlash *= Math.pow(0.9, dt * 60);
    }
    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function nd(x, y, col, label, sub, glow) {
      var r = Math.max(15, Math.min(H * 0.1, 24));
      var g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.9); g.addColorStop(0, hexA(col, 0.2 + 0.2 * glow)); g.addColorStop(0.5, hexA(col, 0.05)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = hexA(col, 0.08); ctx.fill(); ctx.strokeStyle = hexA(col, 0.6 + 0.3 * glow); ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = MUT; ctx.font = "700 8px " + C.mono; ctx.textAlign = "center"; ctx.fillText(label, x, y + r + 12); if (sub) { ctx.fillStyle = hexA(col, 0.8); ctx.fillText(sub, x, y + r + 22); } ctx.textAlign = "left";
      return r;
    }
    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.02)"; ctx.lineWidth = 1;
      for (var gx = 0; gx <= W; gx += 44) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      // ana hat çizgisi
      ctx.strokeStyle = hexA(VIO, 0.1); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X.soru, midY); ctx.lineTo(X.ans, midY); ctx.stroke();
      nd(X.soru, midY, CY, "SORU", "", 0.2);
      nd(X.embed, midY, VIO, "EMBED", "vektör", 0.2);
      var dr = nd(X.db, midY, GRN, "VEKTÖR DB", "retrieval", dbFlash);
      // chunk bars (DB'nin altında)
      for (var c = 0; c < 4; c++) { var by = midY + dr + 24 + c * 7, lit = dbFlash > 0.2 && c < 3; roundRect(X.db - 16, by, 32 * (0.6 + c * 0.12), 4, 2); ctx.fillStyle = hexA(GRN, lit ? 0.8 : 0.25); ctx.fill(); }
      nd(X.llm, midY, VIO, "LLM", "seçtiğiniz model", 0.25);
      // tool düğümü (LLM altında)
      var tr = nd(X.llm, botY, WARN, "TOOL", "ProX · API", toolFlash);
      ctx.strokeStyle = hexA(WARN, 0.12); ctx.lineWidth = 1; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(X.llm, midY + 24); ctx.lineTo(X.llm, botY - tr); ctx.stroke(); ctx.setLineDash([]);
      // yanıt paneli
      var w = W * 0.14, h = H * 0.3, bx = X.ans - w / 2, by = midY - h / 2;
      roundRect(bx, by, w, h, 5); ctx.fillStyle = "rgba(6,16,27,0.82)"; ctx.fill(); ctx.strokeStyle = hexA(GRN, 0.4); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = hexA(GRN, 0.9); ctx.font = "700 8.5px " + C.mono; ctx.textAlign = "left"; ctx.fillText("YANIT", bx + 8, by + 15);
      ctx.fillStyle = hexA("#CBD5E1", 0.45); ctx.font = "7.5px " + C.mono; for (var r2 = 0; r2 < 3; r2++) ctx.fillText("• kaynak [" + (r2 + 1) + "]", bx + 8, by + 30 + r2 * 12);
      // parçacıklar
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col = VIO;
        if (q.ph === 0) { p = { x: lerp(X.soru, X.embed, q.t), y: lerp(q.y0, midY, q.t) }; col = CY; }
        else if (q.ph === 1) { p = { x: lerp(X.embed, X.db, q.t), y: midY }; col = VIO; }
        else if (q.ph === 2) { p = { x: lerp(X.db, X.llm, q.t), y: midY }; col = GRN; }
        else if (q.ph === 3) { if (q.tool) { p = { x: X.llm, y: lerp(midY, botY, q.t) }; col = WARN; } else { p = { x: lerp(X.llm, X.ans, q.t), y: midY }; col = GRN; } }
        else if (q.ph === 4) { p = { x: X.llm, y: lerp(botY, midY, q.t) }; col = WARN; }
        else { p = { x: lerp(X.llm, X.ans, q.t), y: midY }; col = GRN; }
        var rr = 3; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - rr * 2, p.y - rr * 2, rr * 4, rr * 4);
        ctx.globalAlpha = 0.9; ctx.fillStyle = GC; ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (cntEl && ansShown) cntEl.textContent = ansShown.toLocaleString("tr-TR");
    }
    function tick(now) { if (!last) last = now; var dt = Math.min((now - last) / 1000, 0.05); last = now; acc += dt; while (acc >= STEP) { stepSim(STEP); acc -= STEP; } draw(); if (running) raf = requestAnimationFrame(tick); }
    function start() { if (running || reduce || !visible) return; running = true; last = 0; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    initPool(); build();
    if (reduce) { for (var w = 0; w < 200; w++) stepSim(STEP); draw(); }
    var rt = 0; function relayout() { clearTimeout(rt); rt = setTimeout(build, 140); }
    window.addEventListener("resize", relayout);
    if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(stage); } catch (e) {} }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
    if (mq && mq.addEventListener) mq.addEventListener("change", function (e) { reduce = e.matches; reduce ? stop() : start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (visible) start(); });
    if (window.IntersectionObserver) { try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }, { threshold: 0 }).observe(stage); } catch (e) {} }
    stage._pump = function (n) { for (var i = 0; i < (n || 60); i++) stepSim(STEP); draw(); };
    start();
  }

  NX.boot(renderApp);
  mountAIFlow();
  mountRagFlow();
  (function () {
    var els = document.querySelectorAll("[data-cu]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseFloat(el.getAttribute("data-cu")) || 0, suf = el.getAttribute("data-suf") || "", pre = el.getAttribute("data-pre") || "", start = null, dur = 1600;
        function fmt(v) { return pre + (target % 1 ? v.toFixed(2) : Math.round(v).toLocaleString("tr-TR")) + suf; }
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); el.textContent = fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () { el.textContent = fmt(target); }, 1900);
      })(els[i]);
    }
  })();
})();
</script>
