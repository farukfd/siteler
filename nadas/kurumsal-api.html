  /* ===== HERO ANİMASYONU · İSTEK → GEÇİT → ProX → YANIT ===== */
  function mountApiFlow() {
    var stage = document.getElementById("api-stage");
    var cv = stage && document.getElementById("api-canvas");
    if (!stage || !cv || !cv.getContext) return;
    var ctx = cv.getContext("2d");
    var capEl = document.getElementById("api-cap"), cntEl = document.getElementById("api-count");
    var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    var reduce = !!(mq && mq.matches);
    var W = 0, H = 0, dpr = 1, raf = 0, running = false, visible = true;
    var STEP = 1 / 60, acc = 0, last = 0, t = 0, TAU = 6.28318;
    var CY = "#38BDF8", GRN = "#34D399", VIO = "#A78BFA", WARN = "#FBBF24", GC = "#EAF6FF", MUT = "#64748B";
    var Cx = 0, Gx = 0, Px = 0, Rx = 0, midY = 0, reqRows = [], pool = [], free = [], MAX = 80, emitAcc = 0, done = 0, doneShown = 0, flash = 0;
    var REQ = [["GET", "/endeks", CY], ["GET", "/dna/{id}", GRN], ["POST", "/analyze", WARN], ["WS", "/stream", VIO], ["GET", "/timeseries", CY]];
    var CAPS = ["GET /endeks · 200 OK · 84ms", "GET /dna/{id} · 200 OK · 71ms", "POST /prox/analyze · 202 · async", "WS /stream · canlı endeks akışı", "X-Tenant-Key doğrulandı · scope: read"];
    var capIdx = -1, capLast = 0;
    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }
    var sprites = {};
    function sprite(color) { if (sprites[color]) return sprites[color]; var r = 16, s = document.createElement("canvas"); s.width = s.height = r * 2; var sc = s.getContext("2d"), g = sc.createRadialGradient(r, r, 0, r, r, r); g.addColorStop(0, hexA(color, 1)); g.addColorStop(0.3, hexA(color, 0.5)); g.addColorStop(1, hexA(color, 0)); sc.fillStyle = g; sc.fillRect(0, 0, r * 2, r * 2); sprites[color] = s; return s; }
    function initPool() { pool = []; free = []; for (var i = 0; i < MAX; i++) { pool.push({ on: 0, ph: 0, t: 0, sp: 0, y0: 0, col: CY, seed: 0 }); free.push(i); } }
    function alloc() { if (!free.length) return -1; var k = free.pop(); pool[k].on = 1; return k; }
    function rel(k) { pool[k].on = 0; free.push(k); }
    function layout() {
      Cx = W * 0.12; Gx = W * 0.44; Px = W * 0.63; Rx = W * 0.87; midY = H * 0.5;
      reqRows = []; var n = REQ.length, gap = Math.min(30, H * 0.11), y0 = midY - (n - 1) * gap / 2;
      for (var i = 0; i < n; i++) reqRows.push({ y: y0 + i * gap, m: REQ[i][0], p: REQ[i][1], col: REQ[i][2] });
    }
    function emit() { var k = alloc(); if (k < 0) return; var q = pool[k], s = reqRows[(Math.random() * reqRows.length) | 0]; q.ph = 0; q.t = 0; q.sp = 0.014 + Math.random() * 0.008; q.y0 = s.y; q.col = s.col; q.seed = Math.random(); }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function build() {
      W = stage.clientWidth; H = stage.clientHeight; if (!W || !H) { requestAnimationFrame(build); return; }
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); layout(); draw();
    }
    function stepSim(dt) {
      t += dt;
      if (t - capLast > 2.0) { capLast = t; capIdx = (capIdx + 1) % CAPS.length; if (capEl) capEl.textContent = "▸ " + CAPS[capIdx]; }
      emitAcc += dt * 8; while (emitAcc >= 1) { emitAcc -= 1; emit(); }
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue;
        q.t += q.sp; if (q.t >= 1) { q.ph++; q.t = 0; if (q.ph === 1) flash = 1; if (q.ph === 3) { done++; doneShown = done; } if (q.ph > 3) rel(k); } }
      flash *= Math.pow(0.9, dt * 60);
    }
    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function node(x, col, label, sub, glow) {
      var r = Math.max(20, Math.min(H * 0.13, 34));
      var g = ctx.createRadialGradient(x, midY, 0, x, midY, r * 1.9); g.addColorStop(0, hexA(col, 0.22 + 0.18 * glow)); g.addColorStop(0.5, hexA(col, 0.05)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, midY, r * 1.9, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x, midY, r, 0, TAU); ctx.fillStyle = hexA(col, 0.08); ctx.fill(); ctx.strokeStyle = hexA(col, 0.6 + 0.3 * glow); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText(label, x, midY + r + 15); if (sub) { ctx.fillStyle = hexA(col, 0.8); ctx.fillText(sub, x, midY + r + 27); } ctx.textAlign = "left";
      return r;
    }
    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.02)"; ctx.lineWidth = 1;
      for (var gx = 0; gx <= W; gx += 44) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.6), glow = Math.max(pulse * 0.5, flash);
      // istek satırları (sol)
      for (var i = 0; i < reqRows.length; i++) { var s = reqRows[i], rw = W * 0.13, x = Cx - rw / 2;
        roundRect(x, s.y - 9, rw, 18, 3); ctx.fillStyle = hexA(s.col, 0.1); ctx.fill();
        ctx.fillStyle = hexA(s.col, 0.95); ctx.font = "700 8.5px " + C.mono; ctx.textBaseline = "middle"; ctx.fillText(s.m, x + 7, s.y);
        ctx.fillStyle = hexA("#CBD5E1", 0.8); ctx.fillText(s.p, x + 30, s.y);
        ctx.strokeStyle = hexA(s.col, 0.06); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + rw, s.y); ctx.quadraticCurveTo((x + rw + Gx) / 2, (s.y + midY) / 2, Gx - 26, midY); ctx.stroke();
      }
      ctx.textBaseline = "alphabetic";
      // düğümler
      var gr = node(Gx, WARN, "GEÇİT", "auth · limit", glow);
      // geçit auth halkası
      ctx.strokeStyle = hexA(WARN, 0.4); ctx.lineWidth = 1; ctx.setLineDash([2, 6]); ctx.lineDashOffset = -t * 22; ctx.beginPath(); ctx.arc(Gx, midY, gr * 0.66, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      node(Px, GRN, "ProX", "motor", glow);
      // yanıt paneli (sağ)
      var vw = W * 0.15, vh = H * 0.44, vx = Rx - vw / 2, vy = midY - vh / 2;
      roundRect(vx, vy, vw, vh, 5); ctx.fillStyle = "rgba(6,16,27,0.85)"; ctx.fill(); ctx.strokeStyle = hexA(GRN, 0.4 + 0.2 * glow); ctx.lineWidth = 1.3; ctx.stroke();
      ctx.save(); roundRect(vx + 3, vy + 3, vw - 6, vh - 6, 4); ctx.clip();
      ctx.fillStyle = hexA(GRN, 0.85); ctx.font = "9px " + C.mono; ctx.fillText("200 OK", vx + 10, vy + 20);
      ctx.fillStyle = hexA("#CBD5E1", 0.5); for (var r2 = 0; r2 < 7; r2++) { var yy = vy + 34 + r2 * 14 + ((t * 12) % 14); ctx.fillText("{ \"data\": …" + (r2 % 2 ? "}" : ""), vx + 10, yy); }
      ctx.restore();
      ctx.fillStyle = MUT; ctx.font = "700 9px " + C.mono; ctx.textAlign = "center"; ctx.fillText("İSTEK", Cx, midY + H * 0.34); ctx.fillText("JSON YANIT", Rx, vy + vh + 15); ctx.textAlign = "left";
      // parçacıklar
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col = q.col;
        if (q.ph === 0) { var x = lerp(Cx + W * 0.065, Gx - gr * 0.7, q.t); p = { x: x, y: lerp(q.y0, midY, q.t) }; }
        else if (q.ph === 1) { p = { x: lerp(Gx, Px, q.t), y: midY }; col = WARN; }
        else if (q.ph === 2) { p = { x: lerp(Px, Rx - vw * 0.4, q.t), y: lerp(midY, midY + (q.seed - 0.5) * vh * 0.6, q.t) }; col = GRN; }
        else { p = { x: Rx, y: midY }; col = GRN; }
        var rr = q.ph === 0 ? 3 : 3.4; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - rr * 2, p.y - rr * 2, rr * 4, rr * 4);
        ctx.globalAlpha = 0.9; ctx.fillStyle = GC; ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (cntEl && doneShown) cntEl.textContent = doneShown.toLocaleString("tr-TR");
    }
    function tick(now) { if (!last) last = now; var dt = Math.min((now - last) / 1000, 0.05); last = now; acc += dt; while (acc >= STEP) { stepSim(STEP); acc -= STEP; } draw(); if (running) raf = requestAnimationFrame(tick); }
    function start() { if (running || reduce || !visible) return; running = true; last = 0; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    initPool(); build();
    if (reduce) { for (var w = 0; w < 240; w++) stepSim(STEP); draw(); }
    var rt = 0; function relayout() { clearTimeout(rt); rt = setTimeout(build, 140); }
    window.addEventListener("resize", relayout);
    if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(stage); } catch (e) {} }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
    if (mq && mq.addEventListener) mq.addEventListener("change", function (e) { reduce = e.matches; reduce ? stop() : start(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (visible) start(); });
    if (window.IntersectionObserver) { try { new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }, { threshold: 0 }).observe(stage); } catch (e) {} }
    stage._pump = function (n) { for (var i = 0; i < (n || 60); i++) stepSim(STEP); draw(); };
    start();
  }

  NX.boot(renderApp);
  mountApiFlow();
  (function () {
    var els = document.querySelectorAll("[data-cu]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        var target = parseFloat(el.getAttribute("data-cu")) || 0, suf = el.getAttribute("data-suf") || "", pre = el.getAttribute("data-pre") || "", start = null, dur = 1600;
        function fmt(v) { return pre + (target % 1 ? v.toFixed(2) : Math.round(v).toLocaleString("tr-TR")) + suf; }
        function step(t) { if (!start) start = t; var p = Math.min((t - start) / dur, 1); el.textContent = fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
        setTimeout(function () { el.textContent = fmt(target); }, 1900);
      })(els[i]);
    }
  })();
})();
