<head>

<meta name="robots" content="index,follow">

<body>
<div id="app"><noscript><div style="max-width:900px;margin:0 auto;padding:48px 20px;font-family:'Sora',sans-serif"><h1 style="color:#38BDF8">Kullanım Koşulları — NADAS</h1><p style="color:#CBD5E1">Sitemizi kullanarak bu koşulları kabul etmiş sayılırsınız. Görüntülemek için JavaScript gereklidir.</p></div></noscript></div>
<script src="js/core.js?v=23"></script>
<script>
(function () {
  "use strict";
  var C = NX.C, css = NX.css;
  NX.setAccent(C.primary);

  var TICK = [["YASAL METİN", "KULLANIM KOŞULLARI"], ["FERAĞ", "YATIRIM TAVSİYESİ DEĞİLDİR"], ["SPK", "RAPORU NİTELİĞİNDE DEĞİLDİR"], ["FİKRİ MÜLKİYET", "NADAS’A AİTTİR"], ["YETKİLİ MAHKEME", "İSTANBUL"], ["SON GÜNCELLEME", "18.07.2026"], ["SINCE 2005", "21 YIL"]];

  var FIRMA = "Nadas Gayrimenkul Bilgi İletişim Sistemleri Ticaret Limited Şirketi";
  var UPDATED = "18 Temmuz 2026";

  function P(t) { return '<p style="' + css({ fontSize: 14, lineHeight: 1.75, color: C.textSec, margin: "0 0 12px" }) + '">' + t + '</p>'; }
  function UL(items) { return '<ul style="' + css({ margin: "2px 0 12px", padding: 0, listStyle: "none", display: "flex", flexDirection: "column", gap: 8 }) + '">' + items.map(function (it) { return '<li style="' + css({ fontSize: 13.5, lineHeight: 1.6, color: C.textSec, display: "flex", gap: 10 }) + '"><span style="' + css({ color: C.primary, fontFamily: C.mono, fontSize: 11, marginTop: 3, flexShrink: 0 }) + '">→</span><span>' + it + '</span></li>'; }).join("") + '</ul>'; }

  var DISCLAIMER = '<div style="' + css({ margin: "4px 0 12px", padding: "16px 18px", border: "1px solid " + C.warn, background: "rgba(251,191,36,0.05)" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10.5, color: C.warn, fontWeight: 700, letterSpacing: "0.1em", marginBottom: 8 }) + '">◆ ÖNEMLİ SORUMLULUK REDDİ</div><p style="' + css({ fontSize: 13.5, lineHeight: 1.65, color: C.textSec, margin: 0 }) + '">NADAS tarafından sunulan endeks, analiz ve veriler <strong style="color:' + C.textPri + '">yatırım tavsiyesi niteliğinde değildir</strong> ve <strong style="color:' + C.textPri + '">SPK mevzuatı kapsamında bir değerleme/ekspertiz raporu niteliği taşımaz</strong>. Veriler bilgilendirme amaçlıdır; alım-satım, kiralama veya yatırım kararlarınızdan doğacak sonuçlardan kullanıcı sorumludur. Resmi ve bağlayıcı değerleme için SPK lisanslı uzmanlarca hazırlanan ekspertiz raporu gereklidir.</p></div>';

  var CFG = {
    code: "KULLANIM", label: "Kullanım Koşulları",
    title: "Kullanım Koşulları",
    intro: "İşbu Kullanım Koşulları, <strong style=\"color:" + C.textPri + "\">" + FIRMA + "</strong> (“NADAS”) tarafından işletilen internet sitesi ve hizmetlerinin kullanımına ilişkin esasları düzenler. Siteyi ziyaret ederek veya hizmetleri kullanarak bu koşulları kabul etmiş sayılırsınız.",
    secs: [
      { h: "Koşulların Kabulü", ps: ["Bu siteye erişerek ve/veya hizmetleri kullanarak işbu Kullanım Koşulları’nı, <a href=\"gizlilik.html\" style=\"color:" + C.primary + ";text-decoration:none\">Gizlilik Politikası</a>’nı ve <a href=\"cerez.html\" style=\"color:" + C.primary + ";text-decoration:none\">Çerez Politikası</a>’nı okuyup kabul ettiğinizi beyan edersiniz. Koşulları kabul etmiyorsanız lütfen siteyi kullanmayınız."] },
      { h: "Hizmetin Tanımı", ps: ["NADAS, Türkiye gayrimenkul piyasasına ilişkin veri altyapısı, endeks ve analiz hizmetleri sunar. Sitedeki içerik ve veriler bilgilendirme amaçlıdır. Bireysel ekspertiz ve karar analizi hizmetleri emlakekspertizi.com platformu üzerinden sağlanır."] },
      { h: "Sorumluluk Reddi (Veri Niteliği)", ps: ["Sunulan verilerin niteliğine ilişkin aşağıdaki husus özellikle önem taşır:"], after: DISCLAIMER },
      { h: "Kullanım Kuralları", ps: ["Siteyi kullanırken aşağıdaki kurallara uymayı kabul edersiniz:"], list: ["Siteyi yalnızca hukuka uygun amaçlarla kullanmak", "İçeriği izinsiz kopyalamamak, çoğaltmamak veya ticari amaçla yeniden yayımlamamak", "Otomatik veri çekme (scraping), tersine mühendislik veya sistemlere yetkisiz erişim girişiminde bulunmamak", "Site güvenliğini veya işleyişini bozacak eylemlerden kaçınmak", "Üçüncü kişilerin haklarını ihlal etmemek"] },
      { h: "Fikri Mülkiyet Hakları", ps: ["Sitedeki tüm içerik, veri tabanları, endeksler, tasarım, metin, grafik, logo ve yazılım dahil olmak üzere fikri mülkiyet hakları <strong style=\"color:" + C.textPri + "\">NADAS’a</strong> aittir ve ilgili mevzuatla korunmaktadır. NADAS’ın yazılı izni olmaksızın bu içerikler kopyalanamaz, dağıtılamaz veya türev çalışmalar oluşturmakta kullanılamaz."] },
      { h: "Sorumluluğun Sınırlandırılması", ps: ["Site ve içerik “olduğu gibi” sunulmaktadır. NADAS, verilerin kesintisiz, hatasız veya belirli bir amaca uygun olacağını taahhüt etmez. Yürürlükteki mevzuatın izin verdiği azami ölçüde, sitenin veya verilerin kullanımından doğabilecek doğrudan veya dolaylı zararlardan NADAS sorumlu tutulamaz."] },
      { h: "Üçüncü Taraf Bağlantılar", ps: ["Site, üçüncü taraf internet sitelerine (ör. emlakekspertizi.com) bağlantılar içerebilir. Bu sitelerin içerik ve uygulamalarından NADAS sorumlu değildir."] },
      { h: "Değişiklikler", ps: ["NADAS, işbu Kullanım Koşulları’nı önceden bildirimde bulunmaksızın güncelleyebilir. Güncel metin bu sayfada yayımlandığı anda yürürlüğe girer. Son güncelleme: <strong style=\"color:" + C.textPri + "\">" + UPDATED + "</strong>."] },
      { h: "Uygulanacak Hukuk ve Yetkili Mahkeme", ps: ["İşbu Kullanım Koşulları Türkiye Cumhuriyeti hukukuna tabidir. Doğabilecek uyuşmazlıkların çözümünde İstanbul (Merkez) Mahkemeleri ve İcra Daireleri yetkilidir."] },
    ],
  };

  function Hero() {
    return '<section style="' + css({ padding: "22px 16px 26px", borderBottom: "1px solid " + C.borderStrong, position: "relative", overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 85% 20%, rgba(56,189,248,0.1), transparent 55%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 980, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700, marginBottom: 12 }) + '"><span style="' + css({ width: 14, height: 1, background: C.primary }) + '"></span>◆ ' + CFG.code + ' · YASAL METİN · NADAS</div>'
      + '<h1 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(1.7rem,4.4vw,2.6rem)", fontWeight: 700, lineHeight: 1.1, letterSpacing: "-0.02em", margin: 0, color: C.textPri, maxWidth: 860 }) + '">' + CFG.title + '</h1>'
      + '<div style="' + css({ marginTop: 12, display: "flex", gap: 14, flexWrap: "wrap", fontFamily: C.mono, fontSize: 10.5, color: C.textFaint, letterSpacing: "0.08em" }) + '"><span>SON GÜNCELLEME: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span><span>·</span><span>YÜRÜRLÜK: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span></div>'
      + '<div style="' + css({ marginTop: 16 }) + '">' + P(CFG.intro) + '</div>'
      + '</div></section>';
  }
  function CompanyBox() {
    var others = [["KVKK Aydınlatma Metni", "kvkk.html"], ["Gizlilik Politikası", "gizlilik.html"], ["Çerez Politikası", "cerez.html"], ["Kullanım Koşulları", "kullanim-kosullari.html"]]
      .filter(function (x) { return x[1] !== "kullanim-kosullari.html"; })
      .map(function (x) { return '<a href="' + x[1] + '" style="' + css({ fontFamily: C.mono, fontSize: 11.5, color: C.primary, textDecoration: "none", letterSpacing: "0.04em", padding: "3px 0", display: "inline-block" }) + '">→ ' + x[0] + '</a>'; }).join("");
    return '<div style="' + css({ marginTop: 26, display: "grid", gridTemplateColumns: "minmax(0,1.4fr) minmax(0,1fr)", gap: 16 }) + '" class="nadas-twocol">'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◆ HİZMET SAĞLAYICI</div><div style="' + css({ fontSize: 13, color: C.textPri, fontWeight: 600, lineHeight: 1.5, marginBottom: 8 }) + '">' + FIRMA + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.7, letterSpacing: "0.02em" }) + '">MERSİS: 0627045662400013<br>Hastane Mah. Hadımköy İstanbul Cad. No: 46/B<br>Arnavutköy / İstanbul<br><a href="mailto:destek@nadas.com.tr" style="' + css({ color: C.primary, textDecoration: "none" }) + '">destek@nadas.com.tr</a></div></div>'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◈ İLGİLİ YASAL METİNLER</div><div style="' + css({ display: "flex", flexDirection: "column", gap: 4 }) + '">' + others + '</div></div>'
      + '</div>';
  }
  function Body() {
    var secs = CFG.secs.map(function (s, i) {
      return '<div style="' + css({ borderTop: i ? "1px solid " + C.border : "none", padding: "22px 0" }) + '">'
        + '<h2 style="' + css({ display: "flex", alignItems: "baseline", gap: 10, fontFamily: "'Sora',sans-serif", fontSize: "clamp(1.1rem,2.3vw,1.35rem)", fontWeight: 600, letterSpacing: "-0.01em", color: C.textPri, margin: "0 0 12px" }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 12, color: C.primary, fontWeight: 700 }) + '">' + (i + 1 < 10 ? "0" : "") + (i + 1) + '</span>' + s.h + '</h2>'
        + (s.ps ? s.ps.map(P).join("") : "")
        + (s.list ? UL(s.list) : "")
        + (s.after || "")
        + '</div>';
    }).join("");
    return '<section style="' + css({ padding: "8px 16px 30px" }) + '"><div style="' + css({ maxWidth: 980, margin: "0 auto" }) + '">' + secs + CompanyBox() + '</div></section>';
  }

  function renderApp() { return NX.Ticker(TICK) + NX.Masthead(CFG.label) + NX.Nav("") + Hero() + Body() + NX.Footer(); }
  NX.boot(renderApp);
})();
</script>
</body>
</html>
