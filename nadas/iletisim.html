      { q: "Bir e-postada birden fazla konuyu birleştirmek mümkün mü?", a: "Mümkündür ancak önerilmez. Her konu farklı bir sorumlu birime yönlendirildiği için, tek e-postada birleştirilen talepler süreç hızını yavaşlatabilir. Önerimiz: Her konu için ayrı e-posta. Birden fazla konu varsa, destek@nadas.com.tr genel adresinden ana koordinasyon yapılabilir." },
      { q: "Basın ve medya talepleri için süreç nasıldır?", a: "Röportaj, alıntı, etkinlik daveti veya araştırma kullanım izni gibi basın talepleri için destek@nadas.com.tr adresine yazılı talep iletilmelidir. Konu kapsamı, yayın platformu, son tarih ve ilgili bilgiler ilk e-postada belirtilirse süreç hızlanır. Etkinlik talepleri için en az 2 hafta önceden iletilmesi rica olunur." },
      { q: "Ziyaret randevusu nasıl alınır?", a: "AR-GE ofisine ziyaret yalnızca önceden randevulu olarak kabul edilir. Randevu talebi destek@nadas.com.tr adresine, görüşmenin amacı, katılacak kişi(ler) ve önerilen tarih aralığı belirtilerek iletilebilir. AR-GE ofisi kapalı çalışma alanıdır; onay sonrası takvim daveti gönderilir." },
      { q: "İK ve kariyer başvuruları nereye iletilir?", a: "İK ve kariyer başvuruları için destek@nadas.com.tr adresine konu satırında \"İK Başvuru\" ifadesi ile yazılı talep iletilebilir. Aktif pozisyonlar şirket içinde paylaşılır; spontane başvurular CV ile birlikte kaydedilir ve uygun pozisyon açıldığında geri dönüş yapılır." },
      { q: "KVKK kapsamında verilerim nasıl korunur?", a: "Form üzerinden iletilen tüm kişisel veriler 6698 sayılı Kişisel Verilerin Korunması Kanunu kapsamında işlenir. Veriler yalnızca talebinizin yanıtlanması amacıyla kullanılır, üçüncü taraflarla paylaşılmaz, talebiniz tamamlandıktan sonra mevzuat süreleri çerçevesinde silinir. Detaylı bilgi için KVKK Aydınlatma Metni’ni inceleyebilirsiniz." },
    ];
    var items = faqs.map(function (f, idx) {
      var open = idx === 0;
      var n = "S" + (idx + 1 < 10 ? "0" : "") + (idx + 1);
      return '<div data-faq-item="' + idx + '" style="' + css({ background: open ? C.elev : C.raised, border: "1px solid " + (open ? C.primary : C.borderStrong), overflow: "hidden" }) + '">'
        + '<button type="button" data-faq-btn="' + idx + '" style="' + css({ width: "100%", padding: "16px 20px", background: "transparent", border: "none", textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, fontFamily: "inherit" }) + '">'
        + '<span style="' + css({ display: "flex", alignItems: "center", gap: 12 }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.1em" }) + '">' + n + '</span><span data-faq-q style="' + css({ fontFamily: "'Sora',sans-serif", fontSize: 14.5, color: open ? C.primary : C.textPri, fontWeight: 600, letterSpacing: "-0.005em", lineHeight: 1.4 }) + '">' + f.q + '</span></span>'
        + '<span data-faq-plus style="' + css({ color: open ? C.primary : C.textMut, fontFamily: C.mono, fontSize: 16, fontWeight: 400, transform: open ? "rotate(45deg)" : "rotate(0)", transition: "transform 0.2s", minWidth: 16 }) + '">+</span></button>'
        + '<div data-faq-panel style="' + css({ padding: "0 20px 18px 20px", borderTop: "1px solid " + C.border, paddingTop: 14, display: open ? "block" : "none" }) + '"><p style="' + css({ fontSize: 13, color: C.textSec, lineHeight: 1.7, margin: 0 }) + '">' + f.a + '</p></div></div>';
    }).join("");
    var body = '<div style="' + css({ display: "flex", flexDirection: "column", gap: 6 }) + '">' + items + '</div>'
      + '<div style="' + css({ marginTop: 22, padding: "14px 18px", border: "1px dashed " + C.border, background: "rgba(56,189,248,0.03)", fontFamily: C.mono, fontSize: 11, color: C.textMut, letterSpacing: "0.02em", lineHeight: 1.6 }) + '">⌬ Sorunuz cevap bulamadıysa <a href="mailto:destek@nadas.com.tr" style="' + css({ color: C.primary, fontWeight: 700, textDecoration: "none" }) + '">destek@nadas.com.tr →</a> adresine yazabilirsiniz.</div>';
    return SubSection("F.1", "Sık sorulan sorular", "İLETİŞİM SÜRECİ · YANIT SÜRELERİ · GİZLİLİK", body);
  }

  /* ===== EMLAKEKSPERTIZI ÜRÜN ===== */
  function EmlakEkspertiziProduct() {
    return '<section style="' + css({ background: "linear-gradient(135deg, " + C.deep + " 0%, " + C.raised + " 100%)", borderTop: "2px solid " + C.primary, borderBottom: "1px solid " + C.borderStrong, padding: "44px 16px 36px", position: "relative", overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 80% 20%, rgba(56,189,248,0.12), transparent 60%), radial-gradient(circle at 10% 80%, rgba(167,139,250,0.08), transparent 50%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 1280, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "center", gap: 10, marginBottom: 18, fontFamily: C.mono, fontSize: 11, letterSpacing: "0.14em" }) + '"><span style="' + css({ color: C.primary, fontWeight: 700 }) + '">◆ BİREYSEL MÜŞTERİ PLATFORMU</span><span style="' + css({ height: 1, flex: 1, background: C.primary, opacity: 0.4 }) + '"></span><span style="' + css({ color: C.textMut }) + '">NADAS ALTYAPISI ÜZERİNDE</span></div>'
      + '<div style="' + css({ marginBottom: 16 }) + '"><img src="img/emlak-logo-full.png" alt="emlakekspertizi.com" style="' + css({ display: "block", width: 320, maxWidth: "100%", height: "auto" }) + '"><h2 style="' + css({ position: "absolute", width: 1, height: 1, overflow: "hidden", clip: "rect(0 0 0 0)", whiteSpace: "nowrap", margin: -1, padding: 0, border: 0 }) + '">emlakekspertizi.com</h2></div>'
      + '<p style="' + css({ marginTop: 8, fontSize: 15, lineHeight: 1.6, color: C.textSec, maxWidth: 960 }) + '">Bireysel sipariş, üyelik veya ProX asistana doğrudan erişim için kurumsal iletişim formu yerine <strong style="' + css({ color: C.textPri }) + '">emlakekspertizi.com</strong> platformuna gidin. Karar analizi, SPK lisanslı resmi ekspertiz, üyelik paketleri ve akıllı emlak asistanı — hepsi tek tıkla.</p>'
      + '<div style="' + css({ marginTop: 22, display: "flex", gap: 12, flexWrap: "wrap" }) + '"><a href="https://www.emlakekspertizi.com" style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 22px", background: C.primary, color: C.deep, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.1em", textDecoration: "none", borderRadius: 2 }) + '">EMLAKEKSPERTIZI.COM →</a><a href="https://www.emlakekspertizi.com/yapay-zeka" style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 22px", background: "transparent", color: C.violet, border: "1px solid " + C.violet, fontFamily: C.mono, fontSize: 12, fontWeight: 700, letterSpacing: "0.1em", textDecoration: "none", borderRadius: 2 }) + '">ProX AKILLI ASİSTANI DENE →</a></div>'
      + '</div></section>';
  }

  /* ===== MONTAJ ===== */
  function renderApp() {
    return NX.Ticker(ILTICK) + NX.Masthead("İletişim") + NX.Nav("İletişim")
      + HeroIletisim()
      + SectionDivider("A", "İletişim Kanalları", "3 YAZILI KANAL · 24 SAAT YANIT") + IletisimKanallari()
      + SectionDivider("B", "Yanıt Süreci", "NE BEKLEYEBİLİRSİNİZ · OTOMATİK ONAY · 24 SAAT · KAYIT") + IletisimFormu()
      + SectionDivider("C", "AR-GE Ofis", "ARNAVUTKÖY · İSTANBUL · R&D") + MerkezOfis()
      + SectionDivider("D", "Kurumsal Talep Tipleri", "DEMO · TEKLİF · WHITE-LABEL · VERİ · BASIN") + KurumsalTalepler()
      + SectionDivider("E", "Resmi Bilgiler", "TÜZEL · KAYIT · YETKİ BELGESİ") + ResmiBilgiler()
      + SectionDivider("F", "Sık Sorulan Sorular", "İLETİŞİM SÜRECİ · YANIT · GİZLİLİK") + SikSorulanlar()
      + EmlakEkspertiziProduct() + NX.Footer();
  }

  NX.boot(renderApp);

  /* ===== TEKLİF AL · #teklif hash → forma kaydır + odakla ===== */
  (function () {
    function goTeklif() {
      if (location.hash !== "#teklif") return;
      var el = document.getElementById("teklif");
      if (!el) return;
      try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { el.scrollIntoView(); }
      var nm = document.getElementById("il-name");
      if (nm) setTimeout(function () { try { nm.focus({ preventScroll: true }); } catch (e) { nm.focus(); } }, 420);
    }
    goTeklif();
    window.addEventListener("hashchange", goTeklif);
  })();

  /* ===== FAQ AKORDEON ===== */
  (function () {
    var items = document.querySelectorAll("[data-faq-item]");
    function apply(openIdx) {
      for (var i = 0; i < items.length; i++) {
        var it = items[i], on = (i === openIdx);
        it.style.background = on ? C.elev : C.raised;
        it.style.border = "1px solid " + (on ? C.primary : C.borderStrong);
        var q = it.querySelector("[data-faq-q]"), plus = it.querySelector("[data-faq-plus]"), panel = it.querySelector("[data-faq-panel]");
        if (q) q.style.color = on ? C.primary : C.textPri;
        if (plus) { plus.style.color = on ? C.primary : C.textMut; plus.style.transform = on ? "rotate(45deg)" : "rotate(0)"; }
        if (panel) panel.style.display = on ? "block" : "none";
      }
    }
    var current = 0;
    for (var i = 0; i < items.length; i++) {
      items[i].querySelector("[data-faq-btn]").addEventListener("click", function () {
        var idx = parseInt(this.getAttribute("data-faq-btn"), 10);
        current = (current === idx) ? -1 : idx;
        apply(current);
      });
    }
  })();

  /* ===== FORM GÖNDER ===== */
  (function () {
    var btn = document.getElementById("il-send");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var name = (document.getElementById("il-name") || {}).value || "";
      var email = (document.getElementById("il-email") || {}).value || "";
      var subject = (document.getElementById("il-subject") || {}).value || "";
      var msg = (document.getElementById("il-msg") || {}).value || "";
      var kvkk = (document.getElementById("il-kvkk") || {}).checked;
      var status = document.getElementById("il-status");
      var reMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      function err(t) { if (status) { status.style.color = C.danger; status.textContent = "⚠ " + t; } }
      if (!name.trim()) return err("Lütfen ad soyad girin.");
      if (!reMail.test(email.trim())) return err("Lütfen geçerli bir e-posta girin.");
      if (!subject || subject === "Seçiniz...") return err("Lütfen bir konu kapsamı seçin.");
      if (!msg.trim() || msg.trim().length < 10) return err("Lütfen talebinizi (en az 10 karakter) yazın.");
      if (!kvkk) return err("Devam etmek için KVKK onayı gereklidir.");
      btn.disabled = true;
      btn.style.opacity = "0.6";
      btn.style.cursor = "default";
      btn.textContent = "✓ TALEBİNİZ ALINDI";
      btn.style.background = C.accent;
      if (status) { status.style.color = C.accent; status.textContent = "✓ Talebiniz alındı. İş günü içinde 24 saat içinde " + subject + " kapsamında yanıt verilecektir. Onay e-postası kısa süre içinde ulaşacaktır."; }
    });
  })();
})();
</script>
</body>
</html>
