<body>
<div id="app"><noscript><div style="max-width:900px;margin:0 auto;padding:48px 20px;font-family:'Sora',sans-serif"><h1 style="color:#38BDF8">KVKK Aydınlatma Metni — NADAS</h1><p style="color:#CBD5E1">6698 sayılı Kişisel Verilerin Korunması Kanunu kapsamında hazırlanmıştır. Görüntülemek için JavaScript gereklidir.</p></div></noscript></div>
<script src="js/core.js?v=24"></script>
<script>
(function () {
  "use strict";
  var C = NX.C, css = NX.css;
  NX.setAccent(C.primary);

  var TICK = [["YASAL METİN", "KVKK AYDINLATMA"], ["KANUN", "6698 SAYILI KVKK"], ["VERİ SORUMLUSU", "NADAS"], ["BAŞVURU", "destek@nadas.com.tr"], ["İLGİLİ KİŞİ HAKLARI", "MADDE 11"], ["SON GÜNCELLEME", "18.07.2026"], ["KVKK UYUMLU", "ANONİMİZE · AGREGAT"], ["SINCE 2005", "21 YIL"]];

  var FIRMA = "Nadas Gayrimenkul Bilgi İletişim Sistemleri Ticaret Limited Şirketi";
  var UPDATED = "18 Temmuz 2026";

  function P(t) { return '<p style="' + css({ fontSize: 14, lineHeight: 1.75, color: C.textSec, margin: "0 0 12px" }) + '">' + t + '</p>'; }
  function UL(items) { return '<ul style="' + css({ margin: "2px 0 12px", padding: 0, listStyle: "none", display: "flex", flexDirection: "column", gap: 8 }) + '">' + items.map(function (it) { return '<li style="' + css({ fontSize: 13.5, lineHeight: 1.6, color: C.textSec, display: "flex", gap: 10 }) + '"><span style="' + css({ color: C.primary, fontFamily: C.mono, fontSize: 11, marginTop: 3, flexShrink: 0 }) + '">→</span><span>' + it + '</span></li>'; }).join("") + '</ul>'; }

  var CFG = {
    code: "KVKK", label: "KVKK",
    title: "Kişisel Verilerin Korunması ve İşlenmesine İlişkin Aydınlatma Metni",
    intro: "İşbu aydınlatma metni, <strong style=\"color:" + C.textPri + "\">" + FIRMA + "</strong> (“NADAS” veya “Şirket”) tarafından, 6698 sayılı Kişisel Verilerin Korunması Kanunu (“Kanun”/“KVKK”) ve ilgili mevzuat uyarınca, veri sorumlusu sıfatıyla kişisel verilerinizin işlenmesine ilişkin olarak sizi bilgilendirmek amacıyla hazırlanmıştır. NADAS, kişisel verilerin hukuka uygun, şeffaf ve amaçla sınırlı biçimde işlenmesini bir kurumsal ilke olarak benimser.",
    secs: [
      { h: "Veri Sorumlusunun Kimliği", ps: ["Kişisel verileriniz, veri sorumlusu sıfatıyla <strong style=\"color:" + C.textPri + "\">" + FIRMA + "</strong> tarafından, aşağıda belirtilen amaç ve hukuki sebeplere dayanılarak işlenmektedir."], list: ["Ticaret Ünvanı: " + FIRMA, "MERSİS No: 0627045662400013", "Ticaret Sicil No: 980139-0 (İstanbul Ticaret Sicili Müdürlüğü)", "Vergi Kimlik No: 6270456624 (Büyükçekmece Vergi Dairesi)", "Adres: Hastane Mah. Hadımköy İstanbul Cad. No: 46/B, Arnavutköy / İstanbul", "E-posta: destek@nadas.com.tr"] },
      { h: "İşlenen Kişisel Veri Kategorileri", ps: ["NADAS ile kurduğunuz ilişkinin niteliğine göre aşağıdaki kategorilerde kişisel verileriniz işlenebilir:"], list: ["<strong>Kimlik verisi:</strong> ad, soyad, unvan", "<strong>İletişim verisi:</strong> e-posta adresi, telefon numarası, adres", "<strong>Müşteri/talep verisi:</strong> talep konusu, mesaj içeriği, tercih ettiğiniz iletişim kanalı", "<strong>İşlem güvenliği verisi:</strong> IP adresi, tarayıcı ve cihaz bilgisi, çerez kayıtları (bkz. <a href=\"cerez.html\" style=\"color:" + C.primary + ";text-decoration:none\">Çerez Politikası</a>)"], after: '<div style="' + css({ marginTop: 8, padding: "10px 14px", border: "1px dashed " + C.border, background: "rgba(56,189,248,0.03)", fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.6, letterSpacing: "0.02em" }) + '">⌬ NADAS’ın gayrimenkul veri ürünleri <strong style="color:' + C.textPri + '">mahalle/agregat düzeyde ve anonimize</strong> işlenir; bu veriler belirli bir gerçek kişiyle ilişkilendirilebilir nitelikte kişisel veri içermez.</div>' },
      { h: "Kişisel Verilerin İşlenme Amaçları", ps: ["Kişisel verileriniz aşağıdaki amaçlarla, ilgili mevzuata ve dürüstlük kuralına uygun olarak işlenir:"], list: ["Yazılı taleplerinizin ve başvurularınızın alınması, değerlendirilmesi ve yanıtlanması", "Sunulan hizmetlerin yürütülmesi, iyileştirilmesi ve kalite denetiminin sağlanması", "Kurumsal iş birliği, teklif, demo ve sözleşme süreçlerinin yönetilmesi", "Bilgi güvenliğinin sağlanması ve yetkisiz erişimlerin önlenmesi", "Hukuki yükümlülüklerin yerine getirilmesi ve yetkili kurumlara bilgi verilmesi"] },
      { h: "Kişisel Verilerin İşlenmesinin Hukuki Sebepleri", ps: ["Kişisel verileriniz KVKK’nın 5. ve 6. maddelerinde öngörülen aşağıdaki hukuki sebeplere dayanılarak işlenir:"], list: ["Bir sözleşmenin kurulması veya ifasıyla doğrudan doğruya ilgili olması", "Veri sorumlusunun hukuki yükümlülüğünü yerine getirebilmesi için zorunlu olması", "İlgili kişinin temel hak ve özgürlüklerine zarar vermemek kaydıyla, veri sorumlusunun meşru menfaatleri için veri işlenmesinin zorunlu olması", "Gerekli hallerde açık rızanızın bulunması"] },
      { h: "Kişisel Verilerin Aktarılması", ps: ["Kişisel verileriniz, yalnızca yukarıda belirtilen amaçların gerçekleştirilmesiyle sınırlı olarak ve KVKK’nın 8. ve 9. maddelerine uygun biçimde aktarılabilir:"], list: ["Yasal yükümlülükler kapsamında yetkili kamu kurum ve kuruluşlarına", "Hizmetin ifası için birlikte çalışılan tedarikçi ve iş ortaklarına (ör. barındırma/altyapı sağlayıcıları), gerekli sözleşmesel ve teknik güvenlik önlemleri alınarak", "emlakekspertizi.com müşteri platformu süreçlerinin yürütülmesi için ilgili birimlere"], after: P("Kişisel verileriniz, açık rızanız olmaksızın üçüncü kişilere pazarlama amacıyla satılmaz veya devredilmez.") },
      { h: "Yurt Dışına Aktarım (KVKK Madde 9)", ps: ["Kişisel verileriniz kural olarak Türkiye’de barındırılır. Bununla birlikte bazı süreçlerde — özellikle yurt dışı merkezli bulut altyapıları ya da yapay zeka dil modeli hizmetlerinin (örneğin Claude, ChatGPT, Gemini gibi API tabanlı modellerin) kullanıldığı hâllerde — kişisel veriler yurt dışına aktarılabilir. Böyle bir aktarım, KVKK’nın 9. maddesi ve 10.07.2024 tarihli Yönetmelik çerçevesinde; yeterlilik kararı, uygun güvenceler (standart sözleşme, taahhütname veya bağlayıcı şirket kuralları) ya da istisnai hâllerde açık rızanız esas alınarak gerçekleştirilir."], list: ["Tam bağımsızlık isteyen kurumsal yapay zeka çözümlerinde açık kaynak model kendi sunucunuzda (on-premise) çalıştırılır ve veri yurt dışına çıkarılmaz.", "API tabanlı yabancı bir model kullanıldığında bu bir yurt dışına aktarımdır ve uygun güvence/açık rıza çerçevesinde yürütülür.", "Aktarım yapılan hizmet sağlayıcılarla veri işleme ve gizlilik sözleşmeleri imzalanır; işleme kapsamı sözleşmeyle sınırlanır."], after: P("Yapay zeka hizmetlerimizdeki katman ayrımı ve barındırma seçenekleri (Egemen/on-premise ↔ yönetilen/API) için <a href=\"yapay-zeka.html\" style=\"color:" + C.primary + ";text-decoration:none\">Yapay Zeka</a> sayfamıza bakabilirsiniz.") },
      { h: "Veri Sorumluları Sicili (VERBİS)", ps: ["NADAS; yıllık çalışan sayısı (50’den az) ve mali büyüklük bakımından Kişisel Verileri Koruma Kurulu’nca belirlenen eşiklerin altında kaldığından ve ana faaliyeti özel nitelikli kişisel veri işleme olmadığından, Veri Sorumluları Siciline (VERBİS) <strong style=\"color:" + C.textPri + "\">kayıt yükümlülüğü kapsamında bulunmamaktadır</strong>. İleride bu koşullar değişir ve kayıt yükümlülüğü doğarsa, kayıt bilgileri bu metinde ve <a href=\"kunye.html\" style=\"color:" + C.primary + ";text-decoration:none\">Künye</a> sayfamızda belirtilir."] },
      { h: "Kişisel Verilerin Toplanma Yöntemi", ps: ["Kişisel verileriniz; internet sitesindeki iletişim ve talep formları, e-posta yazışmaları, çerezler ve benzeri otomatik ya da otomatik olmayan yöntemlerle, yazılı iletişim kanalları aracılığıyla toplanır."] },
      { h: "İlgili Kişi Olarak Haklarınız (KVKK Madde 11)", ps: ["KVKK’nın 11. maddesi uyarınca veri sorumlusuna başvurarak aşağıdaki haklara sahipsiniz:"], list: ["Kişisel verilerinizin işlenip işlenmediğini öğrenme", "İşlenmişse buna ilişkin bilgi talep etme", "İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme", "Yurt içinde/yurt dışında aktarıldığı üçüncü kişileri bilme", "Eksik veya yanlış işlenmişse düzeltilmesini isteme", "Kanunda öngörülen şartlarla silinmesini veya yok edilmesini isteme", "Düzeltme/silme işlemlerinin aktarıldığı üçüncü kişilere bildirilmesini isteme", "Münhasıran otomatik sistemlerle analiz sonucu aleyhinize bir sonucun ortaya çıkmasına itiraz etme", "Kanuna aykırı işleme sebebiyle zarara uğramanız halinde zararın giderilmesini talep etme"] },
      { h: "Başvuru Yöntemi", ps: ["Yukarıdaki haklarınıza ilişkin taleplerinizi, kimliğinizi tevsik edici bilgilerle birlikte <strong style=\"color:" + C.textPri + "\">destek@nadas.com.tr</strong> adresine yazılı olarak iletebilirsiniz. Başvurularınız, talebin niteliğine göre en geç <strong style=\"color:" + C.textPri + "\">30 gün</strong> içinde ücretsiz olarak sonuçlandırılır; işlemin ayrıca bir maliyet gerektirmesi halinde Kurul tarafından belirlenen tarifedeki ücret talep edilebilir.", "Başvurunuzu kolaylaştırmak için hazır <a href=\"kvkk-basvuru.html\" style=\"color:" + C.primary + ";text-decoration:none\">İlgili Kişi Başvuru Formu</a>’nu da kullanabilirsiniz; yazılı, KEP ve kayıtlı e-posta kanalları da geçerlidir."] },
      { h: "Değişiklikler", ps: ["NADAS, işbu aydınlatma metnini mevzuat değişiklikleri ve kurumsal ihtiyaçlar doğrultusunda güncelleyebilir. Güncel metin her zaman bu sayfada yayımlanır. Son güncelleme tarihi: <strong style=\"color:" + C.textPri + "\">" + UPDATED + "</strong>."] },
    ],
  };

  function Hero() {
    return '<section style="' + css({ padding: "22px 16px 26px", borderBottom: "1px solid " + C.borderStrong, position: "relative", overflow: "hidden" }) + '">'
      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 85% 20%, rgba(56,189,248,0.1), transparent 55%)" }) + '"></div>'
      + '<div style="' + css({ position: "relative", maxWidth: 980, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: C.mono, fontSize: 10.5, color: C.primary, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700, marginBottom: 12 }) + '"><span style="' + css({ width: 14, height: 1, background: C.primary }) + '"></span>◆ ' + CFG.code + ' · YASAL METİN · NADAS</div>'
      + '<h1 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(1.7rem,4.4vw,2.6rem)", fontWeight: 700, lineHeight: 1.1, letterSpacing: "-0.02em", margin: 0, color: C.textPri, maxWidth: 860 }) + '">' + CFG.title + '</h1>'
      + '<div style="' + css({ marginTop: 12, display: "flex", gap: 14, flexWrap: "wrap", fontFamily: C.mono, fontSize: 10.5, color: C.textFaint, letterSpacing: "0.08em" }) + '"><span>SON GÜNCELLEME: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span><span>·</span><span>YÜRÜRLÜK: ' + UPDATED.toLocaleUpperCase("tr-TR") + '</span></div>'
      + '<div style="' + css({ marginTop: 16 }) + '">' + P(CFG.intro) + '</div>'
      + '</div></section>';
  }
  function CompanyBox() {
    var others = [["KVKK Aydınlatma Metni", "kvkk.html"], ["Gizlilik Politikası", "gizlilik.html"], ["Çerez Politikası", "cerez.html"], ["Kullanım Koşulları", "kullanim-kosullari.html"]]
      .filter(function (x) { return x[1] !== "kvkk.html"; })
      .map(function (x) { return '<a href="' + x[1] + '" style="' + css({ fontFamily: C.mono, fontSize: 11.5, color: C.primary, textDecoration: "none", letterSpacing: "0.04em", padding: "3px 0", display: "inline-block" }) + '">→ ' + x[0] + '</a>'; }).join("");
    return '<div style="' + css({ marginTop: 26, display: "grid", gridTemplateColumns: "minmax(0,1.4fr) minmax(0,1fr)", gap: 16 }) + '" class="nadas-twocol">'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◆ VERİ SORUMLUSU</div><div style="' + css({ fontSize: 13, color: C.textPri, fontWeight: 600, lineHeight: 1.5, marginBottom: 8 }) + '">' + FIRMA + '</div><div style="' + css({ fontFamily: C.mono, fontSize: 11, color: C.textMut, lineHeight: 1.7, letterSpacing: "0.02em" }) + '">MERSİS: 0627045662400013<br>Hastane Mah. Hadımköy İstanbul Cad. No: 46/B<br>Arnavutköy / İstanbul<br><a href="mailto:destek@nadas.com.tr" style="' + css({ color: C.primary, textDecoration: "none" }) + '">destek@nadas.com.tr</a></div></div>'
      + '<div style="' + css({ border: "1px solid " + C.borderStrong, background: C.raised, padding: "18px 20px" }) + '"><div style="' + css({ fontFamily: C.mono, fontSize: 10, color: C.primary, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 10 }) + '">◈ İLGİLİ YASAL METİNLER</div><div style="' + css({ display: "flex", flexDirection: "column", gap: 4 }) + '">' + others + '</div></div>'
      + '</div>';
  }
  function Body() {
    var secs = CFG.secs.map(function (s, i) {
      return '<div style="' + css({ borderTop: i ? "1px solid " + C.border : "none", padding: "22px 0" }) + '">'
        + '<h2 style="' + css({ display: "flex", alignItems: "baseline", gap: 10, fontFamily: "'Sora',sans-serif", fontSize: "clamp(1.1rem,2.3vw,1.35rem)", fontWeight: 600, letterSpacing: "-0.01em", color: C.textPri, margin: "0 0 12px" }) + '"><span style="' + css({ fontFamily: C.mono, fontSize: 12, color: C.primary, fontWeight: 700 }) + '">' + (i + 1 < 10 ? "0" : "") + (i + 1) + '</span>' + s.h + '</h2>'
        + (s.ps ? s.ps.map(P).join("") : "")
        + (s.list ? UL(s.list) : "")
        + (s.after || "")
        + '</div>';
    }).join("");
    return '<section style="' + css({ padding: "8px 16px 30px" }) + '"><div style="' + css({ maxWidth: 980, margin: "0 auto" }) + '">' + secs + CompanyBox() + '</div></section>';
  }

  function renderApp() {
    return NX.Ticker(TICK) + NX.Masthead(CFG.label) + NX.Nav("") + Hero() + Body() + NX.Footer();
  }
  NX.boot(renderApp);
})();
</script>
</body>
</html>
