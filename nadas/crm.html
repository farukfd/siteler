(function () {

  }
  function SubSection(num, title, eyebrow, children) {
    return '<section style="' + css({ borderBottom: "1px solid " + C.borderStrong, padding: "20px 16px" }) + '">'
      + '<div style="' + css({ maxWidth: 1280, margin: "0 auto" }) + '">'
      + '<div style="' + css({ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12, flexWrap: "wrap" }) + '">'

      + '<h2 style="' + css({ fontSize: "clamp(1.25rem,2.8vw,1.7rem)", fontWeight: 700, margin: 0, letterSpacing: "-0.02em", color: C.textPri, lineHeight: 1.15 }) + '">' + title + '</h2>'

    var body = rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td style="' + css({ padding: "9px 12px", fontFamily: i ? C.mono : "'Inter Tight',sans-serif", fontSize: i ? 11.5 : 12, color: i === 0 ? C.textPri : C.textSec, fontWeight: i === 0 ? 600 : 400, borderBottom: "1px solid " + C.border, verticalAlign: "top", lineHeight: 1.45 }) + '">' + c + '</td>'; }).join("") + '</tr>'; }).join("");

  /* ===== HERO ===== */

    }).join("");
    var stage = '<div id="crm-stage" style="' + css({ position: "relative", overflow: "hidden", border: "1px solid " + C.borderStrong, borderRadius: 4, background: "radial-gradient(120% 130% at 50% 30%, #08131a, #030a08 70%)", marginBottom: 18 }) + '">'
      + '<canvas id="crm-canvas" style="' + css({ display: "block", width: "100%", height: "clamp(260px,36vw,380px)" }) + '"></canvas>'

      + '<div style="' + css({ position: "absolute", right: 12, top: 10, display: "inline-flex", alignItems: "center", gap: 6, fontFamily: C.mono, fontSize: 8.5, color: C.accent, letterSpacing: "0.1em", pointerEvents: "none" }) + '"><span style="' + css({ width: 7, height: 7, borderRadius: 9999, background: C.accent, animation: "nadasPulse 1.4s ease-in-out infinite" }) + '"></span>ŞİFRELİ</div>'

      + '<div style="' + css({ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle at 80% 15%, rgba(52,211,153,0.12), transparent 55%), radial-gradient(circle at 8% 85%, rgba(56,189,248,0.08), transparent 50%)" }) + '"></div>'

      + '<h1 style="' + css({ fontFamily: "'Sora',system-ui,sans-serif", fontSize: "clamp(2rem,5.2vw,3.4rem)", fontWeight: 700, lineHeight: 1.05, letterSpacing: "-0.025em", margin: 0, color: C.textPri, maxWidth: 1120 }) + '">Gayrimenkul CRM\'i,<br><span style="' + css({ color: C.accent }) + '">verinizin güvende olduğu yerde.</span></h1>'
      + '<p style="' + css({ marginTop: 18, fontSize: 16, lineHeight: 1.65, color: C.textSec, maxWidth: 960 }) + '">NADAS Yazılım, gayrimenkule özel CRM\'i ' + pri("hazır şablondan değil, iş akışınıza göre sıfırdan kodlar") + '. İki teslim modeli: ister ' + pri("ömür boyu kaynak kodu sizin olan") + ', kendi sunucunuzda çalışan; ister ' + pri("SSL güvenceli, sunucu ve kodun bizde olduğu yönetilen") + '. İkisinin de altında aynı ' + pri("determinist ProX veri motoru") + ' var. Yüklediğiniz müşteri verisi ' + pri("uçtan uca şifrelenir") + '; KVKK kapsamında Türkiye\'de barınır. ' + pri("SPK lisanslı değerleme uzmanlarına ve BDDK kapsamındaki değerleme kuruluşlarına") + ' özel uyum akışıyla, 2026 teknolojileriyle.</p>'

      + '</div></section>';

  /* ===== EDİTORYAL GİRİŞ ===== */
  function IntroEditorial() {

  /* ===== A · İKİ TESLİM MODELİ ===== */
  function TwoModels() {
    var mA = card({ ic: "◇", tag: "MODEL A · TEK SEFERLİK", col: C.primary, ttl: "Ömür Boyu · Kod Sizin", body: "Tam kaynak kodu size teslim edilir; CRM kendi sunucunuzda / kendi bulutunuzda çalışır. Tek seferlik lisans, sınırsız kullanıcı, süre sınırı yok — abonelik yenilemezsiniz. Güncelleme/bakım isteğe bağlı destek anlaşmasıyla; almasanız da elinizdeki sürüm çalışır. Sunucu, SSL, yedek, yama ve KVKK teknik tedbiri sizde.", list: ["Tam kaynak kodu mülkiyeti · süresiz", "Kendi sunucu/bulut · tam veri egemenliği", "Sınırsız kullanıcı · tek seferlik yatırım", "İdeal: kendi BT/DevOps ekibi olan kurumlar"] });
    var mB = card({ ic: "◉", tag: "MODEL B · YÖNETİLEN", col: C.accent, featured: true, ttl: "Yönetilen · SSL Güvenceli", body: "Kod da sunucu da bizde. SSL, uçtan uca şifreleme, izleme, yedekleme, güvenlik yamaları, bakım ve tüm yeni sürümler hizmete dahildir. Aylık ya da yıllık abonelik; kurulumdan sonra tek yaptığınız CRM'i kullanmaktır — sıfır operasyon. Fiyatlara %20 KDV dahildir; yıllık peşinde 12 ay için 10 aylık ücret.", list: ["SSL + şifreleme + bakım + güncelleme dahil", "Sıfır operasyon · biz işletiriz", "Aylık/yıllık · KDV %20 dahil", "İdeal: hemen sahaya çıkmak isteyen ofis/ekipler"] });

       ["Güvenlik sorumluluğu", "Sizde: sunucu·SSL·yama·yedek·KVKK", "NADAS'ta: SSL·şifreleme·izleme·yedek"],

      + '<div style="' + css({ marginTop: 16 }) + '">' + table + '</div>'

  /* ===== B · GÜVENLİK MİMARİSİ ===== */

  /* ===== CRM GÜVENLİK SAHNESİ — müşteri verisi → şifreleme çekirdeği → güvenli kasa ===== */

    var LABELS = [["Ad Soyad", CY], ["Telefon", CY], ["Portföy", VIO], ["Görüşme", WARN], ["E-posta", CY], ["Sözleşme", VIO]];
    var CAPS = ["müşteri verisi TLS 1.3 ile aktarılıyor", "PII alanları AES-256 ile şifreleniyor", "kiracıya özel anahtarla mühürleniyor", "güvenli kasada · Türkiye’de barınıyor", "denetim izine yazılıyor · KVKK"];

    function hexA(h, a) { var n = parseInt(h.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }

    function stepSim(dt) {
      t += dt;
      if (t - capLast > 2.0) { capLast = t; capIdx = (capIdx + 1) % CAPS.length; if (capEl) capEl.textContent = "▸ " + CAPS[capIdx]; }
      emitAcc += dt * 7; while (emitAcc >= 1) { emitAcc -= 1; emit(); }

    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (var k = 0; k < MAX; k++) { var q = pool[k]; if (!q.on) continue; var p, col, rr;
        if (q.ph === 0) { p = bz(Lx + W * 0.07, q.y0, Cx - coreR * 0.7, midY, q.t, (Lx + Cx) / 2); col = q.col; rr = 3.2; ctx.globalAlpha = 0.85; ctx.drawImage(sprite(col), p.x - rr * 2, p.y - rr * 2, rr * 4, rr * 4); ctx.fillStyle = "#EAF6FF"; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, TAU); ctx.fill(); }
        else if (q.ph === 1) { var a = q.t * TAU * 1.5, rad = coreR * (0.9 - q.t * 0.7); p = { x: Cx + Math.cos(a) * rad, y: midY + Math.sin(a) * rad }; ctx.globalAlpha = 0.9; ctx.drawImage(sprite(GRN), p.x - 5, p.y - 5, 10, 10); }
        else { p = bz(Cx + coreR * 0.7, midY, Rx, midY + (q.seed - 0.5) * coreR * 1.6, q.t, (Cx + Rx) / 2); ctx.globalAlpha = 0.8; ctx.drawImage(sprite(GRN), p.x - 3, p.y - 3, 6, 6); ctx.fillStyle = GRN_HI; ctx.globalAlpha = 0.85; ctx.font = "8px " + C.mono; ctx.fillText(HEX[(q.seed * 16) | 0] + HEX[((t * 9 + k) | 0) % 16], p.x + 3, p.y); }
      }
      ctx.restore();
      // merkez: şifreleme çekirdeği (kalkan + kilit + dönen halka)
      ctx.save();
      var cg = ctx.createRadialGradient(Cx, midY, 0, Cx, midY, coreR * 2); cg.addColorStop(0, hexA(GRN, 0.22 + 0.2 * glow)); cg.addColorStop(0.5, hexA(GRN, 0.05)); cg.addColorStop(1, hexA(GRN, 0)); ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(Cx, midY, coreR * 2, 0, TAU); ctx.fill();
