{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"White-label emlak web sitesi nedir?","acceptedAnswer":{"@type":"Answer","text":"Altyapısı ve yazılımı bizim tarafımızdan geliştirilen, ancak tamamen sizin markanız, logonuz ve kendi alan adınız altında yayınlanan kurumsal web platformudur. Ziyaretçi sizin firmanızın sitesini görür; arkadaki motor ve veri katmanı bizden gelir. Türkçesiyle beyaz etiket denir."}},{"@type":"Question","name":"Site gerçekten kendi alan adımda mı çalışır?","acceptedAnswer":{"@type":"Answer","text":"Evet. Kendi alan adınız, kendi SSL sertifikanız ve kendi Google Search Console mülkiyetiniz olur. Alt alan adı veya bizim adresimiz kullanılmaz."}},{"@type":"Question","name":"Kurulum ne kadar sürer?","acceptedAnswer":{"@type":"Answer","text":"Logonuz ve kurumsal renkleriniz elimize ulaştıktan sonra siteniz 24 saat içinde hazır olur. Yayına geçiş, alan adınızın siteye bağlanmasına bağlıdır; bu işlem internet genelinde tamamlanana kadar birkaç saat sürebilir ve süre alan adı operatörünüze göre değişir. O ana kadar siteniz geçici bir önizleme adresinde eksiksiz çalışır."}},{"@type":"Question","name":"Tasarım herkeste aynı mı olacak?","acceptedAnswer":{"@type":"Answer","text":"Hayır. Her kurulumda logonuza göre palet, tipografi ve bileşenler yeniden uyarlanır. Dört demo sürümü birbirinden ne kadar farklıysa, sizinki de o kadar ayrı olur."}},{"@type":"Question","name":"Hangi sektör sürümleri var?","acceptedAnswer":{"@type":"Answer","text":"Dört sürüm hazırdır: emlak ofisi (portföy ve müşteri yönetimi ağırlıklı), kurumsal inşaat (proje ve bölge analizi ağırlıklı), bireysel danışman (kişisel marka ağırlıklı) ve SPK lisanslı değerleme (uyum ve çok dillilik ağırlıklı). Motor dördünde de aynıdır; değişen tema, menü ve içerik kurgusudur."}},{"@type":"Question","name":"Kaç kullanıcı ekleyebilirim?","acceptedAnswer":{"@type":"Answer","text":"ProX Investor üyeliğinde tek kullanıcı, ProX Corporate üyeliğinde 10 kullanıcı ve ekip yönetimi paneli gelir. Kurumsal API anlaşmasında kullanıcı sayısı sözleşmeyle belirlenir."}},{"@type":"Question","name":"Kaç dilde yayın yapabilirim?","acceptedAnswer":{"@type":"Answer","text":"ProX Investor üyeliğinde Türkçe ve İngilizce, ProX Corporate üyeliğinde 5 dil ve sağdan sola yazılan diller için RTL desteği gelir."}},{"@type":"Question","name":"Üyeliğim biterse siteme ne olur?","acceptedAnswer":{"@type":"Answer","text":"Site kapatılmaz. Üyelik sona erdiğinde canlı veri akışı, yönetim paneli ve haber/içerik üretimi durur; ancak siteniz 45 gün boyunca yayında kalmaya devam eder. Bu süre boyunca tüm verilerinizi kendiniz indirebilirsiniz."}},{"@type":"Question","name":"Verilerimi nasıl indiririm, bunun için sizden talepte bulunmam gerekir mi?","acceptedAnswer":{"@type":"Answer","text":"Hayır, talepte bulunmanıza gerek yoktur. Yönetim panelindeki Yedek / Aktar modülünden portföyünüzü, müşteri kayıtlarınızı, içeriklerinizi ve medya dosyalarınızı istediğiniz an kendi bilgisayarınıza indirirsiniz. Bu, üyeliğiniz devam ederken de mümkündür; üyelik bitişini beklemeniz gerekmez. Kapsam dışında kalan tek şey platformun kaynak kodudur."}},{"@type":"Question","name":"Verilerimi başka bir web hizmetinde kullanabilir miyim?","acceptedAnswer":{"@type":"Answer","text":"Evet. Dışa aktarma CSV ve JSON gibi açık biçimlerde yapılır; veriniz özel bir formata kilitlenmez. İndirdiğiniz içerik ve müşteri kayıtlarını başka bir web hizmetinde, başka bir müşteri yönetim sisteminde veya kendi geliştirdiğiniz bir sistemde kullanabilirsiniz. Bunu engelleyen bir sözleşme maddesi yoktur."}},{"@type":"Question","name":"Alan adım ve içeriğim kime ait?","acceptedAnswer":{"@type":"Answer","text":"Alan adı sizin adınıza kayıtlıdır ve size aittir. Ürettiğiniz portföy, müşteri kayıtları, görseller ve metinler de size aittir. Platformun kaynak kodu ve ProX veri motoru bize aittir; bunlar lisanslanır, devredilmez."}},{"@type":"Question","name":"Kilitlenir miyim, çıkmak istersem ne olur?","acceptedAnswer":{"@type":"Answer","text":"Çıkış yolu baştan tanımlıdır: verinizi istediğiniz an kendiniz indirirsiniz, açık biçimlerde alırsınız, üyelik bitiminde siteniz 45 gün daha ayakta kalır. Çıkışı zorlaştıran bir teknik engel ya da veriyi rehin alan bir uygulama yoktur."}},{"@type":"Question","name":"Müşteri verilerime siz erişebiliyor musunuz?","acceptedAnswer":{"@type":"Answer","text":"Verileriniz size aittir. Talepler, müşteri kayıtları ve teklifler sizin panelinizde tutulur; pazarlama amacıyla kullanılmaz, üçüncü taraflara satılmaz ve başka bir müşteriye gösterilmez. Veriler bizim sunucularımızda barındığı için KVKK anlamında veri işleyen sıfatını taşırız; bu, erişimin sözleşmeyle sınırlı olduğu ve yalnızca sizin talep ettiğiniz teknik destek kapsamında kullanılabileceği anlamına gelir. Sözleşme, erişimin hangi hâllerde mümkün olduğunu açıkça tanımlar."}},{"@type":"Question","name":"KVKK sorumluluğu kimde?","acceptedAnswer":{"@type":"Answer","text":"Ziyaretçilere ilişkin veri sorumlusu sizsiniz; biz veri işleyen sıfatıyla hareket ederiz ve bunu sözleşmeyle tanımlarız. KVKK aydınlatma metni, gizlilik ve çerez politikası ile kullanım koşulları hazır gelir; künye alanları sizin bilgilerinizle doldurulur."}},{"@type":"Question","name":"Verilerim nerede saklanıyor?","acceptedAnswer":{"@type":"Answer","text":"Veriler bizim yönettiğimiz sunucularda, her müşteri için ayrı kayıt alanında tutulur. Bir müşterinin verisi başka bir müşterinin panelinde görünmez. Barındırma yeri ve yedekleme koşulları sözleşmede tanımlanır."}},{"@type":"Question","name":"Siteme SSL sertifikası dahil mi?","acceptedAnswer":{"@type":"Answer","text":"Evet. Alan adınıza tanımlı SSL sertifikası kurulumla birlikte gelir ve yenilenmesi otomatiktir. Ziyaretçi bağlantısı şifrelenir."}},{"@type":"Question","name":"İçeriği kim yazacak?","acceptedAnswer":{"@type":"Answer","text":"Dolu gelir. Hizmet açıklamaları, bölge sayfaları, metodoloji metinleri ve soru-cevap kütüphanesi hazırdır. Sizden istenen logo, künye ve iletişim bilgileridir."}},{"@type":"Question","name":"İçerikleri yapay zekâ mı yazıyor?","acceptedAnswer":{"@type":"Answer","text":"Hesaplanan değerler yapay zekâdan gelmez; ProX deterministik bir veri motorudur. Bu değerleri okunur Türkçeye çeviren ayrı bir katman vardır ve bu bir dil modelidir — adı İçerik Asistanı’dır, bunu saklamıyoruz. Yayımlanan her metnin altında adı geçen bir editör bulunur ve metin yayına girmeden önce kontrol edilir."}},{"@type":"Question","name":"Ne sıklıkla yeni içerik yayımlanıyor?","acceptedAnswer":{"@type":"Answer","text":"İçerik takvimle değil tetikleyiciyle üretilir: bölgenizdeki bir mahallenin endeksi eşiği aştığında, ilçe sıralaması değiştiğinde ya da sizi ilgilendiren bir mevzuat yayımlandığında. ProX Investor üyeliğinde haftada 3’e kadar, ProX Corporate üyeliğinde günde 5’e kadar bülten üretilir. Tetikleyici yoksa metin yayımlanmaz."}},{"@type":"Question","name":"ProX yapay zekâ mı?","acceptedAnswer":{"@type":"Answer","text":"Hayır. ProX bir dil modeli değil, deterministik bir veritabanı motorudur. Aynı girdiye her zaman aynı çıktıyı verir; halüsinasyon üretmez. Veri gelmediğinde tahmin yapmaz, alanı boş bırakır. Metin üretimi işlevleri ayrı bir katmandır ve İçerik Asistanı olarak adlandırılır."}},{"@type":"Question","name":"SEO’da diğer müşterilerinizle aynı içerik sorunu yaşar mıyım?","acceptedAnswer":{"@type":"Answer","text":"İskelet ortaktır, içerik değil. Her kurulumda kanonik adres ve sosyal etiketler sizin alan adınıza yazılır; marka ve şehir adları Türkçe ek uyumuyla dönüştürülür. Künye, portföy ve hizmet içeriğiniz size özeldir."}},{"@type":"Question","name":"Yapay zekâ aramalarında çıkar mıyım?","acceptedAnswer":{"@type":"Answer","text":"Sayfalarınız soru-cevap yapısı ve varlık tanımlarıyla işaretlenir, robots.txt dosyanız arama asistanlarının tarayıcılarına açık gelir ve siteniz Bing Webmaster Tools’a kayıtlı olarak teslim edilir. Bunlar içeriğin makine tarafından doğru okunabilmesini sağlar. Sıralama garantisi verilemez; hiçbir arama asistanında sıra satın alınamaz."}},{"@type":"Question","name":"Google Analytics ve Search Console bağlanabiliyor mu?","acceptedAnswer":{"@type":"Answer","text":"Evet. Google Analytics, Search Console ve Google Ads bağlantıları yönetim panelindeki Google Entegrasyonları modülünden kurulur. Search Console mülkiyeti sizin adınıza tanımlanır."}},{"@type":"Question","name":"Özel Portföy nedir?","acceptedAnswer":{"@type":"Answer","text":"İlanı kamuya açmadan çalışmanızı sağlayan kapalı portföy alanıdır. Kayıt davet bağlantısıyla paylaşılır, portallara düşmez, ancak mahalle endeksinin içinde yaşamaya devam eder. ProX Corporate üyeliğinde görüntüleme kaydı, süreli erişim ve filigran özellikleri eklenir."}},{"@type":"Question","name":"EİDS zorunluluğu beni nasıl etkiliyor?","acceptedAnswer":{"@type":"Answer","text":"Ticaret Bakanlığı’nın Elektronik İlan Doğrulama Sistemi (EİDS) kademeli olarak yürürlüğe girdi: kimlik doğrulaması 1 Kasım 2023, yetki belgesi doğrulaması 15 Eylül 2024, 15 Şubat 2026’dan itibaren tüm gayrimenkul ilanlarında zorunlu. Yetki belgesi ve taşınmaz doğrulaması yapılmadan ilan yayınlanamıyor. Sitenizde bu akış panele gömülü gelir — ayrı bir sisteme girip elle doğrulama yapmazsınız."}},{"@type":"Question","name":"İlanlarımı portallara da gönderebilir miyim?","acceptedAnswer":{"@type":"Answer","text":"Evet. İlanlar modülü yayın, fotoğraf yönetimi ve portal dağıtımını kapsar. Özel Portföy’e kaydettiğiniz ilanlar ise bilinçli olarak portallara gönderilmez."}},{"@type":"Question","name":"Mevcut ilanlarımı sahibinden, hepsiemlak veya emlakjet’ten buraya taşıyabilir miyim?","acceptedAnswer":{"@type":"Answer","text":"Evet, ve ilanlarınızı sıfırdan girmezsiniz. sahibinden.com’daki ilanlarınızı, Rekabet Kurulu’nun 26 Haziran 2025 kararıyla zorunlu kılınan resmî API veri taşıma altyapısı üzerinden içe aktarırız — kurumsal emlak üyeleri için ücretsiz ve yasal bir haktır. hepsiemlak ve emlakjet gibi diğer portallardaki ilanlarınızı ise portaldan aldığınız kendi dışa aktarım dosyanızla içe alırsınız. İlan görselleriniz, kaynağın taşımaya açtığı ölçüde birlikte aktarılır. Taşınan içerik yalnızca size ait olan kendi ilanlarınızdır; portalları izinsiz tarayarak veya başka bir firmanın verisini çekerek değil, yasal veri taşınabilirliği yoluyla aktarılır."}},{"@type":"Question","name":"ProX API’ye erişebilir miyim?","acceptedAnswer":{"@type":"Answer","text":"ProX Corporate üyeliğinde kısıtlı API erişimi, kurumsal anlaşmada toplu ve akış uçlarını içeren tam erişim verilir. ProX Investor üyeliğinde API erişimi bulunmaz; veriler panel üzerinden kullanılır."}},{"@type":"Question","name":"Sitem mobilde nasıl çalışıyor?","acceptedAnswer":{"@type":"Answer","text":"Tüm sürümler mobil öncelikli kurgulanır ve aynı kod tabanı tüm ekran boyutlarına uyarlanır. Sayfalar derleme adımı olmadan statik olarak servis edilir; bu, ağır bir çatı yüklenmediği için mobil bağlantıda daha hızlı açılması anlamına gelir."}},{"@type":"Question","name":"Kendi geliştiricim siteye müdahale edebilir mi?","acceptedAnswer":{"@type":"Answer","text":"Yönetim paneli kod bilgisi gerektirmez; içerik, tema, menü ve modül ayarları panelden yapılır. Kaynak koduna erişim verilmez. Veri düzeyinde çalışmak isteyen bir geliştiriciniz varsa ProX API erişimi olan kademelerde bu mümkündür."}},{"@type":"Question","name":"Platform için ayrıca ödeme yapacak mıyım?","acceptedAnswer":{"@type":"Answer","text":"Hayır. Platformun ayrı bir liste fiyatı yoktur, çünkü ayrı satılan bir ürün değildir. ProX Investor ve üzeri üyeliklere dahildir. Yerel Uzman üyeliğinde platform bulunmaz."}},{"@type":"Question","name":"Fiyatlara KDV dahil mi?","acceptedAnswer":{"@type":"Answer","text":"Evet. Sayfada gösterilen aylık tutarlara %20 KDV dahildir; ödeyeceğiniz fiyat gördüğünüz fiyattır, faturaya ayrıca KDV eklenmez. (Türkiye’de standart KDV oranı 10 Temmuz 2023’ten beri %20’dir.)"}},{"@type":"Question","name":"Sözleşme süresi ne kadar? Aylık mı yıllık mı ödüyorum?","acceptedAnswer":{"@type":"Answer","text":"Web sitesi hizmeti yıllık anlaşmayla verilir. Ödemeyi ister aylık yapar, ister yıllık peşin ödersiniz. Yıllık peşin ödeyenler 12 ay için 10 aylık ücret öder — iki ay ücretsizdir."}},{"@type":"Question","name":"Deneme sürümü var mı? Beğenmezsem ne olur?","acceptedAnswer":{"@type":"Answer","text":"Ürünü 10 gün ücretsiz kullanırsınız; kurulum ücretsizdir, ayrı bir kurulum bedeli alınmaz. Bu süre içinde beğenmezseniz ödemenizin %100’ü iade edilir — hiçbir kesinti yapılmaz."}},{"@type":"Question","name":"Kurulumdan sonra destek ve eğitim alıyor muyum?","acceptedAnswer":{"@type":"Answer","text":"Evet. Kurulumun ardından kullanım eğitimi verilir ve sürekli destek sağlanır. Ayrıca üyelik paketinize göre her ay sitenize yeni sayfa eklenir; otomatik üretilen blog ve haber içerikleri bu aylık sayfa hakkının dışındadır."}},{"@type":"Question","name":"Rakibim de aynı platformu alabilir mi?","acceptedAnswer":{"@type":"Answer","text":"Aynı sektörde bölge münhasırlığı talep ediyorsanız bunu sözleşmede tanımlıyoruz. Standart kurulumda münhasırlık yoktur; tema, içerik ve veri kapsamınız size özeldir."}},{"@type":"Question","name":"Kurulumdan sonra tasarım değişikliği yapabilir miyim?","acceptedAnswer":{"@type":"Answer","text":"Renk, logo, tipografi ve menü düzenlemeleri panelden kendiniz yaparsınız. Yapısal arayüz değişiklikleri talep hâlinde ayrıca değerlendirilir."}},{"@type":"Question","name":"Sıralama garantisi veriyor musunuz?","acceptedAnswer":{"@type":"Answer","text":"Hayır. Ne Google’da ne yapay zekâ aramalarında sıralama garantisi vermiyoruz. Teknik altyapıyı kurar, ölçer ve raporlarız; sonucu taahhüt etmeyiz."}}]}

  /* ===== Gerçek ekran görüntüsü vitrini =====

  @media (max-width:860px) { .shot-stage { aspect-ratio:414/780; } }

  .sk {
    --sk-bg:#0e0f13; --sk-accent:#ff7a2f; --sk-ink:#f0eee9; --sk-mut:rgba(240,238,233,.62);

    border: 1px solid rgba(255,255,255,0.14); overflow: hidden; position: relative;
  }
  .sk * { transition: background-color .62s cubic-bezier(.4,0,.2,1), color .62s cubic-bezier(.4,0,.2,1), border-color .62s cubic-bezier(.4,0,.2,1); }
  .sk-nav { display:flex; align-items:center; gap:22px; padding:15px 22px; border-bottom:1px solid var(--sk-line); flex-wrap:wrap; }

  .sk-btn2 { font-family:var(--sk-body); font-size:12px; font-weight:600; padding:8px 15px; border-radius:calc(var(--sk-r) - 5px); border:1px solid var(--sk-line); color:var(--sk-ink); white-space:nowrap; }

  .sk-h1 { font-family:var(--sk-head); font-size:clamp(21px,2.9vw,34px); font-weight:700; line-height:1.16; letter-spacing:-.028em; margin:11px 0 0; max-width:560px; }

  .sk-row { display:flex; gap:9px; margin-top:20px; flex-wrap:wrap; }
  .sk-stats { display:flex; gap:26px; margin-top:26px; padding-top:18px; border-top:1px solid var(--sk-line); flex-wrap:wrap; }

  /* ---- Kimlik seçici -------------------------------------------------------
     Kartın kendisi seçtiği kimliği giyer: gövdesindeki minyatür, o sektörün
     GERÇEK paletini, başlık tipografisini, menü kalemi ve istatistik sayısını
     kullanır (hepsi IDS'ten — demo siteleri de aynı yapılandırmadan besleniyor).
     Minyatür soyut bir arayüz iskeletidir; ekran görüntüsü değildir — gerçek
     görüntü aşağıdaki vitrinde durur, ikisi karışmasın diye geometrik tutuldu. */
  .id-pick { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .id-btn { position:relative; padding:0; border:1px solid rgba(255,255,255,.13); background:#0A1626;
            cursor:pointer; text-align:left; overflow:hidden; border-radius:5px; display:block; width:100%;
            transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease; }
  .id-btn:hover { border-color:rgba(255,255,255,.32); transform:translateY(-3px); }
  .id-btn:focus-visible { outline:2px solid #A78BFA; outline-offset:2px; }
  .id-btn[aria-pressed="true"] { border-color:var(--acc); transform:translateY(-3px);
                                 box-shadow:0 0 0 1px var(--acc), 0 14px 34px -16px rgba(0,0,0,.95); }
  /* Üstte seçim şeridi — seçilince ortadan açılır */
  .id-btn::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:var(--acc);
                    transform:scaleX(0); transform-origin:50% 50%; transition:transform .32s cubic-bezier(.4,0,.2,1); z-index:3; }
  .id-btn[aria-pressed="true"]::before { transform:scaleX(1); }

  /* Minyatür arayüz — sektörün kendi renk ve tipografisiyle */
  /* display:block şart — parçalar <button> içinde <span>, satır içi kalırsa
     yükseklik/dolgu tutmaz. Esnek kutu çocukları zaten bloklaşıyor. */
  .id-spec { display:block; position:relative; height:84px; background:var(--pbg); overflow:hidden;
             padding:9px 10px; border-bottom:1px solid var(--pline); }
  .id-spec .h1, .id-spec .h2, .id-spec .cta { display:block; }
  .id-spec .hd { display:flex; align-items:center; gap:5px; }
  .id-spec .mk { width:12px; height:12px; border-radius:3px; background:var(--acc); flex:0 0 auto;
                 display:grid; place-items:center; font:800 7px/1 'Sora',sans-serif; color:var(--ponacc); }
  .id-spec .nm { font-family:var(--phead),sans-serif; font-size:8.5px; font-weight:700;
                 letter-spacing:-.01em; color:var(--pink); white-space:nowrap; }
  .id-spec .mn { display:flex; gap:2px; margin-left:auto; flex:0 0 auto; }
  .id-spec .mn i { width:5px; height:2px; border-radius:1px; background:var(--pink); opacity:.3;
                   transform:scaleX(0); transform-origin:left; }
  .id-spec .h1 { margin-top:9px; height:5px; width:74%; border-radius:1px; background:var(--pink); opacity:.6;
                 transform:scaleX(0); transform-origin:left; }
  .id-spec .h2 { margin-top:4px; height:3px; width:50%; border-radius:1px; background:var(--pink); opacity:.24;
                 transform:scaleX(0); transform-origin:left; }
  .id-spec .cta { margin-top:7px; height:9px; width:38px; border-radius:2px; background:var(--acc); opacity:0; }
  .id-spec .st { position:absolute; left:10px; right:10px; bottom:8px; display:flex; gap:4px; }
  .id-spec .st i { flex:1; height:2px; background:var(--pink); opacity:.2; transform:scaleX(0); transform-origin:left; }
  /* Seçili kartta iskelet sırayla kurulur — "site kuruluyor" hissi */
  .id-btn[aria-pressed="true"] .id-spec .mn i,
  .id-btn[aria-pressed="true"] .id-spec .h1,
  .id-btn[aria-pressed="true"] .id-spec .h2,
  .id-btn[aria-pressed="true"] .id-spec .st i { animation:idGrow .42s cubic-bezier(.4,0,.2,1) forwards; }
  .id-btn[aria-pressed="true"] .id-spec .cta { animation:idFade .4s ease .34s forwards; }
  .id-btn[aria-pressed="true"] .id-spec .h1 { animation-delay:.10s; }
  .id-btn[aria-pressed="true"] .id-spec .h2 { animation-delay:.17s; }
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(1){animation-delay:.02s}
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(2){animation-delay:.06s}
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(3){animation-delay:.10s}
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(4){animation-delay:.14s}
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(5){animation-delay:.18s}
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(6){animation-delay:.22s}
  .id-btn[aria-pressed="true"] .id-spec .mn i:nth-child(7){animation-delay:.26s}
  .id-btn[aria-pressed="true"] .id-spec .st i:nth-child(1){animation-delay:.24s}
  .id-btn[aria-pressed="true"] .id-spec .st i:nth-child(2){animation-delay:.29s}
  .id-btn[aria-pressed="true"] .id-spec .st i:nth-child(3){animation-delay:.34s}
  @keyframes idGrow { to { transform:scaleX(1); } }
  @keyframes idFade { to { opacity:1; } }
  /* Seçili olmayan kart da kimliğini TAM gösterir. Bölümün iddiası "dört ayrı
     yüz" — üçünü soluklaştırmak tam da kanıtlanmak isteneni siliyordu. Hiyerarşi
     kenarlık/yükselme/şeritle veriliyor, rengi kısarak değil. */
  .id-btn[aria-pressed="false"] .id-spec .mn i,
  .id-btn[aria-pressed="false"] .id-spec .h1,
  .id-btn[aria-pressed="false"] .id-spec .h2,
  .id-btn[aria-pressed="false"] .id-spec .st i { transform:scaleX(1); }
  .id-btn[aria-pressed="false"] .id-spec .cta { opacity:.9; }
  .id-btn[aria-pressed="false"] .id-spec { opacity:.82; transition:opacity .25s linear; }
  .id-btn:hover .id-spec { opacity:1; }

  .id-meta { display:block; padding:9px 11px 11px; position:relative; }
  .id-btn .t { display:block; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
               letter-spacing:.09em; color:#94A3B8; transition:color .18s linear; padding-right:20px; }
  .id-btn[aria-pressed="true"] .t { color:#F1F5F9; }
  .id-btn .s { display:block; font-family:'JetBrains Mono',monospace; font-size:8.5px;
               letter-spacing:.06em; color:#4A5B70; margin-top:4px; }
  .id-no { position:absolute; right:10px; top:9px; font-family:'JetBrains Mono',monospace;
           font-size:8.5px; letter-spacing:.06em; color:#33455C; }
  .id-btn[aria-pressed="true"] .id-no { color:var(--acc); }
  /* Otomatik geçiş ilerleme çizgisi — yalnız otomatik tur açıkken görünür */
  .id-prog { position:absolute; left:0; bottom:0; height:2px; width:0; background:var(--acc); opacity:.85; z-index:3; }

  @media (max-width:860px){ .id-pick { grid-template-columns:repeat(2,minmax(0,1fr)) !important; } }
  @media (prefers-reduced-motion:reduce){
    .id-btn, .id-btn::before, .id-spec * { transition:none !important; animation:none !important; }
    .id-btn:hover, .id-btn[aria-pressed="true"] { transform:none; }
    .id-btn[aria-pressed="true"] .id-spec .mn i,
    .id-btn[aria-pressed="true"] .id-spec .h1,
    .id-btn[aria-pressed="true"] .id-spec .h2,
    .id-btn[aria-pressed="true"] .id-spec .st i { transform:scaleX(1); }
    .id-btn[aria-pressed="true"] .id-spec .cta { opacity:1; }
  }

  /* ---- Modül gezgini ------------------------------------------------------
     "26 modül" sayfanın taşıyıcı iddiası (meta açıklama, A.2 tablosu, manşet).
     Statik kutu ızgarası onu yalnız SÖYLÜYORDU; süzme + arama ile gezilebilir
     hale gelince KANITLIYOR. Kategoriler modüllerin ne olduğunu tarif eder,

  .mod-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; }
  .mod-chip { background:#0A1626; border:1px solid rgba(255,255,255,.14); color:#94A3B8; cursor:pointer;
              font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.08em; font-weight:700;
              padding:6px 10px; border-radius:2px; transition:border-color .15s linear, color .15s linear, background-color .15s linear; }

             outline:none; min-width:170px; flex:1 1 170px; max-width:280px; transition:border-color .14s linear; }
  .mod-ara:focus { border-color:#A78BFA; }
  .mod-ara::placeholder { color:#3E5069; }
  .mod-say { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.1em; color:#4A5B70; margin-left:auto; }
  .mod-say b { color:#F1F5F9; font-weight:600; font-variant-numeric:tabular-nums; }

  .mod-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:1px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); }
  .mod { background:#0A1626; padding:11px 13px; opacity:0; transform:translateY(6px); position:relative; }

  .mod .kat { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:7.5px;
              letter-spacing:.12em; color:#64748B; border:1px solid rgba(255,255,255,.12);
              padding:2px 5px; border-radius:2px; margin-top:7px; }
  /* Aramada eşleşen harfler */
  .mod mark { background:rgba(167,139,250,.28); color:#F1F5F9; border-radius:1px; }
  .mod-bos { padding:18px 14px; background:#0A1626; font-family:'JetBrains Mono',monospace;
             font-size:10px; letter-spacing:.06em; color:#4A5B70; grid-column:1/-1; }
  @media (prefers-reduced-motion:reduce){ .mod, .mod.in { opacity:1 !important; transform:none !important; transition:none !important; } }

  .wl-two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1px; align-items:start; }
  .wl-cmp { overflow-x:auto; }
  /* Hendek olay etiketleri: geniş ekranda grafiğin içinde, dar ekranda künyede.
     SVG metni viewBox ile ölçeklendiği için mobilde okunacak boyuta gelmiyor. */

  #wl-trench:focus-visible { outline:2px solid #A78BFA; outline-offset:2px; }
  @media (max-width:760px){

  .wl-faq summary { cursor:pointer; list-style:none; transition:color .14s linear; }
  .wl-faq summary::-webkit-details-marker { display:none; }
  .wl-faq summary:hover, .wl-faq[open] summary { color:#F1F5F9; }
  .wl-assure { -webkit-mask-image:linear-gradient(transparent,black 26%,black 74%,transparent); mask-image:linear-gradient(transparent,black 26%,black 74%,transparent); user-select:none; }
  .wl-card { transition:border-color .14s linear, background-color .14s linear; }

  /* ---- Canlı deneme alanları ---- */
  .wl-in { background:#020812; border:1px solid rgba(255,255,255,.14); color:#F1F5F9;
           font-family:'Inter Tight',sans-serif; font-size:14px; padding:9px 12px; border-radius:2px;
           width:100%; outline:none; transition:border-color .14s linear; }

     metin rengi) ondan HESAPLANIR. Altı yüzey aynı değişkenleri okuduğu için tek

  .bk { --b-acc:#ff7a2f; --b-dark:#c85a18; --b-light:#ffd9c2; --b-on:#1a1205; }

  @media (max-width:620px){

       de iki sütun kalıyor, ad kutusu 119px'e sıkışıyordu. !important şart —
       satır içi stil medya sorgusunu ezer. */
    .wl-brandrow { grid-template-columns:1fr !important; gap:12px 0 !important; align-items:stretch !important; }
    #wl-swatches { flex-wrap:wrap; }
  }
  /* Gerçek ekran görüntüsünün üstüne binen marka katmanı */
  .shot-brand { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:9px;
                padding:14px 20px; pointer-events:none; opacity:0; transition:opacity .3s linear; z-index:2; }
  .shot-brand.on { opacity:1; }
  .shot-brand .m { width:26px; height:26px; border-radius:6px; display:grid; place-items:center;
                   font:800 14px/1 'Sora',sans-serif; color:#fff; flex:0 0 auto; }
  .shot-brand .n { font:700 16px/1 'Sora',sans-serif; letter-spacing:-.01em; color:#fff;
                   text-shadow:0 1px 12px rgba(0,0,0,.85); }
  /* ---- Türkiye radarı (hero) ---- */
  .tr-radar { position:relative; aspect-ratio:16/10; background:#020812;
              border:1px solid rgba(255,255,255,.14); overflow:hidden; }
  .tr-radar svg, .tr-radar canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .tr-radar canvas { pointer-events:none; }
  /* İl sınırı: taranan il kısa süre parlar — geçiş JS'te sınıfla tetiklenir */
  .tr-il { fill:rgba(56,189,248,.045); stroke:rgba(56,189,248,.26); stroke-width:.55;
           vector-effect:non-scaling-stroke; transition:fill .18s linear, stroke .18s linear; }
  .tr-il.hot { fill:rgba(167,139,250,.16); stroke:rgba(196,181,253,.95); }
  .tr-grid { stroke:rgba(255,255,255,.045); stroke-width:.5; vector-effect:non-scaling-stroke; }
  .tr-cap { position:absolute; left:12px; bottom:10px; font-family:'JetBrains Mono',monospace;
            font-size:9px; letter-spacing:.1em; color:#4A5B70; }
  .tr-live { position:absolute; right:12px; top:11px; display:flex; align-items:center; gap:6px;
             font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; color:#64748B; }
  .tr-live i { width:6px; height:6px; border-radius:50%; background:#34D399; display:inline-block;
               animation:nadasPulse 1.6s ease-in-out infinite; }
  /* Okuma paneli — huzmenin o an geçtiği ilçe */
  .tr-read { position:absolute; left:12px; top:10px; font-family:'JetBrains Mono',monospace;
             pointer-events:none; max-width:62%; }
  .tr-read .k { font-size:8px; letter-spacing:.16em; color:#4A5B70; display:block; }
  .tr-read .v { font-size:12px; letter-spacing:.02em; color:#C4B5FD; display:block; margin-top:3px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                text-shadow:0 0 14px rgba(167,139,250,.5); }
  .tr-read .v b { color:#fff; font-weight:600; }
  .tr-cnt { position:absolute; right:12px; bottom:10px; font-family:'JetBrains Mono',monospace;
            font-size:9px; letter-spacing:.1em; color:#4A5B70; }
  .tr-cnt b { color:#94A3B8; font-weight:500; font-variant-numeric:tabular-nums; }
  @media (max-width:620px){
    .tr-read .v { font-size:11px; } .tr-cap { font-size:8px; left:9px; }
    .tr-cnt { font-size:8px; right:9px; } .tr-live { font-size:8px; right:9px; }
    /* Dar ekranda künye yazısı sayaçla çakışıyordu; uzun kısım zaten alttaki
       teknik şeritte tekrar ediyor — burada kısaltıyoruz. */
    .tr-cap-x { display:none; }
  }
  @media (prefers-reduced-motion:reduce){ .tr-live i { animation:none !important; }
    .tr-il { transition:none; } }

  /* Yapışkan kademe çubuğu */
  #wl-bar { position:fixed; left:0; right:0; bottom:0; z-index:60; transform:translateY(110%);
            transition:transform .28s cubic-bezier(.4,0,.2,1); background:#0A1626;
            border-top:1px solid rgba(167,139,250,.45); }
  #wl-bar.on { transform:none; }
  #wl-bar .in { max-width:1280px; margin:0 auto; padding:11px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  @media (max-width:620px){ #wl-bar .in { justify-content:center; text-align:center; } }
  .wl-tier { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.14fr) minmax(0,1.38fr); gap:1px; align-items:start; }

  /* ---- Maliyet karşılaştırması --------------------------------------------
     DİKKAT: ajans rakamı TEK SEFERLİK kurulum, diğerleri YILLIK gider. Aynı
     eksende etiketsiz göstermek ajansı yıllık masraf gibi okutur — her çubuğun
     cinsi ayrıca yazılıyor. Rakamlar sayfanın kendi karşılaştırma notundan. */
  .mk-satir { display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(0,132px);
              gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .mk-satir:last-child { border-bottom:0; }
  .mk-ad { font-family:'Sora',sans-serif; font-size:12.5px; font-weight:600; color:#F1F5F9; letter-spacing:-.008em; }
  .mk-cins { display:block; font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.1em;
             color:#4A5B70; margin-top:3px; font-weight:400; }
  /* Her çubuk SIFIRDAN başlar — uzunluk = büyüklük, tek bakışta kıyaslanır.
     Aralıklı kalemlerde: koyu kısım alt sınır, açık uzantı üst sınıra kadar.
     Tek değerlerde çekirdek %100 olur, özel duruma gerek kalmaz. */
  .mk-ray { position:relative; height:14px; background:rgba(255,255,255,.045); border-radius:2px; overflow:hidden; }
  .mk-bar { position:absolute; top:0; bottom:0; left:0; width:0; border-radius:2px;
            transition:width .9s cubic-bezier(.22,1,.36,1); }
  .mk-cekirdek { position:absolute; top:0; bottom:0; left:0; width:100%; border-radius:2px; }
  .mk-bar.bant { background:repeating-linear-gradient(115deg, rgba(248,113,113,.16) 0 5px, rgba(248,113,113,.05) 5px 10px); }
  .mk-bar.bant .mk-cekirdek { background:rgba(248,113,113,.62); }
  .mk-bar.tek { background:rgba(167,139,250,.22); }
  .mk-bar.tek .mk-cekirdek { background:#A78BFA; }
  .mk-bar.tek.vurgu { background:rgba(52,211,153,.22); }
  .mk-bar.tek.vurgu .mk-cekirdek { background:#34D399; }
  .mk-tutar { font-family:'JetBrains Mono',monospace; font-size:11px; color:#CBD5E1;
              text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mk-tutar b { color:#fff; font-weight:600; }
  @media (max-width:620px){
    .mk-satir { grid-template-columns:1fr !important; gap:5px 0 !important; padding:11px 0; }
    .mk-tutar { text-align:left; }
  }
  @media (prefers-reduced-motion:reduce){ .mk-bar { transition:none !important; } }

  /* ---- Kademe odaklama: seçilen sütun öne çıkar ---- */
  .wl-cmp td.sonuk, .wl-cmp th.sonuk { opacity:.32; transition:opacity .2s linear; }
  .wl-cmp td.odak, .wl-cmp th.odak { background:rgba(167,139,250,.10) !important; }
  .wl-cmp tr.yok td { opacity:.3; }
  .tier-focus:focus-visible { outline:2px solid #A78BFA; outline-offset:-2px; }
  .tier-focus[aria-pressed="true"] { box-shadow:inset 3px 0 0 #A78BFA; }
  .wl-matris summary::-webkit-details-marker { display:none; }
  .wl-matris summary:hover { border-color:rgba(167,139,250,.55); }
  .wl-matris[open] summary > span:first-child { transform:rotate(45deg); }
  .wl-matris summary > span:first-child { display:inline-block; transition:transform .18s ease; }

  /* ---- Görünürlük karşılaştırması (Özel Portföy) --------------------------
     Kapalı portföyün ne olduğunu anlatmanın en hızlı yolu "kim neyi görüyor"
     tablosu. Süperlatif yerine mekanik: okuyucu farkı kendisi okuyor. */
  .gv-sec { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .gv-btn { background:#0A1626; border:1px solid rgba(255,255,255,.14); color:#94A3B8; cursor:pointer;
            font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.09em; font-weight:700;
            padding:7px 12px; border-radius:2px; transition:border-color .15s, color .15s, background-color .15s; }
  .gv-btn:hover { border-color:rgba(255,255,255,.34); color:#E2E8F0; }
  .gv-btn[aria-pressed="true"] { border-color:#A78BFA; background:#A78BFA; color:#0B1220; }
  .gv-btn:focus-visible { outline:2px solid #A78BFA; outline-offset:2px; }
  .gv-satir { display:grid; grid-template-columns:minmax(0,1fr) 104px; gap:12px; align-items:center;
              padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .gv-satir:last-of-type { border-bottom:0; }
  .gv-ad { font-size:13px; color:#CBD5E1; line-height:1.4; }
  .gv-rozet { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.08em; font-weight:700;
              padding:4px 8px; border-radius:2px; text-align:center; white-space:nowrap;
              transition:background-color .2s linear, color .2s linear; }
  /* gorur = istenmeyen izleyici görüyor (maruziyet) · gormez = mahremiyet korundu
     istenen = kasıtlı erişim (davetli alıcı, siz) · notr = endekse işlenir */
  .gv-rozet.gorur { background:rgba(248,113,113,.16); color:#F87171; }
  .gv-rozet.gormez { background:rgba(52,211,153,.16); color:#34D399; }
  .gv-rozet.istenen { background:rgba(167,139,250,.18); color:#C4B5FD; }
  .gv-rozet.notr { background:rgba(148,163,184,.14); color:#94A3B8; }

  /* ---- Ortak / size özel ayrımı ------------------------------------------
     "Aynı şablonu 100 kişiye satıyorlar" itirazının cevabı bir cümle değil,
     bileşen bileşen döküm olmalı. Sol sütun ortak iskelet, sağ sütun tenant'a
     özel olan — ve sağ sütunun uzunluğu argümanın kendisi. */
  .oz-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px;
             background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.10); }
  .oz-sut { background:#0A1626; padding:13px 15px; }
  .oz-bas { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.12em;
            font-weight:700; margin-bottom:9px; }
  .oz-bas.ortak { color:#64748B; }
  .oz-bas.ozel { color:#A78BFA; }
  .oz-sut li { list-style:none; font-size:12.5px; line-height:1.5; color:#94A3B8;
               padding:6px 0 6px 15px; position:relative; border-bottom:1px solid rgba(255,255,255,.055); }
  .oz-sut li:last-child { border-bottom:0; }
  .oz-sut li::before { content:"·"; position:absolute; left:3px; color:#3E5069; font-weight:700; }
  .oz-sut.ozel li { color:#CBD5E1; }
  .oz-sut.ozel li::before { content:"◆"; color:#A78BFA; font-size:8px; top:9px; }
  .oz-say { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em;
            color:#4A5B70; margin-top:9px; display:block; }
  /* Google politika alıntısı — kaynak metin olduğu görsel olarak da belli olsun */
  .g-alinti { border-left:2px solid rgba(248,113,113,.5); padding:2px 0 2px 13px; margin:0 0 9px; }
  .g-alinti q { font-style:italic; color:#CBD5E1; font-size:13px; line-height:1.6; quotes:"“" "”"; }
  .g-alinti cite { display:block; font-family:'JetBrains Mono',monospace; font-size:8.5px;
                   letter-spacing:.08em; color:#4A5B70; font-style:normal; margin-top:5px; }
  @media (max-width:620px){ .oz-grid { grid-template-columns:1fr !important; } }

  /* ---- Ziyaretçi işlevleri: "ne yapar → sizde ne oluşur" -------------------
     Özellik listesi olarak durduğunda satış argümanı taşımıyordu. Her kartın
     alt satırı panele düşen kaydı söylüyor; bölümün iddiası bu. */
  .zy-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:1px;
             background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.09); }
  .zy { background:#0A1626; padding:13px 15px; display:flex; flex-direction:column; gap:5px; }
  .zy[hidden] { display:none; }
  .zy-ad { font-family:'Sora',sans-serif; font-size:13px; font-weight:600; color:#F1F5F9; letter-spacing:-.008em; }
  .zy-ne { font-size:11.5px; color:#64748B; line-height:1.45; }
  .zy-sonuc { font-size:12px; line-height:1.5; color:#CBD5E1; padding-top:7px; margin-top:2px;
              border-top:1px solid rgba(255,255,255,.07); display:flex; gap:7px; align-items:flex-start; }
  .zy-sonuc::before { content:"→"; color:#A78BFA; font-family:'JetBrains Mono',monospace;
                      font-size:11px; flex:0 0 auto; line-height:1.5; }
  .zy-tur { font-family:'JetBrains Mono',monospace; font-size:7.5px; letter-spacing:.12em;
            padding:2px 6px; border-radius:2px; align-self:flex-start; margin-top:1px; }
  .zy-tur.talep { background:rgba(167,139,250,.18); color:#C4B5FD; }
  .zy-tur.sinyal { background:rgba(56,189,248,.15); color:#7DD3FC; }
  .zy-tur.erisim { background:rgba(148,163,184,.14); color:#94A3B8; }
  .zy-bos { padding:16px; background:#0A1626; grid-column:1/-1; font-family:'JetBrains Mono',monospace;
            font-size:10px; letter-spacing:.06em; color:#4A5B70; }

  /* ---- Tetikleyici gösterimi (içerik üretimi) -----------------------------
     "Takvimle değil tetikleyiciyle" cümlesi anlatıldığında soyut kalıyordu.
     Üç tetikleyici seçilebilir, her biri ne tür bir çıktı ürettiğini gösterir.
     Çıktılar ÖRNEKTİR ve öyle etiketlenir — yayımlanmış içerik değildir. */
  .tt-sec { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tt-kutu { background:#020812; border:1px solid rgba(255,255,255,.12); border-radius:3px;
             padding:14px 16px; min-height:132px; }
  .tt-et { font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.14em;
           color:#4A5B70; display:block; margin-bottom:8px; }
  .tt-kosul { font-family:'JetBrains Mono',monospace; font-size:10.5px; line-height:1.6; color:#7DD3FC;
              background:rgba(56,189,248,.07); border-left:2px solid rgba(56,189,248,.45);
              padding:7px 11px; margin-bottom:11px; }
  .tt-baslik { font-family:'Sora',sans-serif; font-size:15px; font-weight:600; color:#F1F5F9;
               line-height:1.35; letter-spacing:-.012em; margin-bottom:6px; }
  .tt-ozet { font-size:12.5px; line-height:1.6; color:#94A3B8; }
  .tt-uyari { font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.1em;
              color:#4A5B70; margin-top:10px; display:block; padding-top:8px;
              border-top:1px solid rgba(255,255,255,.07); }
  /* Üretim zinciri — hangi adımın dil modeli olduğu görünür olsun */
  .uz-zincir { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px;
               background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.09); margin-top:14px; }
  .uz-adim { background:#0A1626; padding:11px 12px; }
  .uz-no { font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.12em; color:#3E5069; }
  .uz-ad { font-family:'Sora',sans-serif; font-size:12.5px; font-weight:600; color:#F1F5F9; margin-top:4px; }
  .uz-ne { font-size:11px; line-height:1.45; color:#64748B; margin-top:4px; }
  .uz-adim.dm { background:#101F35; }
  .uz-adim.dm .uz-ad { color:#C4B5FD; }
  @media (max-width:760px){ .uz-zincir { grid-template-columns:repeat(2,minmax(0,1fr)) !important; } }

  /* ---- Dört yol: durum seçimi ve karar satırı ---- */
  .dy-karar { padding:12px 15px; margin-bottom:12px; border-radius:3px; font-size:13.5px; line-height:1.65; }
  .dy-karar.biz { background:rgba(167,139,250,.07); border:1px solid rgba(167,139,250,.45); color:#CBD5E1; }
  .dy-karar.baska { background:rgba(56,189,248,.06); border:1px solid rgba(56,189,248,.42); color:#CBD5E1; }
  .dy-karar b { color:#F1F5F9; }
  .dy-karar .rozet { font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.12em;
                     font-weight:700; display:block; margin-bottom:6px; }
  .dy-karar.biz .rozet { color:#A78BFA; }
  .dy-karar.baska .rozet { color:#38BDF8; }
  #dy-tablo tr.sonuk td { opacity:.3; transition:opacity .2s linear; }
  #dy-tablo tr.vurgu td { background:rgba(167,139,250,.07); }

  /* ---- Kurulum: hangi adım kime düşüyor ----
     "Ne kadarı bana düşüyor?" kurulum vaadine yöneltilen ilk sorudur;
     adımların sahibini işaretlemek onu cevaplıyor. */
  .ku-kim { font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.12em; font-weight:700;
            padding:3px 7px; border-radius:2px; flex:0 0 auto; }
  .ku-kim.siz { background:rgba(56,189,248,.16); color:#7DD3FC; }
  .ku-kim.biz { background:rgba(167,139,250,.16); color:#C4B5FD; }

  /* ---- EİDS: elle mi, gömülü mü ------------------------------------------
     "EİDS uyumlu" demek bir şey anlatmıyor; değeri elle yapılan işin ortadan
     kalkmasında. İki sütun yan yana konunca fark kendini anlatıyor. */
  .ed-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px;
             background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.10); }
  .ed-sut { background:#0A1626; padding:14px 16px; }
  .ed-sut.gomulu { background:#101F35; }
  .ed-bas { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.12em;
            font-weight:700; margin-bottom:4px; }
  .ed-bas.elle { color:#F87171; }
  .ed-bas.gomulu { color:#A78BFA; }
  .ed-alt { font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.06em;
            color:#4A5B70; margin-bottom:11px; display:block; }
  .ed-adim { display:grid; grid-template-columns:19px 1fr; gap:9px; padding:7px 0;
             border-bottom:1px solid rgba(255,255,255,.055); align-items:start; }
  .ed-adim:last-child { border-bottom:0; }
  .ed-no { font-family:'JetBrains Mono',monospace; font-size:9px; color:#3E5069; padding-top:2px; }
  .ed-sut.gomulu .ed-no { color:#7C6BB0; }
  .ed-ne { font-size:12.5px; line-height:1.5; color:#94A3B8; }
  .ed-sut.gomulu .ed-ne { color:#CBD5E1; }
  .ed-otomatik { font-family:'JetBrains Mono',monospace; font-size:7.5px; letter-spacing:.1em;
                 color:#A78BFA; display:block; margin-top:3px; }
  @media (max-width:620px){ .ed-grid { grid-template-columns:1fr !important; } }

  /* ---- Çıkış dökümü: ne, hangi biçimde, ne zaman -------------------------
     "Kilitlenmezsiniz" bir güvence cümlesi; kanıtı ne götürdüğünüzün tek tek
     yazılması. Son satır kapsam dışını söylüyor — onu yazmak diğerlerini
     inandırıcı kılıyor. */
  .ck-satir { display:grid; grid-template-columns:minmax(0,1fr) 116px 128px; gap:12px;
              align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .ck-satir:last-child { border-bottom:0; }
  .ck-baslik { border-bottom:1px solid rgba(255,255,255,.14); padding-bottom:7px; }
  .ck-baslik span { font-family:'JetBrains Mono',monospace; font-size:8.5px;
                    letter-spacing:.12em; color:#4A5B70; }
  .ck-ne { font-size:13px; color:#CBD5E1; line-height:1.4; }
  .ck-bicim { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.06em; color:#94A3B8; }
  .ck-zaman { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.06em;
              padding:4px 8px; border-radius:2px; text-align:center; }
  .ck-zaman.hemen { background:rgba(52,211,153,.15); color:#34D399; }
  .ck-zaman.sizde { background:rgba(148,163,184,.14); color:#94A3B8; }
  .ck-zaman.disi { background:rgba(248,113,113,.14); color:#F87171; }
  .ck-satir.disi .ck-ne, .ck-satir.disi .ck-bicim { color:#64748B; }
  @media (max-width:620px){
    .ck-satir { grid-template-columns:minmax(0,1fr) 104px !important; gap:5px 10px; }
    .ck-bicim { grid-column:1; font-size:9px; }
    .ck-zaman { grid-column:2; grid-row:1; }
    .ck-baslik { display:none; }
  }
  @media (max-width:620px){ .gv-satir { grid-template-columns:minmax(0,1fr) 92px; } .gv-ad { font-size:12px; } }
  @media (prefers-reduced-motion:reduce){ .gv-rozet, .gv-btn { transition:none !important; } }

  /* Çapa hedefleri sticky nav'ın altına düşmesin */
  #kimlik, #basla, [id^="wl-"] { scroll-margin-top: 96px; }
  @media (max-width:980px) {
    .id-pick { grid-template-columns:1fr 1fr; }
    .sk-menu span:nth-child(n+4) { display:none; }

  /* ===== A.2 · KARŞILAŞTIRMA ===============================================

  function Karsilastirma() {

    ];

    var ortak = [
      ["Veri motoru", "ProX — tek kaynak, dört sürüme aynı API ile bağlanır"],

    var head = '<tr><th style="' + css({ padding: "10px 14px 10px 0", borderBottom: "1px solid " + C.borderStrong }) + '"></th>'

        }).join("") + '</tr>';

    function grupBasligi(etiket, not, renk) {
      return '<tr><td colspan="5" style="' + css({ padding: "16px 0 7px", borderBottom: "1px solid " + C.border }) + '">'

    var satirDegisen = degisen.map(function (r) {
      return '<tr><td style="' + css({ padding: "9px 14px 9px 0", borderBottom: "1px solid " + C.border, verticalAlign: "top" }) + '"><span style="' + mono(9.5, C.textFaint, "0.1em") + '">' + r[0].toLocaleUpperCase("tr-TR") + '</span></td>'

                 + '<span style="' + mono(10.5, C.textSec, "0.02em") + '">' + cell + '</span></span>';
            } else if (r[2] === "yazitipi") {
              /* Yazı tipi adı KENDİ yazı tipiyle diziliyor — üçü de sayfada yüklü.
                 Adı okumak yerine farkı görüyorsunuz. */
              ic = '<span style="' + css({ fontFamily: "'" + cell + "',sans-serif", fontSize: 17, fontWeight: 600, color: C.textPri, letterSpacing: "-0.01em", display: "block", lineHeight: 1.2 }) + '">' + cell + '</span>'

    return NX.SubSection("A.2", "Aynı çekirdek, ayrı kimlikler", "TEMA = DOSYA TAKASI · MOTOR FORKLANMAZ",
      '<p style="' + css({ fontSize: 15.5, lineHeight: 1.68, color: C.textSec, marginBottom: 6, maxWidth: 700 }) + '">Tasarımı değiştirmek motoru riske atmaz: renk ve tipografi ayrı bir dosyadadır. Bu yüzden sizin logonuza göre yeni bir arayüz üretmek günler değil saatler sürer.</p>'

  /* ===== B · VERİ HENDEĞİ ==================================================
     ÖNEMLİ — bu grafik yalnız YAPISAL olarak doğru olanı çizer.
     Önceki sürümde çubuk opaklığı Math.sin() ile üretiliyordu ama altyazı
     "opaklık o ayın kayıt yoğunluğu" diyordu; yani elimizde olmayan bir ölçümü
     iddia ediyordu. Bölümün tamamı "verimiz gerçek" savını taşıdığı için bu
     doğrudan savı çürütüyordu. Uydurma kaldırıldı:
       · çubuk yüksekliği = o aya kadar BİRİKMİŞ seri derinliği (tanımı gereği
         doğru: 257 ay boyunca her ay bir katman eklenir, ölçüm değil sayım)
       · opaklık tekdüze — hiçbir şey iddia etmiyor
       · olay işaretleri gerçek tarihlerden HESAPLANIYOR, elle girilmiyor
     Aylık kayıt yoğunluğu gerçek verisi geldiğinde `yogunluk` dizisi doldurulup
     çubuk yüksekliği ona bağlanabilir; altyazı da o zaman güncellenmeli. */
  var TRENCH_BAS = [2005, 1];     /* Ocak 2005 — serinin ilk ayı */
  var TRENCH_N = 257;             /* Ocak 2005 → Mayıs 2026 = 257 ay */
  var AY_ADI = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",
                "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

  function ayIndeksi(yil, ay) { return (yil - TRENCH_BAS[0]) * 12 + (ay - TRENCH_BAS[1]); }
  function indeksAy(i) {
    var top = (TRENCH_BAS[1] - 1) + i;
    return { yil: TRENCH_BAS[0] + Math.floor(top / 12), ay: (top % 12) + 1 };
  }
  function ayEtiket(i) { var d = indeksAy(i); return AY_ADI[d.ay - 1] + " " + d.yil; }

  function Hendek() {
    var W = 1160, H = 248, N = TRENCH_N, x0 = 8, step = (W - 16) / (N - 1);
    var taban = H - 34, tavan = 26, i;

    var lines = "";
    for (i = 0; i < N; i++) {
      /* Doğrusal artış: her ay bir katman. Gürültü YOK — sahte desen üretmez. */
      var h = 9 + ((i + 1) / N) * (taban - tavan - 9);
      lines += '<line x1="' + (x0 + i * step).toFixed(2) + '" y1="' + taban
        + '" x2="' + (x0 + i * step).toFixed(2) + '" y2="' + (taban - h).toFixed(1)
        + '" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.42"/>';
    }

    /* Gerçek tarihler → indeks. Etiket yüksekliği çakışmayı önlemek için elle. */
    var OLAYLAR = [
      [2008, 9, "2008 · KÜRESEL KRİZ", 40],
      [2018, 8, "2018 · KUR ŞOKU", 62],
      [2021, 12, "2021 · KUR ŞOKU", 40],
      [2023, 2, "2023 · DEPREMLER", 84]
    ];
    var evt = OLAYLAR.map(function (e) {
      var idx = ayIndeksi(e[0], e[1]);
      var ex = (x0 + idx * step).toFixed(1);
      var sag = idx > N * 0.72;   /* sağ uçta etiket taşmasın, sola yasla */
      return '<line x1="' + ex + '" y1="' + taban + '" x2="' + ex + '" y2="' + e[3] + '" stroke="#F87171" stroke-width="1" stroke-opacity="0.5"/>'
        + '<circle cx="' + ex + '" cy="' + e[3] + '" r="2" fill="#F87171" opacity="0.85"/>'
        + '<text class="tr-evt-t" x="' + (Number(ex) + (sag ? -6 : 6)) + '" y="' + (e[3] + 3.5) + '" fill="#F87171" font-size="9" font-family="ui-monospace,monospace" letter-spacing="0.08em" opacity="0.85" text-anchor="' + (sag ? "end" : "start") + '">' + e[2] + '</text>';
    }).join("");

    /* Dar ekranda SVG ölçeği ~0.28'e düşüyor; 9px etiket 2.5px'e iniyor, okunmaz.
       Orada grafik içi etiketler gizlenip aynı bilgi bu künyeden veriliyor. */
    var olayKunye = '<p class="tr-evt-legend" style="' + mono(9, "#F87171", "0.06em") + css({ marginTop: 7, lineHeight: 1.6 }) + '">'
      + OLAYLAR.map(function (e) { return e[2]; }).join(" &nbsp;·&nbsp; ") + '</p>';

    var years = [2005, 2010, 2015, 2020, 2025].map(function (y) {
      var idx = ayIndeksi(y, 1);
      return '<line x1="' + (x0 + idx * step).toFixed(1) + '" y1="' + taban + '" x2="' + (x0 + idx * step).toFixed(1) + '" y2="' + (taban + 4) + '" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>'
        + '<text x="' + (x0 + idx * step).toFixed(1) + '" y="' + (H - 12) + '" fill="#4A5B70" font-size="9.5" font-family="ui-monospace,monospace" letter-spacing="0.1em" text-anchor="' + (idx === 0 ? "start" : "middle") + '">' + y + '</text>';
    }).join("");

    /* İmleç: fare/klavye ile taranan ay — tamamı hesaplanmış gerçek takvim */
    var imlec = '<g id="wl-tr-cur" opacity="0">'
      + '<line id="wl-tr-cur-l" x1="0" y1="' + tavan + '" x2="0" y2="' + taban + '" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.9"/>'
      + '<circle id="wl-tr-cur-d" cx="0" cy="' + taban + '" r="2.5" fill="#A78BFA"/></g>';

    var katman = [["İL", "81"], ["İLÇE", "973"], ["MAHALLE + KÖY", "50.000+"], ["KATEGORİ", "38"], ["AY", "257"]].map(function (k) {
      return '<div style="' + css({ padding: "9px 0", borderBottom: "1px solid " + C.border, display: "flex", justifyContent: "space-between", alignItems: "baseline" }) + '">'
        + '<span style="' + mono(9.5, C.textFaint, "0.12em") + '">' + k[0] + '</span>'
        + '<span style="' + mono(15.5, C.textPri, "-0.01em", 600) + '">' + k[1] + '</span></div>';
    }).join("");

    return NX.SubSection("B.1", "Ajanstan alamayacağınız kısım", "480M+ SATIR · 257 AY · MAHALLE DÜZEYİ · 2005’TEN BERİ",
      '<div class="wl-two" style="' + css({ gridTemplateColumns: "minmax(0,2.6fr) minmax(0,1fr)", gap: "0 36px", background: "transparent", border: "none" }) + '">'
      + '<div><div style="' + css({ background: C.deep, border: "1px solid " + C.borderStrong, padding: "12px 14px 6px", position: "relative" }) + '">'

    ];
    function tl(n) { return n.toLocaleString("tr-TR"); }

    var satirlar = KALEM.map(function (k, i) {

        +   '<span class="mk-cekirdek" style="width:' + (k.max ? (k.min / k.max) * 100 : 100).toFixed(2) + '%"></span></div></div>'
        + '<div class="mk-tutar">' + tutar + '</div>'

  /* ===== ÇALIŞMA ZAMANI ==================================================== */
  (function mount() {
    var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    /* ---- Türkiye radarı: 973 ilçe merkezinde açı-senkron tarama --------------
       Huzme ile ışıma AYNI açı hesabından besleniyor; nokta huzme üstünden
       geçtiği an yanıyor, sahte gecikmeyle değil. İl sınırları SVG'de (keskin,
       erişilebilir), 973 nokta + huzme canvas'ta (973 DOM düğümü kaldırmayalım).
       Kapsam görünsün diye sönük taban katmanı çevrimdışı canvas'a bir kez
       çizilip her karede tek drawImage ile basılıyor; kare başına yalnız yanan
       ~50-100 nokta yeniden çiziliyor. */
    (function radar() {
      var kutu = document.getElementById("tr-radar");
      var cv = document.getElementById("tr-cv");
      var pr = radarIzdusum();
      if (!kutu || !cv || !pr || !window.TR_ILCE || !window.TR_ILCE.d) return;

      var ctx = cv.getContext("2d");
      if (!ctx) return;

      var okuEl = document.getElementById("tr-read-v");
      var sayEl = document.getElementById("tr-cnt-v");

      /* Düzleştir + viewBox uzayında konum ve merkeze göre açı hesapla */
      var cx = RADAR_W / 2, cy = RADAR_H / 2;
      var N = [];
      for (var a = 0; a < window.TR_ILCE.d.length; a++) {
        var il = window.TR_ILCE.d[a], liste = il[2];
        for (var c = 0; c < liste.length; c++) {
          var x = pr.X(liste[c][1]), y = pr.Y(liste[c][2]);
          var t = Math.atan2(y - cy, x - cx);
          if (t < 0) t += Math.PI * 2;
          N.push({ ad: liste[c][0], il: il[0], x: x, y: y, t: t, vur: -1e9 });
        }
      }
      N.sort(function (p, q) { return p.t - q.t; });          /* açıya göre — dilim taraması O(log n + k) */
      var ACI = N.map(function (n) { return n.t; });
      var TOPLAM = N.length;

      /* Verilen açıdan büyük ilk noktanın indisi */
      function altSinir(t) {
        var lo = 0, hi = TOPLAM;
        while (lo < hi) { var m = (lo + hi) >> 1; if (ACI[m] < t) lo = m + 1; else hi = m; }
        return lo;
      }

      var ilYol = {};
      var yollar = kutu.querySelectorAll("path.tr-il");
      for (var p2 = 0; p2 < yollar.length; p2++) ilYol[yollar[p2].getAttribute("data-il")] = yollar[p2];

      var DONUS = 5200;           /* ms — bir tam tur */
      var KUYRUK = 0.42;          /* rad — huzme kuyruğu */
      var SONUM = 1500;           /* ms — nokta ışımasının sönme süresi */
      var cw = 0, ch = 0, k = 1, dpr = 1, taban = null, raf = 0;
      var sonAci = 0, turBasi = 0, turSayac = 0, sonOku = 0, sonIl = "";
      var ekranDisi = false;      /* IO ateşlenirse ekran dışında true olur; kare() atlar */

      function tabanCiz() {
        taban = document.createElement("canvas");
        taban.width = cv.width; taban.height = cv.height;
        var tc = taban.getContext("2d");
        tc.setTransform(dpr, 0, 0, dpr, 0, 0);
        tc.fillStyle = "rgba(148,163,184,.26)";
        var r = Math.max(0.6, k * 1.05);
        for (var i = 0; i < TOPLAM; i++) {
          tc.beginPath(); tc.arc(N[i].x * k, N[i].y * k, r, 0, 6.2832); tc.fill();
        }
      }

      function olcule() {

        if (!r.width || !r.height) return false;

        cw = r.width; ch = r.height; k = cw / RADAR_W;
        cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        tabanCiz();
        return true;
      }

      function huzmeCiz(aci) {
        var mx = cx * k, my = cy * k;
        var R = Math.sqrt(mx * mx + my * my) * 1.05;
        var DILIM = 22;
        for (var i = 0; i < DILIM; i++) {
          var a0 = aci - KUYRUK * ((i + 1) / DILIM), a1 = aci - KUYRUK * (i / DILIM);
          var alfa = 0.30 * Math.pow(1 - i / DILIM, 2.1);
          ctx.beginPath(); ctx.moveTo(mx, my); ctx.arc(mx, my, R, a0, a1); ctx.closePath();
          ctx.fillStyle = "rgba(56,189,248," + alfa.toFixed(4) + ")";
          ctx.fill();
        }
        /* öncü kenar */
        ctx.beginPath(); ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(aci) * R, my + Math.sin(aci) * R);

      function kare(zaman) {

           koşar. Yani duraklatma fail-open: üretimde tasarruf, bozuk ortamda çalışır. */

        var aci = ((zaman - turBasi) % DONUS) / DONUS * Math.PI * 2;

        /* sonAci → aci dilimindeki noktaları yak (tur başına sarma dahil) */

        var yeniVurus = null;
        for (var s = 0; s < dilimler.length; s++) {
          var i0 = altSinir(dilimler[s][0]), i1 = altSinir(dilimler[s][1]);

        sonAci = aci;

        ctx.clearRect(0, 0, cw, ch);
        if (taban) ctx.drawImage(taban, 0, 0, cw, ch);
        huzmeCiz(aci);

          var j0 = altSinir(pencere[w][0]), j1 = altSinir(pencere[w][1]);

              ctx.strokeStyle = "rgba(167,139,250," + ((g - 0.55) * 0.8).toFixed(3) + ")";

            if (ilYol[yeniVurus.il]) ilYol[yeniVurus.il].classList.add("hot");
            sonIl = yeniVurus.il;
          }
        }

        function imlecGoster(idx) {

        trench.addEventListener("focus", function () { imlecGoster(sonIdx < 0 ? 0 : sonIdx); });
        trench.addEventListener("blur", imlecGizle);
        trench.addEventListener("keydown", function (e) {
          var adim = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1

          if (e.key === "Home") { e.preventDefault(); imlecGoster(0); return; }
          if (e.key === "End") { e.preventDefault(); imlecGoster(TRENCH_N - 1); return; }

    /* ---- 1) Canlı gramer kanıtı ---- */

    /* ---- 2) Marka denemesi: gerçek ekran görüntüsünün üstünde canlı katman ---- */
    var brandIn = document.getElementById("wl-brand"), brandBox = document.getElementById("shot-brand");
    var bk = document.getElementById("bk");
    if (brandIn && brandBox && bk) {
      var sbName = document.getElementById("sb-name"), sbMark = document.getElementById("sb-mark");

      /* --- renk yardımcıları ------------------------------------------------
         Ton türetmeyi HSL'de yapıyoruz; sRGB'de doğrudan çarpmak koyu tonları

        return "#" + ik(r) + ik(g) + ik(b);

      function uygula() {

        /* Üstteki metin: siyah mı beyaz mı — ölçerek seçilir, tahminle değil */

        var onEl = document.getElementById("bk-on"); if (onEl) onEl.textContent = uzeri === "#ffffff" ? "beyaz" : "koyu";
        var kEl = document.getElementById("bk-kontrast");
        if (kEl) {
          /* 4.5:1 normal metin AA eşiği; altına düşerse gizlemek yerine söylüyoruz */
          var gecti = oran >= 4.5;
          kEl.className = "bk-chip " + (gecti ? "ok" : "dus");
          while (kEl.firstChild) kEl.removeChild(kEl.firstChild);
          kEl.appendChild(document.createTextNode("KONTRAST "));
          var oranEl = document.createElement("b");
          oranEl.textContent = oran.toFixed(2) + ":1";
          kEl.appendChild(oranEl);
          kEl.appendChild(document.createTextNode(gecti ? " AA ✓" : " AA altı"));
          kEl.title = gecti
            ? "WCAG 2.1 AA normal metin eşiği 4.5:1 — bu renk geçiyor."
            : "WCAG 2.1 AA normal metin eşiği 4.5:1. Bu renk büyük başlıkta kullanılabilir (3:1), gövde metninde önerilmez.";
        }

        var adlar = bk.querySelectorAll("[data-ad]");
        for (var a = 0; a < adlar.length; a++) adlar[a].textContent = gorunen;
        var harfler = bk.querySelectorAll("[data-harf]");
        for (var h = 0; h < harfler.length; h++) harfler[h].textContent = harf;
        var alan = bk.querySelector("[data-alan]");
        if (alan) alan.textContent = alanAdi(gorunen);
      }

      brandIn.addEventListener("input", uygula);

      var swatches = document.querySelectorAll(".wl-sw");
      var secici = document.getElementById("wl-pick");
      function renkSec(renk, kaynak) {
        aktifRenk = renk;
        for (var k = 0; k < swatches.length; k++) {
          swatches[k].setAttribute("aria-pressed", swatches[k].getAttribute("data-color") === renk ? "true" : "false");
        }
        if (secici && kaynak !== "pick") secici.value = renk;
        uygula();
      }
      for (var s = 0; s < swatches.length; s++) {
        (function (el) {
          el.addEventListener("click", function () { renkSec(el.getAttribute("data-color"), "sw"); });
        })(swatches[s]);
      }
      if (secici) secici.addEventListener("input", function () { renkSec(secici.value, "pick"); });

      uygula();   /* örnek marka ile açılışta dolu gelsin — boş kutu satmıyor */
    }

    /* ---- 3) Yapışkan kademe çubuğu ---- */
    var bar = document.getElementById("wl-bar"), kapanis = document.getElementById("basla");
    if (bar) {
      function barGuncelle() {
        var gecti = window.scrollY > 620;
        var kapanisGorunur = kapanis && kapanis.getBoundingClientRect().top < window.innerHeight;
        if (gecti && !kapanisGorunur) bar.classList.add("on"); else bar.classList.remove("on");
      }
      window.addEventListener("scroll", barGuncelle, { passive: true });
      window.addEventListener("resize", barGuncelle);
      barGuncelle();
    }

    /* ---- Dört yol: durum → ilgili satırlar + dürüst karar ------------------
       Üçüncü profil bizi değil ajansı işaret ediyor. Satılmayacak durumu
       söylemek, satılacak durumların iddiasını güçlendirir. */
    var dyBar = document.getElementById("dy-bar");
    var dyTablo = document.getElementById("dy-tablo");
    if (dyBar && dyTablo) {
      /* satır indeksleri SATIR dizisinin sırasıyla aynı:
         0 maliyet · 1 yayına çıkış · 2 veri · 3 içerik · 4 CRM
         5 EİDS · 6 değişiklik · 7 ayrılırsanız · 8 butik tasarım */
      var DY = {
        hiz: { satir: [0, 1, 3, 6], sinif: "biz", rozet: "SİZE UYAN YOL · NADAS",
               metin: "Yayına çıkış süresi ve içeriğin hazır gelmesi belirleyiciyse <b>NADAS</b> uygun. Ajans 3–6 ay, kendi ekibiniz 6–12 ay sürer; burada marka dosyanız ulaştıktan sonra 24 saat." },
        veri: { satir: [2, 4, 5], sinif: "biz", rozet: "SİZE UYAN YOL · NADAS",
                metin: "Bölge verisi, hazır CRM ve EİDS akışı arıyorsanız diğer üç yolun hiçbirinde bunlar gelmez. <b>257 aylık mahalle serisi</b> sonradan satın alınabilecek bir şey değil." },
        tasarim: { satir: [8, 6], sinif: "baska", rozet: "SİZE UYAN YOL · AJANS",
                   metin: "Sıfırdan, kimseye benzemeyen bir tasarım istiyorsanız <b>doğru adres bir ajanstır</b> — biz değiliz. Sektör sürümünü markanıza uyarlıyoruz; boş sayfadan başlamıyoruz. Bunu baştan söylemek ikimizin de vaktini kurtarır." }
      };
      var dyBtn = dyBar.querySelectorAll(".mod-chip");
      var dyKarar = document.getElementById("dy-karar");
      var dySatir = dyTablo.querySelectorAll("tr[data-satir]");

      function dyCiz(ad) {
        var t = DY[ad];
        for (var i = 0; i < dySatir.length; i++) {
          var idx = parseInt(dySatir[i].getAttribute("data-satir"), 10);
          var ilgili = !t || t.satir.indexOf(idx) >= 0;
          dySatir[i].classList.toggle("sonuk", !!t && !ilgili);
          dySatir[i].classList.toggle("vurgu", !!t && ilgili);
        }
        if (dyKarar) {
          if (t) {
            dyKarar.hidden = false;
            dyKarar.className = "dy-karar " + t.sinif;
            /* rozet + metin: metinde yalnız <b> var, sabit dizeden geliyor */
            dyKarar.innerHTML = '<span class="rozet">' + t.rozet + "</span>" + t.metin;
          } else { dyKarar.hidden = true; }
        }
        for (var b = 0; b < dyBtn.length; b++) {
          dyBtn[b].setAttribute("aria-pressed", dyBtn[b].getAttribute("data-dy") === ad ? "true" : "false");
        }
      }
      for (var d = 0; d < dyBtn.length; d++) {
        (function (el) {
          el.addEventListener("click", function () { dyCiz(el.getAttribute("data-dy")); });
        })(dyBtn[d]);
      }
    }

    /* ---- Tetikleyici gösterimi: koşul → örnek çıktı ---- */
    var ttSec = document.getElementById("tt-sec");
    if (ttSec) {
      var TT = {
        endeks: {
          kosul: "eğer  mahalle_endeksi(30 gün) değişim ≥ eşik  ise  bülten üret",
          baslik: "Moda’da metrekare değeri son 30 günde %6,4 yükseldi",
          ozet: "Mahallenin ortalama m² değeri eşiği aştı. Bülten, değişimin başladığı ayı, ilçe ortalamasıyla farkı ve son 12 aylık seyri içerir — hepsi hesaplanmış değerlerden."
        },
        siralama: {
          kosul: "eğer  ilçe_sıralaması(mahalle) ≠ önceki_sıralama  ise  bülten üret",
          baslik: "Kadıköy’de en çok değerlenen mahalle sıralaması değişti",
          ozet: "Sıralama değişimi kendi başına haberdir: hangi mahalle hangi sırayı aldı, kaç basamak oynadı ve bunu tetikleyen fiyat hareketi ne kadardı."
        },
        mevzuat: {
          kosul: "eğer  resmî_yayın ∩ hizmet_alanınız ≠ ∅  ise  bülten üret",
          baslik: "Hizmet alanınızdaki bir ilçede imar planı değişikliği yayımlandı",
          ozet: "İzlenen resmî kaynaklarda yalnızca sizin çalıştığınız il ve ilçelere değen yayınlar bültene dönüşür. Kaynak adı ve yayım tarihi metnin içinde geçer."
        }
      };
      var ttBtn = ttSec.querySelectorAll(".mod-chip");
      var ttKosul = document.getElementById("tt-kosul");
      var ttBaslik = document.getElementById("tt-baslik");
      var ttOzet = document.getElementById("tt-ozet");

      function ttCiz(ad) {
        var t = TT[ad] || TT.endeks;
        /* textContent — örnek metinler veri, işaretleme değil */
        if (ttKosul) ttKosul.textContent = t.kosul;
        if (ttBaslik) ttBaslik.textContent = t.baslik;
        if (ttOzet) ttOzet.textContent = t.ozet;
        for (var i = 0; i < ttBtn.length; i++) {
          ttBtn[i].setAttribute("aria-pressed", ttBtn[i].getAttribute("data-tt") === ad ? "true" : "false");
        }
      }
      for (var t2 = 0; t2 < ttBtn.length; t2++) {
        (function (el) {
          el.addEventListener("click", function () { ttCiz(el.getAttribute("data-tt")); });
        })(ttBtn[t2]);
      }
      ttCiz("endeks");
    }

    /* ---- Ziyaretçi işlevleri: türe göre süzme ---- */
    var zyBar = document.getElementById("zy-bar");
    var zyGrid = document.getElementById("zy-grid");
    if (zyBar && zyGrid) {
      var zyKart = zyGrid.querySelectorAll(".zy");
      var zyCip = zyBar.querySelectorAll(".mod-chip");
      var zySay = document.getElementById("zy-say");
      var zyBos = document.getElementById("zy-bos");
      function zySuz(tur) {
        var n = 0;
        for (var i = 0; i < zyKart.length; i++) {
          var goster = (tur === "*" || zyKart[i].getAttribute("data-tur") === tur);
          zyKart[i].hidden = !goster;
          if (goster) n++;
        }
        if (zySay) zySay.textContent = String(n);
        if (zyBos) zyBos.hidden = n > 0;
        for (var c = 0; c < zyCip.length; c++) {
          zyCip[c].setAttribute("aria-pressed", zyCip[c].getAttribute("data-zy") === tur ? "true" : "false");
        }
      }
      for (var z = 0; z < zyCip.length; z++) {
        (function (el) {
          el.addEventListener("click", function () { zySuz(el.getAttribute("data-zy")); });
        })(zyCip[z]);
      }
    }

    /* ---- Görünürlük matrisi: açık ilan ↔ özel portföy ---------------------
       Rozet metni ve rengi tek yerde tanımlı; 0=görmez, 1=görür, 2=işlenir.
       "İşlenir" ayrı bir durum: kayıt kapalı olsa da endeksi beslemeye devam
       eder — bölümün asıl anlattığı şey bu. */
    var gorunurluk = document.getElementById("wl-gorunurluk");
    if (gorunurluk) {
      var gvBtn = gorunurluk.querySelectorAll(".gv-btn");
      var gvRozet = gorunurluk.querySelectorAll(".gv-rozet");
      var GV_METIN = { 0: "GÖRMEZ", 1: "GÖRÜR", 2: "İŞLENİR" };

      function gvCiz(mod) {
        for (var i = 0; i < gvRozet.length; i++) {
          var d = gvRozet[i].getAttribute(mod === "acik" ? "data-acik" : "data-kapali");
          var istenen = gvRozet[i].getAttribute("data-istenen") === "1";
          /* İstenen izleyici görüyorsa olumlu; istenmeyen izleyici görüyorsa
             maruziyet. "İşlenir" her hâlde nötr. */
          var sinif = d === "2" ? "notr"
                    : istenen ? (d === "1" ? "istenen" : "notr")
                    : (d === "1" ? "gorur" : "gormez");
          /* Renk körü kullanıcı için: iki "GÖRÜR" durumunu METİNLE de ayır.
             Kırmızı "GÖRÜR" (maruziyet) ile mor "GÖRÜR" (istenen erişim) yalnız
             renkle ayrılıyordu; simge ile anlam renkten bağımsız hale geliyor. */
          var etiket = GV_METIN[d] || GV_METIN[0];
          if (sinif === "gorur") etiket += " ⚠";
          else if (sinif === "istenen" || sinif === "gormez") etiket += " ✓";
          gvRozet[i].textContent = etiket;
          gvRozet[i].className = "gv-rozet " + sinif;
        }
        for (var b = 0; b < gvBtn.length; b++) {
          gvBtn[b].setAttribute("aria-pressed", gvBtn[b].getAttribute("data-mod") === mod ? "true" : "false");
        }
      }
      for (var g2 = 0; g2 < gvBtn.length; g2++) {
        (function (el) {
          el.addEventListener("click", function () { gvCiz(el.getAttribute("data-mod")); });
        })(gvBtn[g2]);
      }
      gvCiz("kapali");   /* açılışta Özel Portföy — bölümün konusu bu */
    }

    /* ---- Maliyet çubukları: görünürlükte doldur, fail-open ---- */
    var maliyet = document.getElementById("wl-maliyet");
    if (maliyet) {
      var barlar = maliyet.querySelectorAll(".mk-bar");
      function barDoldur() {
        for (var i = 0; i < barlar.length; i++) {
          (function (b, gecikme) {
            setTimeout(function () { b.style.width = b.getAttribute("data-gen") + "%"; }, gecikme);
          })(barlar[i], reduce ? 0 : i * 110);
        }
      }
      try {
        if (window.IntersectionObserver) {
          var io3 = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io3.disconnect(); barDoldur(); } }, { threshold: 0.25 });
          io3.observe(maliyet);
        } else { barDoldur(); }
      } catch (e) { barDoldur(); }
      setTimeout(barDoldur, 1700);   /* güvenlik ağı: IO ateşlenmezse çubuklar boş kalmasın */
    }

    /* ---- Kademe odaklama: kart seçilince matris sütunu öne çıkar ----------
       Matriste 13 satır × 4 sütun var; okuyucu kendi kademesini gözle takip
       etmek zorunda kalıyordu. Kart seçilince o sütun vurgulanıyor, diğerleri
       soluyor, o kademede "—" olan satırlar sönüyor: "bende ne var" tek bakışta. */
    var tierKart = document.querySelectorAll(".tier-focus");
    var matris = document.getElementById("wl-matris");
    if (tierKart.length && matris) {
      var SUTUN_INDEKS = { "Yerel Uzman": 1, "ProX Investor": 2, "ProX Corporate": 3 };
      var aktifSutun = 0;   /* 0 = odak yok */

      var matrisDet = document.getElementById("wl-matris-det");
      function odakla(idx) {
        aktifSutun = (aktifSutun === idx) ? 0 : idx;   /* aynı karta tekrar basınca bırak */
        /* Kart seçilince kapalı matris açılsın — kart etkileşiminin görünür
           karşılığı. Bırakınca (aktifSutun 0) açık kalır; kullanıcı kendi kapatır. */
        if (aktifSutun && matrisDet && !matrisDet.open) matrisDet.open = true;
        var satirlar = matris.querySelectorAll("tr");
        for (var r = 0; r < satirlar.length; r++) {
          var hucre = satirlar[r].children;
          var yok = false;
          for (var c = 1; c < hucre.length; c++) {
            hucre[c].classList.remove("sonuk", "odak");
            if (!aktifSutun) continue;
            if (c === aktifSutun) {
              hucre[c].classList.add("odak");
              if ((hucre[c].textContent || "").trim() === "—") yok = true;
            } else { hucre[c].classList.add("sonuk"); }
          }
          if (yok) satirlar[r].classList.add("yok"); else satirlar[r].classList.remove("yok");
        }
        for (var k = 0; k < tierKart.length; k++) {
          var ad = tierKart[k].getAttribute("data-tier");
          tierKart[k].setAttribute("aria-pressed", (aktifSutun && SUTUN_INDEKS[ad] === aktifSutun) ? "true" : "false");
        }
        var not = document.getElementById("wl-matris-not");
        if (not) {
          not.textContent = aktifSutun
            ? "Seçili kademede olmayan satırlar soluk. Bırakmak için karta tekrar basın."
            : "Bir kademe kartına basın — o sütun öne çıksın.";
        }
      }

      for (var t = 0; t < tierKart.length; t++) {
        (function (el) {
          var idx = SUTUN_INDEKS[el.getAttribute("data-tier")] || 0;
          if (!idx) return;
          /* Gerçek <button>; Enter/Space'i tarayıcı kendi çalıştırır, CTA linki
             artık butonun DIŞINDA olduğu için closest("a") hilesine gerek yok. */
          el.addEventListener("click", function () { odakla(idx); });
        })(tierKart[t]);
      }
    }

    /* ---- Ödeme dönemi geçişi: aylık ⇄ yıllık peşin (2 ay bedava) ---- */
    var billBar = document.getElementById("wl-bill");
    var tierBox = document.querySelector(".wl-tier");
    if (billBar && tierBox) {
      billBar.addEventListener("click", function (e) {
        var b = e.target.closest("[data-bill]");
        if (!b) return;
        var mode = b.getAttribute("data-bill");
        tierBox.setAttribute("data-bill", mode);
        var chips = billBar.querySelectorAll("[data-bill]");
        for (var i = 0; i < chips.length; i++) {
          chips[i].setAttribute("aria-pressed", chips[i] === b ? "true" : "false");
        }
      });
    }

    /* ---- Modül ızgarası: kademeli açılış, fail-open ---- */
    var mods = document.querySelectorAll(".mod");
    if (mods.length) {
      var shown = false;
      function showMods() {
        if (shown) return; shown = true;
        for (var i = 0; i < mods.length; i++) {
          (function (el, d) { setTimeout(function () { el.classList.add("in"); }, d); })(mods[i], reduce ? 0 : i * 26);
        }
      }
      try {
        if (window.IntersectionObserver) {
          var io2 = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io2.disconnect(); showMods(); } }, { threshold: 0.08 });
          io2.observe(mods[0].parentNode);
        } else { showMods(); }
      } catch (e) { showMods(); }
      setTimeout(showMods, 1800);

      /* --- Modül gezgini: kategori süzme + arama ---------------------------
         Arama data-ad / data-ac niteliklerinden okunur, DOM metninden DEĞİL;
         çünkü vurgulama <mark> ekleyince metin bozulur ve ikinci arama kayar.
         Türkçe karşılaştırma için hem yerel küçültme hem aksan sadeleştirme
         yapılıyor: "sozlesme" yazan "Sözleşmeler"i bulabilsin. */
      var araEl = document.getElementById("mod-ara");
      var sayEl2 = document.getElementById("mod-say-n");
      var bosEl = document.getElementById("mod-bos");
      var cipler = document.querySelectorAll(".mod-chip");

      if (araEl && cipler.length) {
        var aktifKat = "*";

        function sadelestir(s) {
          return String(s || "").toLocaleLowerCase("tr-TR")
            .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
            .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/â/g, "a");
        }

        /* Eşleşen parçayı <mark> ile sar — kaynak metin niteliklerde saklı,
           her çağrıda sıfırdan kurulur, üst üste birikmez. */
        function vurgula(hedef, kaynak, terim) {
          if (!terim) { hedef.textContent = kaynak; return; }
          var d = sadelestir(kaynak), t = sadelestir(terim);
          var p = d.indexOf(t);
          if (p < 0) { hedef.textContent = kaynak; return; }
          hedef.textContent = "";
          hedef.appendChild(document.createTextNode(kaynak.slice(0, p)));
          var m = document.createElement("mark");
          m.textContent = kaynak.slice(p, p + terim.length);
          hedef.appendChild(m);
          hedef.appendChild(document.createTextNode(kaynak.slice(p + terim.length)));
        }

        function suz() {
          var terim = (araEl.value || "").trim();
          var t = sadelestir(terim), gorunen = 0;
          for (var i = 0; i < mods.length; i++) {
            var el = mods[i];
            var ad = el.getAttribute("data-ad") || "";
            var ac = el.getAttribute("data-ac") || "";
            var kat = el.getAttribute("data-kat") || "";
            var katUyar = (aktifKat === "*" || kat === aktifKat);
            var metinUyar = !t || sadelestir(ad).indexOf(t) >= 0 || sadelestir(ac).indexOf(t) >= 0;
            var goster = katUyar && metinUyar;
            el.hidden = !goster;
            if (goster) {
              gorunen++;
              vurgula(el.querySelector(".ad"), ad, terim);
              vurgula(el.querySelector(".ac"), ac, terim);
            } else if (el.querySelector("mark")) {
              /* Gizlenen kart eski vurgusunu taşımasın: tekrar görünür olduğunda
                 zaten yeniden kurulur ama arada bayat işaretle beklemesin. */
              vurgula(el.querySelector(".ad"), ad, "");
              vurgula(el.querySelector(".ac"), ac, "");
            }
          }
          if (sayEl2) sayEl2.textContent = String(gorunen);
          if (bosEl) bosEl.hidden = gorunen > 0;
        }

        for (var c = 0; c < cipler.length; c++) {
          (function (btn) {
            btn.addEventListener("click", function () {
              aktifKat = btn.getAttribute("data-kat");
              for (var k = 0; k < cipler.length; k++) {
                cipler[k].setAttribute("aria-pressed", cipler[k] === btn ? "true" : "false");
              }
              suz();
            });
          })(cipler[c]);
        }
        araEl.addEventListener("input", suz);
        /* type=search'ün yerleşik temizle düğmesi input yerine search üretir */
        araEl.addEventListener("search", suz);
      }
    }
  })();
})();
</script>
</body>
</html>
