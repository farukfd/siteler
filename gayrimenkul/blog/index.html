<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="../">
  <title>Meridyen Gayrimenkul</title>
  <script>try{sessionStorage.setItem('_ov','blog');}catch(e){}location.replace('../'+(location.search||'')+(location.hash||''));</script>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#dbe4f3;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}a{color:#5ea9ff;text-decoration:none;font-weight:600}</style>
</head>
<body><div><p id="gload">Yükleniyor…</p></div><script>
(function(){
  var L=((location.search.match(/[?&]lang=([a-z]{2})/)||[])[1])||localStorage.getItem('gm_lang')||'tr';
  var LG=['tr','en','ru','zh','ar']; if(LG.indexOf(L)<0)L='tr';
  document.documentElement.lang=L; if(L==='ar')document.documentElement.dir='rtl';
  var T={
    tr:['Yükleniyor…','Otomatik açılmazsa buraya tıklayın →'],
    en:['Loading…','Click here if it does not open automatically →'],
    ru:['Загрузка…','Нажмите здесь, если не открывается автоматически →'],
    zh:['加载中……','若未自动打开请点击这里 →'],
    ar:['جارٍ التحميل…','اضغطوا هنا إن لم يُفتح تلقائيًا →']
  }; var t=T[L]||T.tr;
  var p=document.getElementById('gload');
  if(p){p.textContent=t[0]+' '; var a=document.createElement('a'); a.href='../'+(location.search||'')+(location.hash||''); a.textContent=t[1]; p.appendChild(a);}
})();
</script>
</body>
</html>
