name: Deploy · GitHub Pages

# main'e her push'ta (veya elle "Run workflow") siteyi canlıya alır.
# Canlı URL: https://farukfd.github.io/siteler/  → kök index.html (hub) → danisman/ · gayrimenkul/ · degerleme/ · insaat/
# Not: 500-5000 domainli PRODUCTION için kendi sunucun kullanılır; burası kaynak-doğrulama + canlı demo/staging.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; yenisi eskisini iptal eder
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (tüm repo — hub + 4 site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
